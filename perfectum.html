    {name:'Phoenix', explain:'The phoenix — the bird that burns to ash and rises again — is the Solar animal par excellence, embodying the Sun\'s daily death and resurrection, the annual cycle of the solar year, and the alchemical principle of calcination and renewal. In magic it appeared in Solar talismans for renewal, invincibility, and the restoration of lost vitality. Its impossibility as a real animal did not diminish its operative force.'},
  ]},
  body:{ label:'Body Parts', icon:'⊗', items:[
    {name:'Heart', explain:'The heart is the Solar organ — the central, life-sustaining, heat-producing organ of the body. Just as the Sun is the center of the planetary system and the source of warmth, the heart is the center of the body and the source of vital heat. Medical astrology treated cardiac conditions as Solar, and Solar remedies (gold, saffron, celandine) were applied to heart complaints. Regulus, the star at the lion\'s heart, shares this Solar cardiac governance.'},
    {name:'Right Eye', explain:'The Sun governs the right eye — sight in general, and specifically the eye turned toward light. The Moon governs the left eye (the nocturnal, receptive eye). Ophthalmological conditions were assessed in terms of which eye was affected and whether a Solar or Lunar influence was at work. Solar herbs and stones were applied to treat right-eye ailments.'},
    {name:'Brain', explain:'The brain is shared between the Sun (as the seat of the rational soul and the vehicle of Solar illumination) and Mercury (as the organ of communication and thought). The Sun\'s governance of the brain refers specifically to its highest function — clear rational understanding and the reception of divine light — rather than the mechanical operations of cognition and memory, which are Mercurial.'},
    {name:'Sinews', explain:'The sinews — tendons and the connective tissue of the body — fall under the Sun for their role in transmitting force from the muscles. The Solar vital spirit was held to animate and sustain the sinews; when Solar influence was weak, the sinews became slack and the body lost its tone. Solar remedies were used for conditions of weakness and limpness in the connective tissue.'},
    {name:'Vital Spirits', explain:'The vital spirits (spiritus vitalis) are the pneumatic substance produced in the heart by the combination of blood and inhaled air. They are the most direct physical expression of Solar influence in the body — warm, light, rapidly moving through the arteries. Agrippa\'s system placed the vital spirits midway between the body\'s material substance and its rational soul, governed by the Sun as the mediating planetary power.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Royal Favour', explain:'Among the most practically valuable Solar operations: gaining the goodwill and patronage of rulers, powerful nobles, or any figure who occupied the Solar role in a social hierarchy. This required identifying the Solar election (Sun well-placed in the chart, free from malefic aspects), making a Solar talisman in gold or engraved with Solar images, and presenting oneself or one\'s petition at the appropriate moment.'},
    {name:'Health & Vitality', explain:'The broadest and most fundamental of the Solar operations: using Solar timing, herbs, stones, and suffumigations to restore and maintain the vital heat that underlies all health. Unlike Jupiter\'s health-bestowing virtue (which works on the blood and sanguine balance), Solar health operations work on the vital spirit itself — the deepest and most foundational level of physical well-being.'},
    {name:'Fame & Honour', explain:'Making one\'s name known and admired — not the formal dignity of Jupiter\'s conferral but the popular visibility that comes from being associated with Solar brilliance. Renaissance practitioners used Solar operations for the publication and reception of their works, for success in public performances, and for the kind of reputation that spread without requiring constant maintenance.'},
    {name:'Illumination & Prophecy', explain:'The Sun\'s light, directed inward, produces prophetic illumination — the capacity to see beyond the ordinary limits of time and knowledge. Solar operations for prophecy involved fasting, Solar incenses (frankincense, cinnamon, laurel), and gazing into Solar reflections at the appropriate hour. The tradition connected directly to the Delphic Apollo, the Solar deity of prophecy.'},
    {name:'Exorcism', explain:'Expelling unwanted spiritual presences through Solar light and virtue. Evil spirits, conceived as creatures of darkness and cold, could not persist in the presence of concentrated Solar force. The exorcist\'s role was to be a vehicle of Solar virtue — hence the historical importance of Solar timing for exorcistic ritual, Solar incenses (particularly frankincense), and the association of priestly authority with Solar governance.'},
  ]},
}},

venus: { name:'Venus', glyph:'♀', accent:'cyan', group:'planet', sub:'Hot · Moist · Phlegmatic', categories:{
  properties:{ label:'Properties', icon:'◈', items:[
    {name:'Hot & Moist', explain:'Venus is warm and moist — the lesser benefic\'s quality is the same combination as Jupiter\'s (Hot-Moist) but in a more intimate, sensory register. Where Jupiter\'s warmth is expansive and social, Venus\'s is personal and desiring. The moisture of Venus is connected to the fluids of desire and reproduction rather than the blood of vitality. It is the moist warmth of the skin and the senses.'},
    {name:'Phlegmatic (moist)', explain:'Venus\'s attribution to the phlegmatic humour (phlegm — cold and moist) seems to contradict her Hot-Moist elemental quality, but reflects the tradition\'s ambivalence about desire: it both warms (arousing) and cools (satisfying). Phlegm is moist and yielding — qualities associated with feminine receptivity and the soft, flowing nature of Venereal influence. The Moon shares the phlegmatic humour, reinforcing the feminine-moist axis.'},
    {name:'Feminine', explain:'Venus is feminine in Agrippa\'s scheme — receptive, attractive, drawing things toward herself rather than projecting outward. The Venereal mode of operation is eros — the attractive power that draws separated things into union. This differs from the Moon\'s femininity (which is reflective and responsive) in that Venus actively attracts; she is not passive but magnetically engaged.'},
    {name:'Nocturnal', explain:'Venus is a nocturnal planet, belonging to the Moon\'s sect. Her nocturnal quality connects her to the private, indoor, intimate sphere — the domestic and erotic space that contrasts with the public, daylit world of Jupiter and the Sun. Night is when desire operates most freely; Venus governs the bedroom, the garden at dusk, the private garden of the soul.'},
    {name:'Green · White', explain:'Venus\'s colours — green and white — are those of growth, freshness, and purity. Green is the colour of spring vegetation, of living things, of the quality of moistness made visible. White is the colour of the skin in the European tradition, of the Moon\'s light (Venus and Moon share the feminine palette), and of flowers. Both colours suggest the fresh, delicate, non-violent beauty of Venereal things.'},
    {name:'Friday', explain:'Friday is Veneris dies — Venus\'s day. In Norse religion it is Freya\'s day (Frigg\'s day), the goddess parallel to Venus. Friday was considered the most auspicious day for love and beauty operations, for musical performances, for diplomatic approaches, and for anything requiring charm and goodwill. It is also, in many cultures, a day with sacred overtones — the day of rest in Islam, the day of Christ\'s passion.'},
    {name:'7', explain:'Seven is Venus\'s number — though seven is also associated with the Moon and with the complete set of planets. In Venus\'s case it may relate to the seven notes of the musical scale (Venus governs music) or to the seven days of the week governed by Venus\'s central position in the feminine triad (Moon, Venus, and the hidden feminine dimension of Mercury). The 7×7 magic square of Venus sums to 175.'},
    {name:'Water / Air', explain:'Venus\'s elemental correspondences are double — Water for her moist, flowing quality and the domain of the senses and emotions, and Air for her warmth and her social, relational nature. This double attribution reflects her position as a planet that bridges the fluid (desiring, emotional) and the communicative (social, harmonious). She operates at the boundary of feeling and expression.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Causing Love', explain:'The primary Venereal operative virtue — inducing the state of erotic and emotional attraction in a person toward another. This is the most ancient form of celestial magic and the most morally fraught: it involves altering another person\'s interior state without their consent. Agrippa catalogues it without extensive ethical discussion; later magical tradition built elaborate warnings and conditions around love operations.'},
    {name:'Conferring Beauty', explain:'Venus makes beautiful — both in the cosmetic sense (improving the appearance of the operator) and in the deeper sense of conferring the quality that makes things attractive and pleasing. A Venereal talisman, properly made, was held to make its wearer more physically pleasing to others, to smooth their social interactions, and to create around them an atmosphere of grace and charm.'},
    {name:'Producing Harmony', explain:'Venus resolves conflict by introducing the principle of mutual attraction and shared pleasure into a situation. Where Jupiter reconciles through justice and Jupiter brings peace through Martial subjugation, Venus produces harmony through the discovery of what is genuinely shared and desired between parties. This made Venereal timing and materials useful in diplomatic and domestic mediation.'},
    {name:'Granting Fertility', explain:'Venus governs reproduction and the creative abundance of the living world. Operations for fertility in the human sense (conception), agricultural sense (the fertility of soil and seed), and artistic sense (creative generation) all drew on Venereal timing and materials. The connection to the generative organs, to flowers (which are the reproductive organs of plants), and to all seed-bearing things made this one of Venus\'s oldest and most practically sought virtues.'},
    {name:'Appeasing Discord', explain:'The gentle face of Venereal harmony: calming conflict, softening anger, making people disposed to like one another. Where Mars produces discord through heat, Venus dissolves it through moisture and sweetness. This virtue was used in households to ease domestic conflict, in communities to soothe feuds, and in diplomatic contexts to create the atmosphere in which negotiation became possible.'},
  ]},
  stones:{ label:'Stones', icon:'◇', items:[
    {name:'Emerald', explain:'Emerald is the Venereal stone above all — its deep green matches Venus\'s colour of fertile, living nature. It was held to preserve chastity when worn, to aid childbirth, to prevent epilepsy, and to protect against enchantment. The paradox that the stone of Venus preserves chastity reflects the tradition\'s understanding of Venus as governing the generative force in both its disciplined and undisciplined expressions.'},
    {name:'Lapis Lazuli', explain:'Lapis lazuli — the deep blue stone shot with gold pyrite — was one of the most precious materials of antiquity. Its blue connects it to both Venus and Jupiter (the sky-coloured stones are generally benefic). Its ancient use in art and cosmetics (ground lapis gave the deep blue of Renaissance paintings, and ancient Egyptians used it in eye makeup) reinforces its Venereal association with beauty and adornment.'},
    {name:'Sapphire (blue)', explain:'The lighter, clearer blue sapphire overlaps between Jupiter and Venus — Jovial when its legal-social dignity is emphasised, Venereal when its calm beauty and its connection to devotion and love are emphasised. The Venereal sapphire was associated with fidelity and with the kind of love that includes spiritual dedication. Rings of fidelity were set with sapphire.'},
    {name:'Coral', explain:'Coral is Venereal through its connection to the sea (Venus born from the sea) and to its delicate, branching, blood-red form. Red coral was used to protect children from evil spirits and was worn as a charm for beauty and fertility. Its organic origin (the skeleton of sea creatures) gave it a fluid, living quality distinct from the mineral solidity of most stones.'},
    {name:'Turquoise', explain:'Turquoise — sky-blue to green-blue — is Venereal through its colour and its watery, sky-reflecting quality. It was believed to change colour in response to the health of its wearer, making it a living diagnostic tool. Turquoise was associated with love and protection, particularly for women, and appears in Venereal talisman traditions across multiple cultures.'},
    {name:'Beryl (green)', explain:'The greenish beryl (distinct from emerald and from the pale beryl associated with Jupiter) falls under Venus through its colour and its association with seeing clearly into the truth of things — which Venus governs in the domain of relationships. Beryl was used in scrying bowls, and the art of crystallomancy was considered Venereal in some traditions, reflecting Venus\'s governance of the deeper truth of desire and feeling.'},
  ]},
  herbs:{ label:'Herbs & Plants', icon:'⚘', items:[
    {name:'Myrtle', explain:'Myrtle (Myrtus communis) is the Venereal plant above all others — sacred to Aphrodite/Venus across the entire ancient Mediterranean. Bridal wreaths were made of myrtle; it was planted in sacred gardens; its aromatic leaves were burned as Venereal incense. Medicinally it was used for conditions of the reproductive and urinary system. Its evergreen quality and sweet scent are its direct physical Venereal signatures.'},
    {name:'Rose', explain:'The rose is Venus\'s flower in the most universal sense of the modern Western tradition and the ancient one before it. Its scent, its beauty, its red colour (connecting to blood, to desire, to the heart), and its thorns (pleasure with pain — the Venereal paradox) make it the most symbolically complete of the Venereal plants. Rose water and rose oil were central to Renaissance cosmetics and Venereal perfumery.'},
    {name:'Vervain', explain:'Vervain (Verbena officinalis) is a deeply magical Venereal herb — used in love magic, in purification, and in the making of amuletic preparations across ancient and medieval traditions. Druids considered it sacred; Romans used it in ritual cleansing; it appears in virtually every magical tradition of Western Europe as a plant of love, protection, and sacred presence. Its Venereal quality is both erotic and purifying.'},
    {name:'Thyme', explain:'Thyme is Venereal through its sweet, aromatic quality and its association with courage (thymos — the vital breath — in Greek). It was a plant of the domestic and garden sphere — the cultivated, pleasant, ordered space Venus governs as opposed to the wild spaces of Mars and Saturn. Medicinally it was used as an antiseptic and lung tonic. Its name appears in the context of bravery and life force.'},
    {name:'Mint', explain:'Mint is shared between Venus and Mercury (for its sharp, penetrating scent — Mercurial) and Venus (for its refreshing, pleasurable quality — Venereal). In the Venereal register, mint was used in love preparations and as a digestive aid at feasts — the pleasurable table being Venereal space. Spearmint and peppermint both appear in Venereal herb lists.'},
    {name:'Violet', explain:'The violet\'s modest beauty, its purple colour (connecting to the royal-Jovial and the devotional-Venereal), and its sweet, transient scent make it Venereal. It was associated with love poetry (violets for Aphrodite in Greek lyrics), with spring (the season of Venus), and with the kind of gentle, unassuming beauty that the more dramatic rose could overwhelm. Violet oil was a standard Venereal perfume.'},
    {name:"Lady's Mantle", explain:'Lady\'s Mantle (Alchemilla vulgaris) is Venereal through its governance of feminine health — it was used for menstrual irregularities, for conditions of the womb, and as a general tonic for women. Its name directly connects it to the feminine principle. The dewdrops that collect in its folded leaves were considered alchemically potent — "celestial water" gathered from the morning air, combining Venereal and Lunar qualities.'},
  ]},
  metals:{ label:'Metals', icon:'⊕', items:[
    {name:'Copper', explain:'Copper is Venus\'s metal — bright, warm-toned, malleable, and beautiful. It was the metal of Aphrodite\'s island (Cyprus — the name may derive from "copper," or vice versa) and of all beautiful craft: mirrors, musical instruments, ornamental vessels. Copper does not rust like iron but develops a green patina — Venus\'s colour — over time. Venereal talismans were engraved or cast in copper.'},
    {name:'Brass', explain:'Brass is an alloy of copper and zinc — it inherits Venus\'s copper quality while adding a brighter, more golden tone. Musical instruments were often made of brass (horns, trumpets), linking it to Venus\'s governance of music. Its warmth and its use in decorative work maintained the Venereal character. In some alchemical lists brass occupied a position between copper (Venus) and gold (Sun), suggesting a Venus-Sun mediation.'},
  ]},
  animals:{ label:'Animals', icon:'⁂', items:[
    {name:'Dove', explain:'The dove is Venus\'s bird — the companion of Aphrodite, the symbol of peace and love across numerous traditions. Its gentle cooing, its paired nature (doves mate for life in the popular imagination), its white plumage, and its association with the olive branch and with reconciliation make it the most completely Venereal of birds. Dove parts appeared in love talismans and reconciliation operations.'},
    {name:'Sparrow', explain:'The sparrow was sacred to Aphrodite in Greek antiquity — Sappho\'s famous ode calls on Aphrodite riding in a chariot drawn by sparrows. Its commonness, its chirping social nature, and its (somewhat exaggerated) reputation for erotic activity in ancient sources made it the everyday Venereal bird as the dove was the noble one. Sparrows appeared in love magic preparations.'},
    {name:'Swan', explain:'The swan is Venereal through its beauty, its grace on water (the watery-Venereal element), and its mythological connection to Aphrodite and to Leda (the swan as erotic transgressor). Its white plumage is the Venereal colour of beauty and purity combined. In Renaissance art and magic the swan was associated with music, beauty, and the refinement of desire into art.'},
    {name:'Bee', explain:'The bee is Venereal for its production of honey (the sweetest natural substance — Venereal sweetness) and for its constant work with flowers (the Venereal domain of beauty and scent). Honey was a Venereal substance used in love preparations and in medical-cosmetic compounds. The hive\'s social order was also read as a Venereal society: ordered, productive, and centred on a queen.'},
    {name:'Goat', explain:'The goat appears here under Venus for its fecundity and its association with erotic abundance — it is the most fertile of domestic animals and was associated with Dionysian excess and the generative force of nature. This overlaps with its Martial attribution (through aggression and conflict), illustrating how animals could carry mixed planetary natures depending on which quality was foregrounded.'},
  ]},
  body:{ label:'Body Parts', icon:'⊗', items:[
    {name:'Loins', explain:'The loins — the lower back, hips, and generative region — are Venereal in Agrippa\'s mapping. The lower body is the domain of desire and generation, and Venus governs it as the planet of all generative, attractive force. Conditions of the loins were treated with Venereal timing, herbs, and stones; the region was also where Venereal suffumigations were directed in some magical procedures.'},
    {name:'Kidneys', explain:'The kidneys fall between Venus and Mars — Venus because of their anatomical proximity to the loins and their role in filtering the fluids of the lower body, Mars because of their forceful expulsive function. In the Venereal context, the kidneys\' health was connected to the vitality of the generative system; kidney stones were seen as a Martial intrusion into a Venereal region.'},
    {name:'Neck & Throat', explain:'The throat is Venereal because voice is beautiful, because the neck is an erotic part of the body in the tradition, and because Venus governs what is expressed through beauty rather than argument. The singing voice — the most Venereal form of expression — operates through the throat. Venereal herbs and stones were applied to throat conditions, particularly those affecting the voice.'},
    {name:'Genital Parts', explain:'The generative organs directly — the most obviously Venereal of body parts. Venus governs generation, desire, and the pleasures of the body in their most direct expression. Medical astrology treated disorders of the generative organs as primarily Venereal (or sometimes Martial, when inflammatory), and Venereal remedies were applied accordingly. The attribution is straightforward and ancient.'},
    {name:'Phlegm', explain:'Phlegm — the cold, moist humour — is shared between Venus and the Moon. Its Venereal quality relates to the fluid, yielding, receptive nature of desire rather than to coldness as such. The phlegmatic body type (heavy, soft, pale, slow) was considered Venereal in some constitutional models. Venereal remedies were used to reduce excess phlegm, which produced sluggishness and impotence.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Love Workings', explain:'The most ancient and most sought Venereal operation — using Venereal timing, herbs (vervain, myrtle, rose), copper or emerald, and specific images to attract a person\'s erotic attention toward another. The Picatrix contains extensive detail on love talismans; Agrippa describes the category without exhaustive procedure. The ethical weight of these operations was recognised but rarely foregrounded in operative texts.'},
    {name:'Concord & Peace', explain:'Venereal peace operations: using the planet\'s attractive, harmonising virtue to end conflicts between individuals or groups. Copper talismans with dove imagery were used in diplomatic contexts; Venereal incenses were burned in spaces of negotiation; and operations combining Venereal timing with Jovial moderation were the preferred magical approach to reconciliation.'},
    {name:'Beauty Talismans', explain:'Talismans made at Venereal elections to enhance the physical beauty and charm of the wearer. These were engraved in copper or set with emerald, turquoise, or lapis lazuli. Their purpose was both cosmetic (making the face more pleasing) and social (making the personality more attractive). The Renaissance theory of beauty connected physical grace to the reception of Venereal virtue from the celestial sphere.'},
    {name:'Fertility & Conception', explain:'Venereal operations for human fertility: timing conception to Venereal elections, using myrtle and rose in preparations for pregnant women, and wearing copper or emerald talismans engraved with appropriate imagery. Agricultural fertility was also addressed this way — planting at Venereal elections for crops whose fruit and flower were desired. Venus governs all generative abundance.'},
    {name:'Music & Arts', explain:'Venus governs the making and performing of music, and more broadly all the arts that produce beauty. Timing musical performances, the composition of poetry, and the creation of visual art to Venereal elections was a standard practice in the tradition. The connection between love (Venereal) and artistic creation (also Venereal) was assumed: both involved the drawing-forth of hidden beauty into manifest form.'},
  ]},
}},

mercury: { name:'Mercury', glyph:'☿', accent:'gold', group:'planet', sub:'Variable · Mixed', categories:{
  properties:{ label:'Properties', icon:'◈', items:[
    {name:'Cold & Dry (variable)', explain:'Mercury has no fixed elemental quality — it takes on the quality of whatever planet it is configured with, intensifying benefics and malefics alike. This variable nature reflects Mercury\'s function as the mediator and transmitter of all kinds of influence. When unaspected, it defaults to a somewhat cold-dry quality in Agrippa\'s scheme, but this is always provisional.'},
    {name:'Mixed Humours', explain:'Mercury has no fixed humoral correspondence — it participates in all humours according to context. This reflects the ancient understanding of Mercury as the divine messenger: he carries messages among all the gods and belongs completely to none of them. The mixed humour makes Mercury the planet of those who combine multiple constitutional types — the intellectual who is by turns sanguine, melancholic, and choleric as the subject requires.'},
    {name:'Masculine & Feminine', explain:'Mercury is both masculine and feminine — hermaphroditic, to use the term derived from Hermes+Aphrodite. When configured with masculine planets it becomes masculine (active, projecting); with feminine planets it becomes feminine (receptive, inward). This double gender makes Mercury the principle of communication itself: communication requires both speaking (masculine) and receiving (feminine).'},
    {name:'Diurnal & Nocturnal', explain:'Like its gender, Mercury\'s sect is variable — diurnal when it rises before the Sun (as morning star), nocturnal when it sets after. This connects to Mercury\'s observed astronomical behaviour: it never moves far from the Sun and alternates between appearing in morning and evening sky. Operationally, diurnal Mercury emphasized intellectual clarity; nocturnal Mercury, swift communication and trade.'},
    {name:'Mixed Colours', explain:'Mercury has no single colour — all colours are its, because it transmits all planetary qualities. In talismanic work this gave Mercury a mercurial (shifting, iridescent) colour quality: stones of mixed or changeable colour (opal, agate, certain agates) were Mercurial. The colour of quicksilver itself — bright, metallic, and shifting — was the paradigmatic Mercurial visual quality.'},
    {name:'Wednesday', explain:'Wednesday is Mercurii dies — Mercury\'s day. In the Germanic tradition it is Woden\'s day (Odin/Woden being the Norse parallel of Mercury: the psychopomp, the god of communication, knowledge, and the crossing of boundaries). Operations for learning, writing, trade, and communication were timed to Wednesday and the Mercurial hour.'},
    {name:'8', explain:'Eight is Mercury\'s number. The 8×8 magic square associated with Mercury in Agrippa sums to 260, with rows summing to 65. These numbers were used in Mercurial talisman construction and in numerological calculations. Eight also relates to the octave in music — Mercury governs the mathematical relationships of sound, which was itself a form of cosmic communication in the Pythagorean tradition.'},
    {name:'Earth / Air', explain:'Mercury\'s dual elemental association (Earth and Air) reflects its role as the intermediary between the dense physical world and the swift intellectual world. Earth connects Mercury to its role in writing and commerce — both practical, earthly activities. Air connects it to thought, speech, and the rapid transmission of intelligence. The combination makes Mercury the planet of practical intellect.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Sharpening the Intellect', explain:'Mercury\'s primary virtue in the cognitive domain — the ability to cut quickly and precisely through complex material, to perceive distinctions, to think clearly under pressure. This was the virtue sought by students, lawyers, physicians, and anyone whose work required rapid, accurate cognition. Mercurial talismans for intellectual sharpening were common in the learned tradition.'},
    {name:'Facilitating Trade', explain:'Mercury is the god of merchants and travelers — his caduceus marked trading places and guaranteed safe passage. The operative virtue here involved drawing down Mercurial influence into commercial negotiations to facilitate agreement, fair dealing, and profitable exchange. Timing major transactions to Mercurial elections was standard astrological-commercial practice.'},
    {name:'Conferring Eloquence', explain:'The capacity to express oneself clearly, persuasively, and with appropriate style — Mercurial eloquence was the virtue sought by speakers, writers, and diplomats. This is distinct from Jovial dignity (which makes one respected) and Solar fame (which makes one visible): Mercurial eloquence makes one effective in communication. The tongue is Mercury\'s organ, and the Mercurial talisman worked through the tongue.'},
    {name:'Enabling Divination', explain:'Mercury governs the reading of signs and the transmission of hidden knowledge — two central divinatory activities. As the psychopomp who crosses the boundary between worlds, Mercury could convey knowledge from the invisible realm to the visible. Mercurial timing and materials were used for divination by lots, by writing, by mathematical calculation, and by many forms of sign-reading.'},
    {name:'Granting Speed', explain:'Swift Mercury — the winged messenger — confers rapidity on operations and on the operator. Speed of thought, speed of communication, speed of travel, and speed of execution were all Mercurial virtues. In magic, operations needing rapid effect were timed to Mercury\'s hour; Mercurial talismans were believed to hasten the resolution of uncertain situations.'},
    {name:'Binding & Loosing Words', explain:'Mercury governs the contractual and the binding force of language — the oath, the legal document, the written agreement. To bind by words (swear oaths, make contracts) and to loose what is bound by words (dissolve contracts, release oaths) both fall under Mercurial governance. This gave Mercury a legal-magical dimension that overlapped with Jupiter\'s justice but operated specifically through language.'},
  ]},
  stones:{ label:'Stones', icon:'◇', items:[
    {name:'Agate', explain:'Agate is the primary Mercurial stone — its banded, multi-coloured patterns exemplify the Mercurial quality of mixed, shifting appearance. It was used in the ancient world for engraved seals and signet rings, making it doubly Mercurial (the stone of writing and seals). Medicinally it was used to protect against fevers and, in some traditions, to make the wearer eloquent.'},
    {name:'Topaz (clear)', explain:'Pale, clear topaz falls under Mercury for its transparency and its quality of bringing clarity to thought. The analogy: as clear topaz transmits light without distortion, Mercury transmits meaning without garbling. It was used in Mercurial operations for intellectual clarity and for the success of writing and scholarly work.'},
    {name:'Vitriol', explain:'Vitriol (iron sulfate, among other sulfate minerals) is Mercurial through its caustic, sharp, penetrating quality and its role in alchemy. Aqua regia (the acid that dissolves gold) was called "vitriol" in some texts; the substance represented the dissolving, analytical power of Mercurial intelligence — the capacity to break down and separate what is combined. In talismanic work it appeared in preparations involving writing and seals.'},
    {name:'Chalcedony', explain:'Chalcedony appears under multiple planets (also Saturn and Deneb Algedi) — its Mercurial attribution rests on its pale, communicative quality and its historical use in orator\'s amulets. Roman public speakers were said to wear chalcedony rings to preserve their voice and eloquence — a directly Mercurial application. Its smooth, light surface was read as analogous to clear, flowing speech.'},
    {name:'Emerald (pale)', explain:'The pale or lighter emerald — distinct from the deep Venereal variety — was associated with Mercury for its clear, communicative green-light quality. Mercury was sometimes depicted in green in alchemical imagery (verdigris — copper\'s green patina — was also Mercurial). Pale emerald was used in operations for quick thinking and for preserving the memory of read texts.'},
  ]},
  herbs:{ label:'Herbs & Plants', icon:'⚘', items:[
    {name:'Hazel', explain:'Hazel is the Mercurial tree — the wood used for divining rods, for the caduceus (in some traditions), and for wands of communication and knowledge. Its quick, flexible branches were thought to transmit subtle vibrations (hence their use in water-finding). Its nuts (hazelnuts) were associated with wisdom — dropping into the well of knowledge in Celtic tradition. Hazel is the tree of knowing and finding.'},
    {name:'Marjoram', explain:'Marjoram appears under Mercury (and also Deneb Algedi) for its aromatic, mind-clearing quality. It was used medicinally for headaches, for improving memory, and for clearing Saturnian heaviness from the mind — all Mercurial applications. Its warm, sweet scent was used in Mercurial suffumigations for intellectual work. It also had associations with the relief of grief, the mind\'s clearing after emotional heaviness.'},
    {name:'Parsley', explain:'Parsley is Mercurial through its finely divided, complex leaf structure (resembling the branching complexity of Mercurial thought) and its digestive action (Mercury governs the processes of breaking down and distributing nutrients — the body\'s own analytical operations). It was also associated with the dead and with boundary-crossing in ancient Mediterranean tradition, reinforcing Mercury\'s psychopompic character.'},
    {name:'Dill', explain:'Dill is Mercurial through its feathery, airy leaf structure and its carminative (gas-clearing) digestive action. Its seed heads were used in protective preparations against witchcraft — the fine, dispersed seeds imitating the dispersed, rapid quality of Mercurial influence. Dill appears in many herbals as a Mercurial herb for digestion, for the mind, and for mild protective magic.'},
    {name:'Lavender', explain:'Lavender is Mercurial through its combined mental and aromatic qualities — its scent was used to clear the mind, to preserve books (keeping insects from manuscripts was a practical Mercurial application), and to promote sleep with clear dreams (Mercury governing the transmission of messages even in sleep). Its purple-blue colour connects it also to the Jovial register.'},
    {name:'Fern', explain:'Fern is deeply Mercurial through its association with hidden knowledge and secret powers. Fern "seed" (spores, invisible to the naked eye before microscopy) was believed to confer invisibility — the ultimate Mercurial attribute. Fern was gathered at midsummer with elaborate ritual precautions and used in operations of concealment, swift movement, and the discovery of hidden things.'},
  ]},
  metals:{ label:'Metals', icon:'⊕', items:[
    {name:'Quicksilver', explain:'Quicksilver — liquid mercury — is Mercury\'s metal, and the connection is total: the metal bears the planet\'s name. Quicksilver\'s properties perfectly embody Mercurial qualities: it is liquid at room temperature (fluid, mobile, uncatchable), it is brilliant and reflective (clear, communicative), it flows instantly into any shape (variable, accommodating), and it is toxic when contained (concentrated Mercurial force is dangerous). It was the central alchemical substance.'},
    {name:'Mixed Alloys', explain:'Mercury\'s variable, mixed quality extended to alloys — mixtures of metals that partook of multiple planetary qualities simultaneously. Where each pure metal had a single planetary ruler, alloys had mixed rulerships that Mercurial intelligence could navigate. In the talismanic tradition, operations combining multiple planetary influences were sometimes cast in appropriate alloys.'},
  ]},
  animals:{ label:'Animals', icon:'⁂', items:[
    {name:'Fox', explain:'The fox is Mercurial through its proverbial cunning — the animal whose intelligence is its primary survival tool. It finds what is hidden, avoids traps by quick thinking, and communicates through complex behavioral signaling. Its reddish colour gives it a Martial tinge, but its operations are Mercurial: deception, speed, and finding hidden things rather than direct confrontation.'},
    {name:'Weasel', explain:'The weasel is Mercurial for its speed, its ability to slip through impossibly small spaces, and its sharp intelligence. In ancient and medieval tradition the weasel was a creature of transition — it moved through walls, through the boundary between spaces, as Mercury moved through the boundary between worlds. It appears in Mercurial preparations for swift action and concealment.'},
    {name:'Ape', explain:'The ape or monkey is Mercurial because of its imitative intelligence — it mimics human behaviour, it is clever with its hands, and it seems to understand without fully comprehending, which matched the Scholastic view of mere cleverness as distinct from true wisdom. In Egyptian tradition the baboon was sacred to Thoth (the Egyptian Mercury), god of writing and knowledge.'},
    {name:'Parrot', explain:'The parrot speaks — it mimics human language, transmits sounds without necessarily understanding them, and is associated with the Mercurial property of speech as transmission. Its colourful feathers also connected it to Mercury\'s mixed, variable quality. In some traditions the parrot was used in divination: its "random" utterances were interpreted as Mercurial messages.'},
    {name:'Ibis', explain:'The ibis is the bird of Thoth, the Egyptian equivalent of Mercury/Hermes. Thoth invented writing, governed knowledge and magic, and served as the divine scribe — all Mercurial functions. The ibis\'s distinctive curved beak was associated with the crescent moon (connecting to Mercury\'s nocturnal phase) and with the pen of the scribe. Its association with the Nile\'s measurement also linked it to mathematical and practical knowledge.'},
    {name:'Magpie', explain:'The magpie is Mercurial through its speech (it can mimic human sounds), its intelligence (it recognises itself in mirrors), its collecting behaviour (it gathers bright objects — Mercurial things), and its noisy, sociable, boundary-crossing nature. In European folklore the magpie was a creature of omen and of communication with the beyond — a Mercurial messenger bird.'},
  ]},
  body:{ label:'Body Parts', icon:'⊗', items:[
    {name:'Brain', explain:'Mercury governs the brain as the organ of practical intelligence and rapid cognition (the Sun also claims the brain, but for its higher, illuminative function). Mercury\'s brain is the working mind — the faculty that processes information, forms associations, and communicates outward through the tongue and the hands. Mercurial operations for the brain targeted memory and quickness of comprehension.'},
    {name:'Hands', explain:'The hands are Mercury\'s — the organs of skilled craft, writing, and the gestures of communication. They are the implements of all Mercurial activities: the scribe\'s hand, the merchant\'s hand extended in agreement, the conjurer\'s hand working signs and seals. Disorders of the hands (tremor, weakness, inability to write) were Mercurial afflictions treated with Mercurial remedies.'},
    {name:'Tongue', explain:'The tongue is Mercury\'s primary organ — the instrument of all verbal communication. Its health was a Mercurial concern: aphasia, stuttering, speech disorders of all kinds were Mercurial afflictions. Chalcedony and clear topaz were worn to preserve the voice and eloquence. The tongue is where Mercurial virtue enters the world most directly, converting inner knowledge into audible, communicable speech.'},
    {name:'Memory', explain:'Memory is not a body part but a faculty — Agrippa includes it here as a Mercurial capacity rather than a Jovial or Solar one. Mercurial memory is rapid associative recall — the ability to access stored information quickly for practical use, as distinct from the deep contemplative memory of Saturn or the illuminative memory of the Sun. The art of memory (the Renaissance mnemonic tradition) was Mercurial.'},
    {name:'Lungs', explain:'The lungs are Mercurial through their role in breath — breathing is the physical mechanism of voice and speech, and Mercury governs speech above all. The alternating rhythm of breath also has a Mercurial quality: regular, mechanical, the body\'s own oscillation. Mercurial herbs were used for respiratory conditions that affected the voice and the clarity of breathing.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Knowledge & Memory', explain:'The primary positive Mercurial operation: using Mercurial timing, stones (agate, chalcedony), herbs (hazel, lavender), and suffumigations to improve the retention and recall of learning. Students and scholars used this consistently. The operations were timed to Mercurial elections, the materials worn or burned at the hour of Mercury, and the intention focused specifically on what needed to be remembered.'},
    {name:'Commercial Success', explain:'Mercury\'s patronage of trade made commercial operations a natural domain for Mercurial magic. This involved timing negotiations, contracts, and transactions to Mercurial elections; using Mercurial seals on commercial documents; and wearing agate or quicksilver preparations to ensure the swift and favourable conclusion of business. The focus was speed, clarity, and good faith in exchange.'},
    {name:'Writing & Seals', explain:'The most specifically Mercurial operation: engraving seals, composing effective letters and documents, and creating written talismans (characters and sigils) at Mercurial elections. The written word was Mercurial substance — it captured meaning and transmitted it across space and time, doing exactly what Mercury himself did as divine messenger. The seal was the concentrated talismanic form of written communication.'},
    {name:'Divination Works', explain:'Using Mercurial timing and materials for all forms of divination — the reading of signs, the casting of lots, the interpretation of dreams in their communicative (rather than visionary) mode, and mathematical divination (astrology, numerology). Mercury governs the transmission of hidden knowledge into knowable form, and divination is the organised practice of that transmission.'},
    {name:'Eloquence Talismans', explain:'Talismans made at Mercurial elections specifically to improve the eloquence and persuasiveness of the wearer\'s speech and writing. These were used by lawyers arguing cases, by preachers composing sermons, by diplomats negotiating treaties, and by scholars presenting their work. The talisman worked by anchoring Mercurial virtue in a material carrier worn close to the throat or held in the hand during speech.'},
  ]},
}},

moon: { name:'Moon', glyph:'☽', accent:'cyan', group:'planet', sub:'Cold · Moist · Phlegmatic', categories:{
  properties:{ label:'Properties', icon:'◈', items:[
    {name:'Cold & Moist', explain:'The Moon\'s elemental quality — Cold and Moist — is the definition of Water as element and of the phlegmatic temperament. It is the combination that produces fluidity, receptivity, and change: cold resists action, moisture accommodates all forms. The Moon\'s cold moistness makes it the planet of tides, of growing things (which need cold moisture to germinate), of the body\'s fluid systems, and of all that waxes and wanes.'},
    {name:'Phlegmatic', explain:'Phlegm — the cold, moist humour — is the Moon\'s. It is the humour of the quiet, adaptable, watery temperament: slow to anger, easily moved by emotion, changeable in mood as the Moon changes phase. In excess the phlegmatic constitution produced sluggishness, depression of a fluid rather than heavy kind, and susceptibility to respiratory illness. Lunar operations addressed phlegmatic excess and deficiency.'},
    {name:'Feminine', explain:'The Moon is feminine in the most fundamental sense — it is the feminine luminary, the nocturnal counterpart to the masculine Sun. Its femininity is receptive (it reflects Solar light rather than generating its own), cyclical (its phases correspond to feminine physiological rhythms), and maternal (it governs growth, nourishment, and the capacity to carry life). The Moon-Sun polarity is the primary gender axis of the celestial world.'},
    {name:'Nocturnal', explain:'The Moon is the nocturnal luminary — she governs the night as the Sun governs the day. This makes her the planet of all that happens in darkness: sleep, dreams, unconscious processes, secret emotions, the movement of water at night, and all operations that must be conducted away from daylight scrutiny. Lunar magic was typically performed at night, with attention to the Moon\'s phase.'},
    {name:'White · Silver', explain:'The Moon\'s colours — white and silver — are the colours of her reflected light. Cold, clear, and slightly blue-toned, they contrast with the warm gold-yellow of the Sun. White objects, silver vessels, and pale materials participate in Lunar sympathy. The pearl is perfectly Lunar in colour — white, produced by a water creature, and spherical like the full Moon.'},
    {name:'Monday', explain:'Monday is Lunae dies — the Moon\'s day. Operations of the Moon were timed to Monday and to the Lunar hour, with the Moon\'s phase (waxing or waning, full or dark) further specifying the type of work. Waxing Moon for increase, waning for decrease; full Moon for the height of Lunar power; dark Moon for concealment and the most inward operations.'},
    {name:'9', explain:'Nine is the Moon\'s number — reflecting her position as the lowest (and therefore closest to Earth) of the seven planets in the geocentric order, and the nine-fold quality of her phases (new, waxing crescent, first quarter, waxing gibbous, full, waning gibbous, third quarter, waning crescent, dark). The 9×9 magic square of the Moon sums to 369, with rows summing to 41.'},
    {name:'Water', explain:'The Moon\'s element is Water — the most directly Lunar of the four elements. Water is cold and moist; it flows downward, fills any container, is moved by the Moon\'s gravity (tides), and supports the growth of all living things. Lunar magic worked most powerfully near water — rivers, the sea, wells, and rain. The Moon\'s governance of water extended to all the body\'s fluid systems.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Governing Tides & Flux', explain:'The Moon\'s observable, manifest virtue — its governance of the tides was empirically known in antiquity and provided the most convincing demonstration that celestial bodies could produce physical effects on Earth at a distance. This virtue extended in the Agrippan tradition from sea tides to all fluid movements in the body (blood, phlegm, semen) and in nature (sap in plants, moisture in soil).'},
    {name:'Ruling Dreams & Visions', explain:'The Moon governs the sleeping imagination — the faculty that produces dreams, visions, and the interior imagery of consciousness. Lunar operations for prophetic dreaming involved sleeping under the Moon\'s light, using Lunar herbs (mugwort, white poppy) as incense or pillow stuffing, and timing the operation to specific Lunar phases. The Moon transmits messages from the higher intelligences in the language of images.'},
    {name:'Conferring Invisibility', explain:'One of the Moon\'s most sought occult virtues — the capacity to become unseen, whether literally (through magical concealment) or socially (through going unnoticed in a crowd). Invisibility operations used dark Lunar hours (the Moon concealed by cloud or in her dark phase), Lunar herbs (fern, moonwort), and specific Lunar images engraved in silver. The Moon as the planet that waxes and wanes was herself expert in the art of disappearing.'},
    {name:'Promoting Growth', explain:'The Moon\'s cold moisture promotes germination and growth in the same way that spring rains do. Lunar gardening — planting by Lunar phase — is the most durable practical application of celestial correspondence, still practiced today. Agrippa inherited this from a long agricultural astrology tradition: seeds planted in the waxing Moon grow more vigorously; the full Moon draws moisture up into leaves and fruit.'},
    {name:'Facilitating Travel', explain:'The Moon governs journeys — particularly water journeys (the sea, rivers) but also overland travel, as the Moon lights the night traveler\'s way and her influence over chance encounters affected who one met and what one found. Operations for safe travel were timed to favorable Lunar phases and used Lunar materials. The Moon also governed the meeting of strangers — all those chance encounters that constitute travel\'s fabric.'},
    {name:'Shape-Changing Virtue', explain:'The Moon\'s own shifting form — from crescent to full to dark — made it the planet of all metamorphosis and transformation. The magical tradition of shape-shifting drew on Lunar virtue: the werewolf\'s transformation at the full Moon is the popular survival of this idea. More subtly, the Moon\'s virtue was used in operations that needed to transform one situation or state into another without direct confrontation.'},
  ]},
  stones:{ label:'Stones', icon:'◇', items:[
    {name:'Crystal', explain:'Clear rock crystal — quartz — is the quintessential Lunar stone: transparent, cold to the touch, water-clear, and associated across many cultures with the Moon\'s light. Crystal balls used for scrying were Lunar instruments; their transparency was believed to be a form of celestial purity that allowed the Moon\'s imagery to pass through and become visible. Crystal dew or "water of the Moon" was prized in the alchemical tradition.'},
    {name:'Moonstone', explain:'Moonstone (labradorite feldspar with adularescence — the internal glow) is named directly for its Lunar affiliation. Its blue-white shimmering interior light resembles moonlight on water — a straightforward sympathetic correspondence. It was used in talismans for travel, for the enhancement of intuition, and for the regulation of feminine physiological cycles. Its shifting internal light embodied the Moon\'s variable, fluid quality.'},
    {name:'Pearl', explain:'Pearl is the most perfectly Lunar of all substances: it is white, spherical (like the full Moon), produced by a water creature (oyster — the Moon governs water and its creatures), and cold to the touch. In many traditions pearls were believed to be formed by moonlight penetrating the oyster — a literal transmission of Lunar virtue into material form. They were used in Lunar talismans and in medicines for Lunar conditions.'},
    {name:'Selenite', explain:'Selenite (named for Selene, the Moon goddess) is a transparent variety of gypsum — clear, slightly luminous, and moon-pale. It was used in ancient Greek and Roman contexts as a transparent material for windows, and its moon-association was deliberate: the selenite window let in light that was, by sympathetic principle, Lunar in quality. Modern crystal work has rediscovered this association independently.'},
    {name:'Beryl (pale)', explain:'Pale beryl — bluish-white, water-clear — is Lunar by its colour and its water-like transparency. Where the green beryl belongs to Venus and the darker kinds to Jupiter, the palest, coolest varieties carry Lunar sympathy. Beryl was used in scrying (the "beryl" of magicians in the Renaissance) — held up to the Moon\'s light to receive her imagery.'},
  ]},
  herbs:{ label:'Herbs & Plants', icon:'⚘', items:[
    {name:'Willow', explain:'The willow is the Lunar tree above all others — it grows at the water\'s edge, it has soft, drooping branches that move in the slightest wind (like tides responding to the Moon), and its bark contains salicin (the precursor to aspirin), used for fever and pain since antiquity. In the magical tradition willow was used in Moon-goddess rites, in mourning (Lunar grief), and in operations for water, for flexibility, and for emotional fluidity.'},
    {name:'White Poppy', explain:'The white poppy (Papaver somniferum) is Lunar through its sleep-inducing, dream-producing quality. Sleep and dreams are Lunar domains; the poppy\'s opium brought sleep and vivid dreams with a quality of Lunar dissolution — the boundaries of waking selfhood dissolved in the poppy\'s influence as the Moon\'s light dissolved the sharp edges of day. It appears in both Lunar and Saturnian herb lists.'},
    {name:'Lettuce', explain:'Lettuce is Lunar for its water content, its cold nature, and its mildly soporific quality (it contains small amounts of lactucin, a sleep-inducing compound). In antiquity lettuce was associated with sexual abstinence (it was offered to Adonis — a dying and rising solar figure — suggesting its cooling effect on desire) and with sleep. Its pale, moisture-rich leaves are physically Lunar.'},
    {name:'Cucumber', explain:'The cucumber is Lunar by its high water content, its cool and refreshing quality, and its pale green-white flesh. Cool, moist, and internally watery, it is among the most directly Lunar vegetables. It was used in Renaissance cosmetics for its cooling properties on skin (a Lunar application — the skin being a Lunar organ in some lists) and in medical preparations for inflammatory conditions.'},
    {name:'Mugwort', explain:'Mugwort (Artemisia vulgaris) is named for Artemis, the Greek Moon goddess, and is among the most powerfully Lunar of herbs. It was used to promote menstruation, to aid childbirth, to produce prophetic dreams, and as a protection for travelers (particularly at night — the Moon\'s domain). It appears under both the Moon and other bodies (Regulus, Alkaid, Capella) where Lunar influence intersects with stellar virtue.'},
    {name:'Water Lily', explain:'The water lily is Lunar in every dimension: it grows in water (Lunar element), it opens and closes with the light (Lunar rhythm), its flowers are white (Lunar colour), and it was associated with the Moon goddess across ancient traditions. In medical-magical practice, water lily was used for conditions of excess heat and inflammation — its coldness countering the opposite extreme — and in Lunar operations for cooling passion.'},
    {name:'Moonwort', explain:'Moonwort (Botrychium lunaria) is a small fern whose fronds are shaped like crescent moons — the doctrine of signatures at its most literal. It was believed to open locks, to unshoe horses (allowing quiet night passage), and to confer invisibility: all Lunar operative virtues. Its rarity and the difficulty of finding it at night added to its magical prestige. It appears in the most practical of Lunar magical instructions.'},
  ]},
  metals:{ label:'Metals', icon:'⊕', items:[
    {name:'Silver', explain:'Silver is the Moon\'s metal — the white, reflective, cold, incorruptible metal that corresponds to the Moon as gold corresponds to the Sun. Silver does not generate light but reflects it; silver objects carry Lunar virtue by their colour and their cold brilliance. Lunar talismans were engraved in silver; the crescent Moon image was cut in silver for operations of change, travel, dreams, and feminine health. In alchemy silver was the end-product of a Lunar work.'},
  ]},
  animals:{ label:'Animals', icon:'⁂', items:[
    {name:'Cat', explain:'The cat is Lunar by its nocturnal nature, its luminous eyes that shine in darkness (gathering available light like the Moon gathering Solar light), and its connection to the Moon goddess across many traditions — most famously in Egyptian culture, where the cat goddess Bastet was a Lunar deity. Cats\' independence, their fluid movement, and their association with the night make them Lunar in Agrippa\'s sympathy network.'},
    {name:'Owl', explain:'The owl is the most famous nocturnal bird — its ability to see in darkness, its silent flight, its haunting call, and its associations with wisdom (Athena\'s owl) and with death all place it in the Lunar register. The owl\'s eyes, large and fixed forward, were compared to the Moon\'s face looking down from the sky. In magic, owl parts were used in Lunar operations for seeing what is hidden in darkness.'},
    {name:'Bat', explain:'The bat is Lunar and Saturnian simultaneously: Lunar by its nocturnal, erratic flight and its association with the cave (a womb, a Lunar interior space); Saturnian by its blindness in light and its connection to the dead. The bat navigates by sound in darkness — a form of Lunar echolocation that the tradition understood as a form of Lunar sense. Its wings appeared in Lunar preparations for invisibility and night operations.'},
    {name:'Frog', explain:'The frog is Lunar through its amphibious nature (living in both water and on land — bridging the Lunar water world and the terrestrial world), its emergence with the rains, its life cycle (egg, tadpole, frog — a visible metamorphosis like the Moon\'s phases), and its nocturnal calling. In antiquity frogs were associated with the Moon\'s fertility and with the flooding of rivers that brought agricultural abundance.'},
    {name:'Dog', explain:'The dog is Lunar through its association with Hecate, the Greek underworld Moon goddess whose retinue of howling dogs at the crossroads marked her presence. Dogs howl at the Moon (a popular observation that gave them their Lunar connection), and they were associated with the liminal spaces — the boundaries between life and death, inside and outside — that the Moon governs. Hecate\'s dogs were used in underworld operations.'},
    {name:'Hare', explain:'The hare is perhaps the most universally Lunar animal across world traditions — it is "the hare in the Moon" in European, Asian, and indigenous American folklore. Its nocturnal activity, its rapid reproduction, its erratic, darting movement (like the Moon\'s reflected light), and its connection to spring fertility all mark it as Lunar. In magic, hare\'s foot was a Lunar protective amulet.'},
  ]},
  body:{ label:'Body Parts', icon:'⊗', items:[
    {name:'Brain (moistures)', explain:'The brain falls under both the Sun (for its rational, illuminative function) and the Moon (for its fluid content and its role in dream and imagination). Lunar brain governance covers the brain\'s moisture — the cerebrospinal fluid, the humoral balance within the skull — and the faculty of imagination (phantasia), which produces the imagery of dreams. Lunar excess in the brain produced epilepsy, madness, and vivid but uncontrolled visions.'},
    {name:'Stomach', explain:'The stomach is Lunar — the organ most sensitive to emotional states (the "gut feeling"), the seat of digestion\'s first phase, and the organ most obviously affected by the Lunar cycle in sensitive people. It processes what is taken in and determines what is useful from what is not — a Lunar discernment operating at the level of nutrition rather than intellect. Lunar herbs were used for digestive disorders.'},
    {name:'Left Eye', explain:'The Moon governs the left eye as the Sun governs the right. The left eye is the nocturnal, receptive, imaginative eye — the eye that sees in the dark (or wishes to), the eye of inner vision and of the imagination\'s imagery. Left-eye conditions were treated with Lunar timing and materials, and operations for second sight often involved the left eye specifically as the receptive vessel of Lunar imagery.'},
    {name:'Menstrual Blood', explain:'The most directly Lunar of all physiological phenomena: the menstrual cycle\'s correspondence to the Lunar cycle was observed in antiquity and provided the strongest evidence of the Moon\'s governance over the female body. Lunar magic for women\'s health — regulating cycles, easing childbirth, addressing conditions of the womb — was among the most practically important applications of celestial medicine.'},
    {name:'Phlegm & Spittle', explain:'The cold, moist humour and the body\'s most obviously Lunar fluid: saliva, phlegm, and all the cold, clear, mucous secretions of the body. These fluids increased with the Moon\'s waxing, decreased with the waning — a principle applied in medical astrology to determine the best times for surgery (operations on the waning Moon produced less fluid and healed more cleanly) and for herbal purges.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Travel & Navigation', explain:'Lunar operations for safe and successful travel — the Moon lighting the traveler\'s way, governing the seas through which ships passed, and overseeing the chance encounters of the road. Navigation by the Moon (celestial navigation using Lunar positions) had a practical dimension alongside the magical one. Timing journeys to favorable Lunar phases and using Lunar protective amulets (moonstone, silver) was standard practice for traveling merchants and sailors.'},
    {name:'Dream Workings', explain:'Using the Moon\'s dominion over sleep and dreams to receive prophetic imagery, to communicate with departed spirits, or to plant suggestions in another\'s dreaming mind. Mugwort burned as incense at bedtime, moonstones placed under the pillow, and Lunar timing all contributed to this operation. The tradition of the prophetic dream extends from ancient incubation rites through the Renaissance and into the present.'},
    {name:'Invisibility', explain:'The signature operative application of the Moon\'s virtue of concealment: becoming unseen or unnoticed through the drawing-down of Lunar cloaking virtue. This required moonwort, specific Lunar timing (the dark Moon phase being most powerful for concealment), and silver talismans engraved with images of the Moon in her hidden phase. The operation was more often metaphorical — social invisibility — than literally physical.'},
    {name:'Water & Rain Magic', explain:'Operations for calling rain, for safe passage over water, for working with the tides, and for all magical work that operated through the medium of water. Lunar timing was essential for all operations involving fluids — pouring libations, working with mirrors and reflective surfaces, and conducting rituals at the water\'s edge. The Moon\'s demonstrated governance of tides gave water magic its most empirically grounded celestial backing.'},
    {name:'Works of Change & Flux', explain:'The Moon\'s most general operative virtue — transformation, change of state, the conversion of one thing into another. Where Mercury transforms through analysis and Mercury through communication, the Moon transforms through the natural rhythm of growth and decay. Waxing Lunar operations promote increase; waning operations promote decrease, elimination, and the natural conclusion of what has run its course.'},
  ]},
}},

/* ── BEHENIAN FIXED STARS ── */

algol: { name:'Algol', glyph:'★', accent:'red', group:'behenian', sub:'Perseus · ♄♂ · 26° Taurus', categories:{
  nature:{ label:'Nature', icon:'◈', items:[
    {name:'Saturnine & Martial', explain:'Algol\'s nature combines Saturn\'s cold, death-adjacent quality with Mars\'s violence — the most lethal pairing in the system. Ptolemy in the Tetrabiblos classified stars by their planetary nature, and Algol\'s hot-dry (Martial) and cold-dry (Saturnian) combination produced a star that governs extreme and irreversible harm. This is why Algol was consistently the most feared star in Arabic, Latin, and Renaissance astrology.'},
    {name:'Violent · Beheading', explain:'Algol\'s specific violent signature — decapitation — comes from its mythological context: it is the eye of the Gorgon Medusa, whose head Perseus carries and whose gaze kills. The star\'s name in Arabic is Ra\'s al-Ghul — the Demon\'s Head. In astrological tradition, planets or charts strongly afflicted by Algol were associated with violent death, specifically decapitation or loss of the head (in a physical or metaphorical sense — disgrace, the removal of one\'s standing).'},
    {name:'26° Taurus', explain:'Algol\'s ecliptic position at 26° Taurus (in the Renaissance epoch) was its operative address — the degree of the zodiac from which it cast its virtue downward onto the Earth. Talismanic work with Algol required the Moon or the hour ruler to be at or near this degree, and the star to be above the horizon and ideally culminating. The degree shifted slowly over the centuries due to precession.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Power over Enemies', explain:'Agrippa lists this as Algol\'s primary operative virtue — the capacity to gain decisive advantage over those who oppose you. The Gorgon\'s head, which turned enemies to stone, is the mythological image of this virtue. In practice, Algol operations for power over enemies used its talisman (an image of a head) in diamond, worked at the precise moment when the Moon was at 26° Taurus with Algol rising.'},
    {name:'Preservation of the Body', explain:'A paradoxical secondary virtue given the star\'s violent nature: Algol was believed to protect the body from physical harm. This is the magical principle of like repelling like — the star that governs violent death, when correctly worked, repels violent death from its bearer. The Gorgon\'s head in myth was used by Perseus as a weapon and then as a shield; both functions persist in the talisman\'s operative tradition.'},
    {name:'Audacity & Boldness', explain:'Algol\'s Martial quality, without the Saturnian darkening, produced boldness — the willingness to act without hesitation in dangerous situations. This virtue was sought by soldiers and by those who needed to project fearlessness. The star\'s own fearsome reputation transferred to its talisman: wearing an Algol talisman signaled a willingness to invoke the most dangerous stellar powers.'},
  ]},
  stone:{ label:'Stone', icon:'◇', items:[
    {name:'Diamond', explain:'Diamond is Algol\'s stone — consistent with the star\'s Martial-Saturnian nature and with the planetary attributes of both those planets (diamond appears under Mars primarily). Diamond\'s hardness, its extreme quality (it is the hardest natural substance), and its association with invincibility made it the appropriate material for a talisman of the most extreme stellar power. The diamond was engraved with the head image at the required astrological moment.'},
  ]},
  herb:{ label:'Herb', icon:'⚘', items:[
    {name:'Black Hellebore', explain:'Black hellebore is both the Saturnian herb and Algol\'s herb — reinforcing the star\'s Saturnine nature. It is violently toxic and was historically associated with madness both as a cause and as a purge (it was used to purge melancholic madness in desperate cases). Its appearance in Algol\'s talisman preparations reflected the star\'s governance of extreme and dangerous states. It was burned as suffumigation at the Algol election.'},
  ]},
  image:{ label:'Talisman Image', icon:'⬡', items:[
    {name:'Head of a Man', explain:'The talisman image for Algol is the head of a man — the mythological head of Medusa in its most generic and engraved form. This image was cut into diamond at the Algol election and worn or kept as a talisman. The image encapsulated the star\'s operative virtue: the power of the gaze, of the face as a weapon, and of the boundary between the living head and its violent separation from the body.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Against Enemies', explain:'The primary use of the Algol talisman: gaining decisive power over opponents. The Picatrix gives more explicit instruction than Agrippa; both agree on the fundamental operation. The talisman was not merely worn but activated — presented toward the enemy\'s direction, named with the enemy\'s name, and charged with the specific Algol virtue at the moment of making.'},
    {name:'Protecting Life', explain:'The second operative use: preserving the maker\'s body from violent harm. This was particularly sought by soldiers, by those involved in dangerous occupations, and by anyone who feared violent attack. The Gorgon\'s head as a protective apotropaic device is extremely ancient — it appears on Greek temples, shields, and armor precisely as this protective power. The talisman tradition inherits directly from this use.'},
    {name:'Instilling Terror', explain:'A psychological operative application: using the Algol talisman to project an aura of terrifying presence onto others. This worked through the sympathetic principle — the talisman carried Algol\'s death-adjacent virtue, which registered in the instinctive perceptions of those nearby. Whether this operated literally or through the subtle behavioral confidence of the person who believed themselves Algol-protected is an open question the tradition did not ask.'},
  ]},
}},

pleiades: { name:'Pleiades', glyph:'★', accent:'cyan', group:'behenian', sub:'Taurus · ☽♂ · 29° Taurus', categories:{
  nature:{ label:'Nature', icon:'◈', items:[
    {name:'Lunar & Martial', explain:'The Pleiades carry a mixed nature in Ptolemy\'s classification: Lunar (cold, moist, producing rain and storms) and Martial (hot, dry, active and aggressive in their weather effects). This combination explains the cluster\'s longstanding association with maritime danger: the Pleiades\' rising and setting marked the sailing season in ancient Mediterranean practice, and their storms could destroy fleets.'},
    {name:'Nebulous · Many-formed', explain:'The Pleiades are a cluster of many stars — a nebulous, foggy group rather than a single point. This many-ness was part of their operative character: they govern multitudes, swarms, and collectively behaving groups. The bees, small fish, and flocking birds that appear in their symbolic repertoire all reflect this quality of the many-as-one.'},
    {name:'29° Taurus', explain:'The Pleiades\' ecliptic position at 29° Taurus (Renaissance epoch) placed them at the very end of the sign — a degree associated with culmination and transition. In talisman work, the Moon passing through this degree while the Pleiades were prominent provided the operative window. The position at Taurus\'s end also connected them to the fixed quality of the sign, making their weather-governing virtue particularly reliable.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Sharpening Eyesight', explain:'The Pleiades\' virtue for eyesight comes from an interesting logic: to see the Pleiades clearly (all seven stars) required excellent vision, making them a natural test and symbol of visual acuity. In talisman work, crystal (their stone) was used in preparations for eye complaints, and operations for improving sight were timed to the Pleiades\' elevation. The cluster was a benchmark of vision in both practical and symbolic senses.'},
    {name:'Calling Spirits', explain:'The Pleiades\' Lunar-Martial nature made them effective for spirit evocation — the Lunar quality opened the boundary between worlds, and the Martial quality provided the force to compel attendance. The burning candle (their talisman image) was the ancient evocatory lamp — a light left burning to attract and guide spirits. This operation required precise timing to the Pleiades\' culmination.'},
    {name:'Causing Winds', explain:'The Pleiades governed maritime weather in antiquity — their heliacal rising announced the sailing season, their setting marked its close, and their appearance in storm conditions was ominous. This virtue was both feared (the winds that sank ships) and sought (the winds that filled sails for swift passage). Talisman work with the Pleiades could be directed either toward causing or toward calming specific wind conditions.'},
  ]},
  stone:{ label:'Stone', icon:'◇', items:[
    {name:'Crystal', explain:'Clear rock crystal is the Pleiades\' stone — Lunar by its cold, water-like transparency and connected to the sight virtue (crystal was used in scrying to receive imagery, paralleling the sharpened eyesight the star conferred). Crystal lenses and balls were Lunar instruments, and their attribution to the Pleiades specifically connected them to the cluster\'s visual benchmark quality.'},
    {name:'Dioptase', explain:'Dioptase — a vivid emerald-green copper silicate — is less commonly listed as a Pleiades stone but appears in some traditions for its optical clarity (dioptase was once mistaken for emerald, and its internal transparency was noted). Its green-cyan colour connects it to the Lunar-Martian nature of the Pleiades in some lists. It was used for eye preparations.'},
  ]},
  herb:{ label:'Herb', icon:'⚘', items:[
    {name:'Fennel', explain:'Fennel is the Pleiades\' herb — its connection to sight (fennel was used in eye wash preparations in ancient and medieval medicine), to the wind (its light, feathery fronds move in any breeze), and to the seasonal transitions the Pleiades marked make it appropriate. In Greek myth, fire was brought to humanity by Prometheus in a fennel stalk — a detail that connects fennel to the carrying of light and knowledge between worlds.'},
  ]},
  image:{ label:'Talisman Image', icon:'⬡', items:[
    {name:'Burning Candle · Lamp', explain:'The Pleiades\' talisman image is a burning light — candle or lamp. This image encapsulates the evocatory function (a light left burning for spirits), the visual function (light enables sight), and the cluster\'s role as a celestial marker (the Pleiades\' visibility was itself a form of light-signal for navigation and seasonal timing). The image was engraved in crystal at the election.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Sight & Perception', explain:'Operations for improving eyesight, for developing clearer perceptual capacity (including non-physical perception — second sight), and for treating eye conditions. These were timed to the Pleiades\' culmination and used crystal as the primary material. Eye washes prepared with Pleiades-sympathetic herbs and left to stand in the moonlight under the cluster\'s light were a practical medical-magical application.'},
    {name:'Spirit Work', explain:'Using the Pleiades\' virtue to call, communicate with, or work alongside spirits — particularly those of an airy or liminal character. The burning lamp operation: a lamp lit at the exact moment of the Pleiades\' culmination, with the appropriate suffumigation and verbal address, created a space in which the desired communication could occur. The cluster\'s multiple nature (seven stars) connected it to groups or councils of spirits.'},
    {name:'Commanding Winds', explain:'The most directly practical of the Pleiades\' operations for maritime and agricultural purposes: using the star\'s virtue to influence weather — specifically winds. Sailors sought this operation for favorable passage; farmers for rain. The operation required precise timing to the cluster\'s astronomical position and the use of crystal and fennel in the preparations. The Pleiades\' centuries-old role as weather-sign gave this operation its strongest traditional backing.'},
  ]},
}},

aldebaran: { name:'Aldebaran', glyph:'★', accent:'red', group:'behenian', sub:'Eye of Bull · ♂☿ · 9° Gemini', categories:{
  nature:{ label:'Nature', icon:'◈', items:[
    {name:'Martial & Mercurial', explain:'Aldebaran combines Martial force with Mercurial quickness and eloquence — a pairing that produces the fortunate, eloquent, capable leader. Mars gives it courage and forcefulness; Mercury gives it the intelligence and communication skills to use that force effectively. This combination explains why Aldebaran was considered one of the four Royal Stars of Persia, as it governed the combination of martial prowess and wise counsel.'},
    {name:'Fortunate · Royal', explain:'Aldebaran was one of the four Royal Stars (Regulus, Antares, Fomalhaut, and Aldebaran), ancient markers of the equinoxes and solstices in the Persian tradition. Its role as Watcher of the East and its prominence made it a star of first magnitude and first importance. In medieval and Renaissance astrology it was considered highly fortunate when unafflicted — bestowing honor, riches, and intelligence on those born under its influence.'},
    {name:'9° Gemini', explain:'Aldebaran\'s ecliptic position at 9° Gemini (Renaissance epoch) placed it in Mercury\'s sign — reinforcing its Mercurial quality within its Martial-Mercurial nature. Planets in early Gemini were in the neighborhood of Aldebaran\'s influence. Talisman elections required the Moon or a planet to be at this degree while the star was above the horizon.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Honour & Riches', explain:'Aldebaran\'s primary operative virtue: bringing the bearer into a position of honor and material abundance. This operates through the combined Mars-Mercury influence — the courage to pursue opportunity (Mars) and the eloquence to seize it (Mercury). Aldebaran talismans were worn by those seeking preferment, by merchants expanding into new markets, and by all who needed both to act decisively and to persuade effectively.'},
    {name:'Eloquence & Favour', explain:'The Mercurial aspect of Aldebaran\'s virtue specifically: the gift of speaking well and being received well. Aldebaran\'s talisman enhanced not just speech (as a pure Mercury talisman would) but the authority behind speech — the Mars dimension gave the words weight and the capacity to command as well as persuade. Orators, lawyers, and commanders all sought this combined virtue.'},
    {name:'Keeping Health', explain:'A secondary but significant virtue: Aldebaran\'s strong, fortunate nature extended to physical vitality. It was used in medical-astrological practice as a star whose influence could be drawn down to maintain robust health, particularly the kind of health that enabled demanding active work — consistent with its Martial quality of physical vigor.'},
  ]},
  stone:{ label:'Stone', icon:'◇', items:[
    {name:'Carbuncle · Ruby', explain:'The ruby or carbuncle is Aldebaran\'s stone — its red colour connecting to the Martial dimension, its inner fire to the combined Mars-Mercury quality of luminous, active intelligence. The stone was engraved with the talisman image at the Aldebaran election. Its attribution here (also appearing under Mars and the Sun) illustrates how major stones appear under multiple celestial bodies depending on which quality is emphasised in the operative context.'},
  ]},
  herb:{ label:'Herb', icon:'⚘', items:[
    {name:'Milk Thistle', explain:'Milk thistle is Aldebaran\'s herb. Its connection to the star rests on several qualities: its spiny, Martial defense mechanism; its white-veined leaves (a visual signature suggesting something mixed or marked); and its medicinal use for liver conditions — the liver being a Jovial organ, and Aldebaran\'s royal, fortunate quality overlapping with Jovial governance. In magic it was used in preparations for Aldebaran talisman work.'},
  ]},
  image:{ label:'Talisman Image', icon:'⬡', items:[
    {name:'Flying Man · God in Armour', explain:'Aldebaran\'s talisman image — a man in armour flying, or a figure of divine warrior aspect — captures the combined Mars-Mercury nature precisely: the armour and martial bearing (Mars), the flight (Mercury\'s swiftness and freedom from ordinary movement). This image was engraved on the ruby or carbuncle at the precise moment of the Aldebaran election. The flying armoured figure appears across traditions as the embodiment of courageous, swift, noble action.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
