    {name:'Honour & Success', explain:'The primary operative target of Aldebaran talisman work: achieving recognition, advancement in rank or reputation, and material success. The talisman was activated at the Aldebaran election and worn or presented in situations where honor was sought. Its Mars-Mercury virtue inclined superiors to notice the bearer\'s worth and inclined the bearer toward the bold, eloquent action that would demonstrate it.'},
    {name:'Health Preservation', explain:'Secondary operations using Aldebaran\'s strong, benefic nature to maintain physical robustness — particularly for those engaged in active, demanding work that put the body under strain. The talisman worked to reinforce the body\'s vital fire (Mars) and to keep the mind clear and responsive (Mercury), preventing the fatigue and cognitive dulling that could compromise performance.'},
    {name:'Eloquence', explain:'Targeted operations specifically for the improvement of speech and writing — the Mercurial aspect of Aldebaran\'s virtue engaged directly. For those who needed to speak to power, to argue a case, or to write persuasively, the Aldebaran talisman provided the combined force of martial directness and mercurial fluency that made communication effective beyond what either planet alone could provide.'},
  ]},
}},

capella: { name:'Capella', glyph:'★', accent:'yellow', group:'behenian', sub:'Auriga · ♂☿ · 21° Gemini', categories:{
  nature:{ label:'Nature', icon:'◈', items:[
    {name:'Martial & Mercurial', explain:'Like Aldebaran (which precedes it in the ecliptic by 12°), Capella has a Mars-Mercury nature — but Capella\'s application is specifically toward the common people rather than rulers and elites. Where Aldebaran governs kingly honour, Capella governs popular esteem. The Martial quality here is the direct, physical confidence that ordinary people respond to; the Mercurial quality is the ready communication that wins their goodwill.'},
    {name:'21° Gemini', explain:'Capella\'s position at 21° Gemini placed it firmly in Mercury\'s sign — deepening the Mercurial aspect of its dual nature. This position also meant that it shared the zodiacal neighborhood of Aldebaran (at 9°) and would be activated by similar transits, though its lower ecliptic latitude distinguished it from Aldebaran\'s influence in strict astrological analysis.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Honour from Common People', explain:'Capella\'s specific virtue: it grants not the dignity conferred by superiors (that is Aldebaran\'s and Jupiter\'s domain) but the esteem and goodwill of the broad population — the crowd, the market, the congregation. This made it valuable for public figures of a different kind: preachers, merchants with wide clientele, entertainers, and political figures who needed popular support rather than aristocratic patronage.'},
    {name:'Eloquence & Favour', explain:'The Mercurial gift shared with Aldebaran but directed toward a different audience: the eloquence that moves ordinary people rather than convinces the learned. Clear, direct, accessible speech — not the rhetorical sophistication of courtly address but the plain-speaking that wins trust and affection in a broad audience. Capella\'s talisman enhanced this specific register of Mercurial virtue.'},
  ]},
  stone:{ label:'Stone', icon:'◇', items:[
    {name:'Sapphire', explain:'Sapphire here (likely the deep blue variety) is listed as Capella\'s stone — its Jovial associations connecting to the popular honour and goodwill the star confers. Sapphire\'s traditional role in protecting against envy and promoting goodwill fit Capella\'s virtue well. Its coolness (sapphire is a cold, Saturnian-Jovial stone) tempers the Martial heat in Capella\'s nature, moderating aggression into productive energy.'},
  ]},
  herb:{ label:'Herb', icon:'⚘', items:[
    {name:'Horehound', explain:'Horehound is bitter, Martial in its sharpness, and strongly aromatic — it was used as a throat and lung remedy, which connects it to both the Mercurial throat and the Martial heat that could damage the respiratory system. Its inclusion as a Capella herb reflects the star\'s Mars-Mercury nature, with the Martial irritant requiring the Mercurial communicative herb to balance.'},
    {name:'Mint', explain:'Mint\'s clear, penetrating scent and its Mercurial quality of clarity and refreshment connect it to Capella\'s eloquence virtue. It was burned as a Mercurial suffumigation to sharpen the mind before speaking or writing. Its inclusion with Capella rather than with Venus or Mercury alone reflects the star\'s specific application toward direct, refreshing communication with broad audiences.'},
    {name:'Mugwort', explain:'Mugwort\'s appearance here (it also appears under the Moon, Regulus, and Alkaid) reflects its role as a general Lunar-Martial herb — it opens channels and sharpens perception. For Capella specifically, mugwort was used in preparations to enhance the directness and confidence of speech, connecting to the star\'s virtue of winning popular favour through bold, clear address.'},
  ]},
  image:{ label:'Talisman Image', icon:'⬡', items:[
    {name:'Man with Serpents', explain:'Capella\'s talisman image — a man holding or surrounded by serpents — reflects both the Mercurial caduceus (Mercury\'s staff entwined with serpents, symbol of communication and the crossing of boundaries) and the Martial quality of commanding dangerous things. The serpent-handler who shows no fear while managing the most dangerous creatures is the image of bold, Mercurial intelligence applied to the taming of what would destroy an ordinary person.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Popular Favour', explain:'The primary operation for Capella: gaining the spontaneous goodwill of a broad audience — the crowd that greets a speaker, the customers who prefer one merchant over another, the congregation that receives a preacher with warmth. The talisman worked by drawing down Capella\'s specific virtue for popular esteem, which operated through the Mercurial channel of communication reaching into the Martial register of direct, physical appeal.'},
    {name:'Eloquence', explain:'Eloquence here is specifically popular eloquence — the capacity to move and persuade ordinary people rather than to impress the learned. The distinction from Aldebaran\'s eloquence is a matter of register and audience: Aldebaran\'s eloquence works in courts and councils; Capella\'s works in markets and assemblies. Both are Mercurial, but Capella\'s is democratic where Aldebaran\'s is aristocratic.'},
  ]},
}},

sirius: { name:'Sirius', glyph:'★', accent:'yellow', group:'behenian', sub:'Dog Star · ♃♂ · 13° Cancer', categories:{
  nature:{ label:'Nature', icon:'◈', items:[
    {name:'Jovial & Martial', explain:'Sirius combines Jupiter\'s fortunate, expansive quality with Mars\'s heat and directness — producing a star of great power and benefit when well-worked. It is the brightest star in the sky, and its brilliance was read as an expression of this combined virtue: the Jovial abundance of light with the Martial intensity of heat. In ancient Egypt, Sirius\'s heliacal rising signaled the Nile flood, making it literally the source of agricultural abundance.'},
    {name:'Fortunate · Brilliant', explain:'Sirius is one of the most consistently fortunate stars in the tradition — its brilliance, its role as agricultural signal in Egypt, and its general associations with abundance and divine favour made it a star that operative magic could engage beneficently. Its brilliance (it is the brightest star visible from Earth) was read as the physical manifestation of its fortunate virtue: it shines out where dimmer stars are occluded.'},
    {name:'13° Cancer', explain:'Sirius at 13° Cancer (Renaissance epoch) placed it in the Moon\'s sign — the Lunar context tempering the Jovial-Martial nature with a moist, protective quality. Cancer\'s association with the home, with protection, and with nourishment fits Sirius\'s virtue of preserving health and warding off water dangers. The Lunar sign position also connected Sirius to the Egyptian Isis-Sirius tradition, where the star was the divine mother\'s marker.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Preserving Health', explain:'Sirius\'s primary operative virtue in the Agrippan tradition: maintaining robust physical health against disease and depletion. Its Jovial quality promoted sanguine vitality; its Martial quality gave the body\'s defenses (in modern terms) the force to resist attack. The combined effect was a strong, active form of health preservation — not the passive maintenance of balance but the active projection of vital force against threats.'},
    {name:'Gaining Allies & Custodians', explain:'Sirius governs those who protect: guards, custodians, loyal followers, and the social alliances that provide security. This connects to the dog imagery (Sirius as the Dog Star — faithful protection) and to the Jovial quality of legitimate authority over those who serve it. Talisman operations with Sirius were used to secure the loyalty and protection of people in positions to guard one\'s interests.'},
    {name:'Warding off Dangers from Water', explain:'Sirius\'s position in Cancer and its Egyptian association with the Nile flood (which was both life-giving and dangerous) gave it a specific virtue for protection at sea and from floods. The Jovial abundance could drown as easily as nourish; Sirius\'s talisman directed the star\'s water-adjacent virtue toward safety rather than danger. Maritime operations used the Sirius talisman for protection at sea.'},
  ]},
  stone:{ label:'Stone', icon:'◇', items:[
    {name:'Beryl', explain:'Beryl is Sirius\'s stone — its warm, watery clarity connecting to the Cancer placement and its transparent, protective quality connecting to the star\'s virtue of warding off harm. Beryl was used as a protective stone in travel talismans (the beryl traveler\'s stone was a common medieval preparation), and its attribution to Sirius gave that protection a specifically Jovial-Martial character: not the passive avoidance of danger but the active capacity to pass through it unharmed.'},
  ]},
  herb:{ label:'Herb', icon:'⚘', items:[
    {name:'Juniper', explain:'Juniper is aromatic, resinous, and protective — it was burned as a purifying incense across many European traditions, and its sharp, penetrating scent was believed to repel both physical pathogens and malefic spirits. Its Martial-Jovial quality (heat and abundance combined) connects it to Sirius. Juniper berries also have diuretic properties — consistent with Sirius\'s Cancer-Lunar placement governing the body\'s fluid regulation.'},
    {name:'Savory', explain:'Savory (Satureja) — summer or winter variety — is warm, aromatic, and associated with vitality and health. It appears under Sirius (and also Vega) for its vivifying, health-promoting quality. Medicinally it was used as a general tonic. In magical use it contributed to suffumigations for Sirius talisman operations, particularly those directed toward health preservation and the protection of physical vitality.'},
  ]},
  image:{ label:'Talisman Image', icon:'⬡', items:[
    {name:'Cock · Hound', explain:'Sirius\'s talisman image — a rooster or a hound — perfectly encapsulates its combined virtues. The cock (rooster) is a Solar-alert creature that heralds the dawn and was believed to repel evil spirits and illness; the hound is the faithful guardian, the Dog Star\'s own emblem, and the protector of the home. Together they represent the alert, active, guardian quality of Sirius\'s virtue: health maintained through vigilance and the repulsion of what threatens.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Health Preservation', explain:'The primary Sirius operation: using the star\'s combined Jovial-Martial virtue to maintain robust health. This required the Moon at 13° Cancer with Sirius culminating, beryl as the talisman stone, juniper as suffumigation, and the hound or cock image engraved. The talisman was worn as a constant health amulet, its virtue engaged continuously rather than in a single acute operation.'},
    {name:'Gaining Guards & Keepers', explain:'Operations to secure the loyalty and effectiveness of those whose role is protection — personal guards, watchmen, loyal servants, trusted friends who could be relied upon in crisis. The hound imagery was central to this operation: as the faithful dog guards its master, the Sirius talisman drew similar fidelity from those in the guardian role. This had obvious practical value in Renaissance contexts of political danger.'},
    {name:'Water Safety', explain:'Protection during sea travel and from flooding — timed to Sirius\'s favorable position with appropriate preparation. The star\'s Cancer placement and its Nile-flood heritage gave it a strong connection to controlled water force. Operations for maritime protection before a voyage were among the most practically urgent forms of celestial talisman work for Renaissance merchants and sailors.'},
  ]},
}},

procyon: { name:'Procyon', glyph:'★', accent:'gold', group:'behenian', sub:'Little Dog · ☿☽ · 25° Cancer', categories:{
  nature:{ label:'Nature', icon:'◈', items:[
    {name:'Mercurial & Lunar', explain:'Procyon\'s Mercury-Moon nature produces a star of swift, communicative, changeable quality — the little dog to Sirius\'s great dog, but quicker and more immediately responsive. Mercury\'s intelligence and the Moon\'s fluid adaptability combined give Procyon a quality of alert, nimble readiness — the small dog that hears everything and responds instantly. This contrasts with Sirius\'s Jovial-Martial steadiness.'},
    {name:'25° Cancer', explain:'Procyon at 25° Cancer (Renaissance epoch) placed it near Sirius in the same Lunar sign but at a more advanced degree — in the twilight zone before Cancer ends and Leo begins. This position connected it to both the protective Lunar quality of Cancer and the beginning of the Solar Leo influence, giving Procyon a transitional, liminal quality consistent with its Mercury-Moon nature.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Favour & Goodwill', explain:'Procyon\'s primary virtue: drawing the spontaneous goodwill of people encountered — not the formal esteem of Aldebaran or the popular favour of Capella, but the immediate warmth of strangers and acquaintances. The Mercurial quality made this communicative and quick; the Lunar quality made it emotionally genuine. This was the virtue of the well-received traveler, the immediately liked stranger.'},
    {name:'Power over Animals', explain:'An unusual virtue reflecting Procyon\'s dog-star nature: the capacity to command and gain the cooperation of animals. Hunting, animal training, and working with animals in any capacity were operations where Procyon\'s talisman provided assistance. The Mercury-Moon combination — quick intelligence and fluid, empathic responsiveness — were the qualities that allowed effective communication with non-human creatures.'},
  ]},
  stone:{ label:'Stone', icon:'◇', items:[
    {name:'Agate', explain:'Agate is Procyon\'s stone — connecting through Mercury (agate is Mercury\'s primary stone) and through its banded, many-featured quality that matches Procyon\'s Mercury-Moon mixed nature. The use of agate in Procyon talisman work drew on its ancient role as a protective traveler\'s stone (consistent with Procyon\'s favour-of-strangers virtue) and as a stone of eloquence and persuasion.'},
  ]},
  herb:{ label:'Herb', icon:'⚘', items:[
    {name:'Heliotrope', explain:'Heliotrope (the plant that turns toward the Sun) appears as Procyon\'s herb despite the star\'s Lunar-Mercurial nature — possibly because of the plant\'s role in Lunar-Solar boundary work (it turns toward Solar light from Lunar darkness) and its ancient use in preparations for gaining favour. The plant\'s sun-tracking behaviour was read as a form of intelligent, responsive orientation toward the source of power — consistent with Procyon\'s Mercury-Moon quality.'},
    {name:'Pennyroyal', explain:'Pennyroyal (Mentha pulegium) is a strongly aromatic, Mercurial mint-family herb with a long history of use in both medicine (particularly for female conditions — Lunar applications) and in insect repulsion. Its sharp, penetrating scent is Mercurial; its effect on the womb is Lunar. For Procyon operations it was used in suffumigations and in preparations for animal-related and traveler-protection workings.'},
  ]},
  image:{ label:'Talisman Image', icon:'⬡', items:[
    {name:'Cock · Man in Cloak', explain:'Procyon\'s talisman image combines the solar-alert cock (shared with Sirius — the dog-star connection) with a cloaked man — the figure of the traveler, the one who moves through the world beneath a cloak of protection and anonymity. The cloak is a Lunar image (the Moon\'s concealing quality) worn by the Mercurial traveler. This image was engraved in agate at the Procyon election for talismans of safe travel and the gaining of goodwill.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Goodwill of Men', explain:'Drawing the spontaneous positive regard of people encountered — the operation most directly reflecting Procyon\'s primary virtue. This was especially useful for those whose work required moving among strangers: merchants, diplomats, travelers, and any person who depended on being well received in unfamiliar environments. The talisman worked continuously, not in a single encounter.'},
    {name:'Dominion over Animals', explain:'Operations using Procyon\'s virtue for work involving animals: gaining cooperation from difficult horses, training hunting dogs, working with livestock, or in the broader tradition, commanding the animal spirits that were conceived as inhabiting certain natural spaces. The Mercury-Moon combination gave quick intelligence for communication and fluid empathy for the emotional responsiveness animals required.'},
  ]},
}},

regulus: { name:'Regulus', glyph:'★', accent:'yellow', group:'behenian', sub:'Heart of Lion · ♃♂ · 29° Leo', categories:{
  nature:{ label:'Nature', icon:'◈', items:[
    {name:'Jovial & Martial', explain:'Regulus is the most royally fortunate of all the fixed stars in the Western tradition — its Jupiter-Mars nature combines the regal authority of the greater benefic with the courageous force of Mars. This is the nature of the ideal king: benevolent in prosperity (Jupiter) and decisive in conflict (Mars). The star sits at the heart of Leo — the Lion, the Sun\'s own sign — amplifying its regal quality.'},
    {name:'Royal · Fortunate', explain:'Regulus (the name means "little king" in Latin) is one of the four Royal Stars of Persian astrology, marking the summer solstice in ancient times. Its role as the Watcher of the North made it the guardian star of royal authority. In medieval and Renaissance astrology, Regulus was the most reliably fortunate of the fixed stars for worldly success — provided the person did not abuse their power, as tradition held that Regulus could reverse its fortune sharply if honour was violated.'},
    {name:'29° Leo', explain:'Regulus at 29° Leo (Renaissance epoch) placed it at the very end of the Solar sign — a position of culmination and concentrated power. The 29th degree of a sign was considered a critical degree in medieval astrology (the anaretic degree), associated with urgency and the concentrated expression of the sign\'s qualities. Regulus at this degree was fully Solar in its sign placement, amplifying the regal brightness of its nature.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Favour of Kings & Nobles', explain:'The primary operative virtue of Regulus: gaining the goodwill and patronage of rulers and aristocrats — precisely those who occupied the position in human society that Regulus occupied among the stars. This was the most practically powerful virtue in a world organised around royal patronage. A Regulus talisman was believed to incline rulers to look with favour on the bearer, to remember them positively, and to extend preferment.'},
    {name:'Healing Fevers', explain:'A specific medical virtue: Regulus was used to treat fevers — particularly the hot, inflammatory fevers associated with Martial excess. The Jovial quality in Regulus\'s nature provided the moderating, cooling influence that reduced excessive Martial heat. This was worked through astrological timing (treating at a Regulus election), through the application of Regulus-sympathetic herbs, and through the wearing of the talisman during fever crises.'},
    {name:'Preserving from Enemies', explain:'A protective virtue: Regulus\'s royal authority extended to protecting its bearer from the attacks of enemies. Where Algol protected through terrifying power, Regulus protected through the authority of legitimacy — enemies were deterred not by fear but by the sense that attacking the bearer was an offense against right order. This distinction is operationally important: Regulus protection worked best for those whose cause was just.'},
  ]},
  stone:{ label:'Stone', icon:'◇', items:[
    {name:'Granite', explain:'Granite — the hardest and most durable of common stones, composed of interlocking crystals — is Regulus\'s stone through its royal hardness and its connection to the lion\'s image (the king of stones for the king of stars). Granite was used for the monuments of pharaohs and emperors; its durability embodied Jovial permanence and Martial strength. Regulus talismans engraved in granite were among the most permanent and powerful in the tradition.'},
    {name:'Red Granite', explain:'Red granite (the variety used in Egyptian obelisks and royal monuments, quarried at Aswan) adds the Solar-Martial red colour to granite\'s enduring quality. Red granite specifically appeared in Regulus work because of the star\'s Leo-Solar placement and because the red quality connected to the Martial dimension of Jovial-Martial stars. Egyptian royal monuments in red granite were, in this tradition\'s logic, Regulus-sympathetic objects of enormous scale.'},
  ]},
  herb:{ label:'Herb', icon:'⚘', items:[
    {name:'Celandine', explain:'Celandine is Solar and Regulus-sympathetic through its bright yellow sap and its Solar Leo placement associations. Regulus at Leo\'s 29th degree participated in Solar qualities; celandine\'s Solar nature made it appropriate for Regulus fever-healing operations (treating the excess Martial heat with Solar warmth that moderated rather than inflamed). Its use for eye conditions (Solar) also connected to Regulus\'s virtue of visibility and favour.'},
    {name:'Mastic', explain:'Mastic (the resin of Pistacia lentiscus) is warm, aromatic, and kingly — it was used as an incense in royal and divine contexts throughout the ancient Mediterranean. Its Jovial warmth and its association with royal ceremony made it appropriate for Regulus suffumigation. Burned at the moment of a Regulus election, mastic resin was believed to carry the smoke upward to the star and draw its virtue downward into the operation.'},
  ]},
  image:{ label:'Talisman Image', icon:'⬡', items:[
    {name:'Lion · Man in Crown', explain:'Regulus\'s talisman image — a lion, or a crowned man — is the most direct possible expression of the star\'s royal nature. The lion is Leo, Regulus\'s constellation and the Sun\'s own sign; the crowned man is the king whose earthly authority parallels Regulus\'s celestial authority. This image was engraved in granite at the Regulus election. The simplicity of the image was itself regal: no baroque complexity, but the clear, direct statement of sovereign power.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Royal & Noble Favour', explain:'The primary Regulus operation: securing the goodwill and patronage of those in power. In Renaissance context this meant kings, dukes, popes, cardinals, and major merchants — anyone whose favour could transform one\'s circumstances. The talisman was presented or worn at the moment of seeking audience, at the moment of making a petition, or worn continuously by those whose lives depended on maintaining the goodwill of powerful patrons.'},
    {name:'Healing Fevers', explain:'Medical operations using Regulus\'s virtue to treat inflammatory conditions. These were timed to the star\'s favorable astronomical position, used the granite talisman or mastic incense, and were accompanied by appropriate medical-astrological preparations (cooling herbs, avoiding Martial foods). The operative logic: Regulus\'s combined Jovial-Martial nature could modulate the Martial excess that drove fever, bringing it back to the balanced, flourishing state that Jupiter\'s abundance provided.'},
    {name:'Victory over Enemies', explain:'The Martial dimension of Regulus\'s virtue applied operationally: ensuring success in conflicts, competitions, and direct confrontations with those who opposed one. This was the king\'s battle-virtue — not the soldier\'s courage (that was Aldebaran or Mars directly) but the authority that makes victory inevitable because it is aligned with legitimate power. The Regulus talisman declared that the bearer\'s cause had celestial sanction.'},
  ]},
}},

alkaid: { name:'Alkaid', glyph:'★', accent:'purple', group:'behenian', sub:'Tail of Bear · ♄☿ · 26° Virgo', categories:{
  nature:{ label:'Nature', icon:'◈', items:[
    {name:'Saturnine & Mercurial', explain:'Alkaid combines Saturn\'s cold, binding, death-adjacent quality with Mercury\'s speed and analytical precision — producing a star of cold, calculated, strategic malefic potential. Where Saturn alone produces slow, heavy harm and Mercury alone produces quick, communicative effect, their combination in Alkaid produced the capacity for rapid, precise, strategically planned destructive action. This made Alkaid among the most feared stars for military and political harm.'},
    {name:'26° Virgo', explain:'Alkaid at 26° Virgo (Renaissance epoch) placed it in Mercury\'s second sign — reinforcing the Mercurial precision of its Saturn-Mercury nature. Virgo\'s analytical, critical quality gave Alkaid\'s malefic potential a discriminating quality: it could be directed precisely toward a specific target rather than operating as a general destroyer. This made it powerful for targeted military operations.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Besieging Cities', explain:'Alkaid\'s primary military-operative virtue: providing advantage in siege warfare through the combined Saturn-Mercury quality of patient, calculated strategic pressure (Saturn\'s endurance) applied with precise intelligence about when and where to strike (Mercury\'s quickness). Siege operations in the Renaissance magical-military tradition involved astrological elections for the beginning of siege, for mining operations, and for the timing of assaults.'},
    {name:'Causing Hatred & Discord', explain:'Alkaid\'s operative virtue for sowing conflict between parties — not the hot Martial discord of explosive conflict but the cold, calculated Saturn-Mercury introduction of suspicion, resentment, and misunderstanding that dissolves alliances over time. This made Alkaid valuable for political rather than purely military operations: weakening an enemy\'s coalition before the open confrontation that Martial stars would govern.'},
    {name:'Dispersing Armies', explain:'The capacity to break the coherence of a military force — to cause routes, desertions, and the collapse of military order. This was the offensive counterpart to Alkaid\'s defensive besieging virtue: where besieging was patient and sustained, dispersing was decisive and sudden. Mercury\'s speed introduced the sudden shock; Saturn\'s coldness extinguished the martial fire that held soldiers together in the face of adversity.'},
  ]},
  stone:{ label:'Stone', icon:'◇', items:[
    {name:'Magnet · Lodestone', explain:'The lodestone — natural magnetic iron oxide — is Alkaid\'s stone through the Saturn-Mercury connection. The magnet\'s invisible attractive and repulsive force was the paradigm of an occult virtue, and its iron composition connected it to Martial operations that Saturnine-Mercurial Alkaid could redirect. In Alkaid operations, the magnet was used with its repulsive pole oriented toward the target of dispersal — a physical analog of the star\'s scattering virtue.'},
  ]},
  herb:{ label:'Herb', icon:'⚘', items:[
    {name:'Chicory', explain:'Chicory (Cichorium intybus) appears under Alkaid through its Saturnian bitterness and its folk association with opening locked things and with making the bearer invisible to others — both Saturnian-Mercurial virtues. It was also used in love magic (a Venereal application) and in more general concealment preparations. Its deep blue flowers contrast with its Saturn-heavy operative character.'},
    {name:'Mugwort', explain:'Mugwort appears here (as under the Moon, Capella, and Regulus) as a herb of multiple planetary correspondences. Its Alkaid application draws on its Lunar-Martial quality directed through Saturn\'s binding channel: mugwort in Alkaid preparations was used specifically for operations of dispersal and strategic confusion, its opening, Lunar quality deployed to loosen the bonds that held enemy formations together.'},
  ]},
  image:{ label:'Talisman Image', icon:'⬡', items:[
    {name:'Bear · Man holding Staff', explain:'Alkaid is the end of the Great Bear\'s tail (its Arabic name means "the chief of the mourners of the Bear"). The bear image reflects both the constellation and the quality of Saturnine power — heavy, enduring, capable of devastating force when roused. The man holding a staff is the strategist or general — Mercury\'s planner directing Saturn\'s force. Together the image expressed the deliberate, calculated quality of Alkaid\'s military-strategic virtue.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Military Strategy', explain:'Operations for competitive advantage in extended military conflict — not single-battle victory (which was more purely Martial) but the sustained, strategic management of a campaign. Alkaid\'s Saturn-Mercury combination governed the planning of sieges, the calculation of supply lines, the timing of withdrawal and advance, and the general art of patient, intelligent warfare. The Picatrix contains detailed instruction for Alkaid elections in military contexts.'},
    {name:'Raising Discord', explain:'Introducing conflict into an enemy\'s alliance or internal structure — the cold, precise Saturn-Mercury operation of targeted relationship damage. This involved identifying the fault lines in a target group and working at a Alkaid election to amplify and exploit them. The operation required patience (Saturn) and precise intelligence about the target\'s internal dynamics (Mercury).'},
    {name:'Dispersing Armies', explain:'The acute military application: breaking the morale and coherence of an opposing force at a critical moment in a campaign. This was timed to a Alkaid election coinciding with the moment of the enemy\'s greatest vulnerability, using the lodestone in its repulsive orientation and the specific talisman image to direct the star\'s scattering virtue. The Picatrix treats this operation as one of the most powerful and dangerous in the stellar arsenal.'},
  ]},
}},

gienah: { name:'Gienah', glyph:'★', accent:'purple', group:'behenian', sub:'Wing of Crow · ♄♂ · 13° Libra', categories:{
  nature:{ label:'Nature', icon:'◈', items:[
    {name:'Saturnine & Martial', explain:'Gienah (the wing of the crow in Corvus) shares Algol\'s Saturn-Mars nature — making it the second most malefic Behenian star in the system. Where Algol\'s malefic quality is sharp and immediate (decapitation, sudden violent harm), Gienah\'s is more insidious — the crow\'s quality of ill omen, of dark intelligence used for destructive ends. Saturn\'s cold deliberation combined with Mars\'s cutting force produced a star of targeted, sustained harm.'},
    {name:'Unfortunate · Violent', explain:'Gienah was consistently classified as malefic in the tradition — one of the unfortunate fixed stars that brought ill fortune to those born under its influence and whose virtue, when deliberately invoked, operated in the register of harm, discord, and spiritual antagonism. Its violet and black crow imagery reinforced this assessment across traditions.'},
    {name:'13° Libra', explain:'Gienah at 13° Libra (Renaissance epoch) placed it in Venus\'s sign — an ironic contrast between the sign of harmony, beauty, and balance and the star\'s malefic-violent nature. This position meant that Venereal elections could accidentally activate Gienah\'s influence, which required careful attention in talisman work for Venus. The 13th degree of any sign was often considered sensitive in medieval astrology.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Producing Boldness', explain:'Even malefic stars had operative virtues that could be worked in the less destructive register. Gienah\'s boldness virtue — shared with Algol — allowed it to be engaged for operations of fearlessness in dangerous situations. The crow\'s fearlessness (it will face animals much larger than itself) was the image of this virtue. It was less preferred than Aldebaran or Regulus for boldness operations, but available when those stars were not well-placed.'},
    {name:'Causing Ill Will', explain:'The primary malefic operation of Gienah: introducing negative feeling — dislike, suspicion, hostility — from one person or group toward another. Saturn\'s cold introversion combined with Mars\'s aggressive warmth produced the specific quality of hostile ill will: not the explosive anger of pure Mars nor the cold binding of pure Saturn, but the active, sustained negative regard that turns potential allies into enemies.'},
    {name:'Against Enemies', explain:'The operational category Gienah shared with Algol: working against specific opponents through the invocation of Saturnine-Martial stellar force. The difference from Algol was of quality rather than direction: Gienah operations against enemies worked through the channels of reputation damage, the introduction of ill will in third parties, and the sustained undermining of the enemy\'s position — the crow\'s intelligence in destructive application.'},
  ]},
  stone:{ label:'Stone', icon:'◇', items:[
    {name:'Onyx', explain:'Onyx is Gienah\'s stone — its black, banded quality is deeply Saturnian, and its historical association with grief, nightmare, and discord made it the natural material for the star\'s malefic operations. Agrippa elsewhere notes onyx\'s capacity to produce distressing dreams and to introduce discord into families — consistent with Gienah\'s virtue of causing ill will. The stone was engraved with the raven image at the Gienah election.'},
  ]},
  herb:{ label:'Herb', icon:'⚘', items:[
    {name:'Burdock', explain:'Burdock (Arctium lappa) is a large, rough, tenacious plant — its burrs cling to anything that passes, embodying a Saturnian quality of adhesion and persistence. It was used medicinally as a blood purifier (Jovial in one reading, but here the Saturnian purging of corrupt material). In magical use, burdock\'s clinging quality was directed toward binding operations and toward the sustained adhesion of ill fortune to a target.'},
    {name:'Henbane', explain:'Henbane appears under Gienah as well as Saturn — its presence here reinforces the star\'s deeply Saturnian-Martial character. Henbane\'s toxic, hallucinogenic, and death-adjacent nature made it the appropriate herb for operations working in the register of madness, ill will, and spirit evocation in their most dangerous forms. Its inclusion in Gienah preparations was rare and explicitly dangerous in the tradition.'},
    {name:'Comfrey', explain:'Comfrey (Symphytum officinale) is more ambiguous than the other Gienah herbs — it is primarily a healing herb (for bones and tissues, consistent with Saturnian bone-governance), and its presence in Gienah\'s list may reflect the star\'s capacity for operations in the liminal space between harm and healing. The same Saturnian quality that could cause wasting could, correctly applied, restore structural integrity.'},
  ]},
  image:{ label:'Talisman Image', icon:'⬡', items:[
    {name:'Snake · Raven · Man in Black', explain:'Gienah\'s talisman image — a snake, a raven, and a black-robed man — is the most explicitly malefic of the Behenian images. The snake carries all its traditional associations with danger, cunning, and death; the raven is the crow\'s darker cousin, a bird of omen and of ill fortune; the man in black is the Saturn-figure, the practitioner of dark operations. Together they described the full character of Gienah\'s operative domain.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Raising Malice', explain:'The deliberate activation of negative feeling in a population or group toward a specific target — the amplification of existing ill will or the introduction of new hostility where none existed. This was among the most feared of the Behenian star operations, requiring not just the correct astronomical election but a clarity of intent and a willingness to work in the domain of genuine harm. Agrippa catalogues it without recommending it.'},
    {name:'Against Enemies', explain:'The operational application of Gienah\'s force against specific opponents — using the onyx talisman made at the Gienah election, with the appropriate suffumigation (henbane, burdock) and the raven-snake-black man image, to direct the star\'s Saturnine-Martial malefic virtue toward a target. The Picatrix gives more detail; Agrippa implies the operation\'s possibility without providing complete instruction in this context.'},
  ]},
}},

spica: { name:'Spica', glyph:'★', accent:'cyan', group:'behenian', sub:'Spike of Virgin · ♀☿ · 23° Libra', categories:{
  nature:{ label:'Nature', icon:'◈', items:[
    {name:'Venereal & Mercurial', explain:'Spica combines Venus\'s beauty and abundance with Mercury\'s intelligence and communication — producing the most beneficent of the Behenian stars. Venus gives it warmth, generative abundance, and attractiveness; Mercury gives it clarity, eloquence, and the capacity to recognize and communicate opportunity. This combination produced the star that Ptolemy and all subsequent commentators identified as the most fortunate of the fixed stars.'},
    {name:'Most Fortunate', explain:'Spica was universally ranked as the most fortunate Behenian fixed star — and among the most fortunate of all fixed stars period. Its Venus-Mercury nature is the most completely benefic combination: neither planet is malefic; both contribute to abundance, success, and the cultivation of human excellence. Operations with Spica were considered among the safest and most reliably effective in the stellar tradition.'},
    {name:'23° Libra', explain:'Spica at 23° Libra (Renaissance epoch) placed it in Venus\'s sign — doubly reinforcing its Venereal quality. Libra, the sign of balance, justice, and harmonious relationship, was the perfect zodiacal context for the most fortunate and harmonious of stars. The 23rd degree of Libra was considered among the most benefic positions in the fixed star tradition.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Riches & Plenty', explain:'Spica\'s primary operative virtue: drawing material abundance — wealth, food, prosperity, and the resources needed for a good life. The Venus-Mercury combination worked here through Venereal generativity (abundance of good things) and Mercurial intelligence (finding and recognizing opportunity). Spica talisman operations for wealth were among the most commonly sought in the tradition.'},
    {name:'Overcoming Poverty', explain:'The specific application of the riches virtue to conditions of lack: Spica\'s force could reverse privation and begin the process of material recovery. This was particularly associated with the emerald (Spica\'s stone) and sage (Spica\'s herb) — both associated with wisdom applied to practical improvement. The Mercurial quality here was the intelligence to recognize the path out of lack.'},
    {name:'Victory in Suits', explain:'Legal and competitive success — Spica\'s influence over judgment and fair process, derived from its position in Libra (the sign of justice and right balance). Where Jupiter\'s legal virtue came from the planet\'s authority, Spica\'s came from the principle of right relationship (Venereal harmony) applied with Mercurial precision. Operations for court cases and competitive disputes were timed to Spica elections.'},
  ]},
  stone:{ label:'Stone', icon:'◇', items:[
    {name:'Emerald', explain:'Emerald is the stone of both Venus (as primary) and Spica (as the most Venereal Behenian star). Its deep green, its association with abundance and beauty, and its historically attested use in protective and prosperity talismans made it the perfect material for Spica work. Spica emeralds engraved with the bird-or-grain-carrier image were among the most prized of Renaissance talisman objects.'},
  ]},
  herb:{ label:'Herb', icon:'⚘', items:[
    {name:'Sage', explain:'Sage (Salvia officinalis) is Spica\'s herb — its name derives from salvere (to be well, to be saved), connecting it to healing and preservation. Its silver-green leaves and its strong aromatic quality made it both a practical medicinal herb (antibacterial, digestive, preservative) and a symbol of wisdom and endurance. For Spica operations, sage was burned as a suffumigation and incorporated in preparations for prosperity and legal success.'},
  ]},
  image:{ label:'Talisman Image', icon:'⬡', items:[
    {name:'Bird · Man carrying Grain', explain:'Spica\'s talisman image — a bird (possibly a dove, consistent with Venus) or a man carrying a sheaf of grain — captures the star\'s agricultural and abundance associations. The grain sheaf is literally what the name Spica means (the ear of grain in Virgo\'s hand); the bird represents Venereal beauty and freedom. The grain-carrier image was engraved in emerald at the Spica election, creating a talisman of concentrated Venereal-Mercurial abundance.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Wealth & Abundance', explain:'The primary Spica operation: drawing material prosperity into one\'s life through the star\'s combined Venereal generativity and Mercurial intelligence. The emerald talisman was made at the Spica election and used in commercial, agricultural, and domestic contexts where abundance was needed. Unlike purely Jovial wealth operations, Spica\'s wealth was specifically connected to recognized value and to things that were genuinely beautiful and useful.'},
    {name:'Legal Success', explain:'Operations for favorable outcomes in legal proceedings, using Spica\'s Libra-Venereal-Mercurial combination to incline the process toward just and favorable resolution. The talisman was worn or presented at the time of the hearing; the sage suffumigation was burned in preparation. Spica\'s legal virtue worked through establishing the truth and beauty of one\'s case rather than through intimidation or the mere exercise of authority.'},
    {name:'Overcoming Want', explain:'Targeted operations for relief from specific conditions of lack — not general wealth operations but interventions at the point of acute need. Spica\'s capacity to begin the movement from privation toward abundance was engaged here, using both the material talisman and the astrological timing to initiate a favorable shift in circumstances. The Mercurial quality provided the intelligence to recognize and act on the openings the Venereal abundance created.'},
  ]},
}},

arcturus: { name:'Arcturus', glyph:'★', accent:'gold', group:'behenian', sub:'Bear-Watcher · ♃☿ · 24° Libra', categories:{
  nature:{ label:'Nature', icon:'◈', items:[
    {name:'Jovial & Mercurial', explain:'Arcturus combines Jupiter\'s fortunate, expanding quality with Mercury\'s swift intelligence — a pairing that produces the fortunate traveler, the successful merchant, the just official who also understands the practical details of governance. Jupiter provides the ethical framework and the general favour; Mercury provides the quick thinking and the ability to navigate complex situations. This makes Arcturus the star of those who combine good fortune with practical intelligence.'},
    {name:'Fortunate', explain:'Arcturus is consistently classified as fortunate in the tradition — its Jupiter-Mercury nature avoids the malefic planets entirely, and its position in Boötes (the constellation that follows the Bear, keeping it from retreating into darkness) gave it associations with the maintenance of right order and cosmic governance. It was considered especially fortunate for journeys and legal matters.'},
    {name:'24° Libra', explain:'Arcturus at 24° Libra placed it in the same sign as Spica but one degree later — in the zone of Venereal harmony and Libran justice. The degree difference between Spica (23°) and Arcturus (24°) meant their elections were close but distinct, with Arcturus emphasizing the Jovial-Mercurial dimension of Libran justice (the application of intelligent reason to right judgment) while Spica emphasized the Venereal-Mercurial dimension (the beauty of right relationship).'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Aiding Journeys', explain:'Arcturus\'s most distinctive virtue: assistance and protection in travel. Jupiter provided the general good fortune of the journey (favorable encounters, adequate provision, safety); Mercury provided the quick thinking needed to navigate unexpected obstacles. The combination made Arcturus the star most specifically suited to long journeys, particularly commercial journeys where both safety and successful business were desired.'},
    {name:'Obtaining Justice', explain:'The Jupiter-Mercury combination applied to legal and formal processes: obtaining fair treatment and just outcomes in disputes, hearings, and official proceedings. Unlike Spica\'s legal virtue (which worked through the beauty and truth of one\'s case), Arcturus\'s worked through the intelligent assertion of right (Mercury) before a benevolent authority (Jupiter). This made it particularly valuable for those seeking justice from official institutions.'},
    {name:'Prosperity', explain:'A general virtue of material flourishing — broadly similar to Spica\'s but with a Jovial quality that emphasized social respect and official acknowledgment alongside material wealth. Arcturus prosperity was the prosperity of the well-respected merchant or professional: not just rich but recognized as legitimately so. The Jovial dimension gave the wealth a quality of earned and honoured abundance.'},
  ]},
  stone:{ label:'Stone', icon:'◇', items:[
    {name:'Jasper (green)', explain:'Green jasper is Arcturus\'s stone — its Jovial colour connecting to the planet\'s life-giving, abundant nature, and its hard, protective quality connecting to the physical demands of travel and legal proceedings. Jasper in its green variety was associated with rain and the fertility of the land — Jovial applications — and with the stomach (the Jovial organ of digestion and nourishment). The stone was engraved with the lance-and-shield image at the Arcturus election.'},
  ]},
  herb:{ label:'Herb', icon:'⚘', items:[
    {name:'Plantain', explain:'Plantain appears under both Mars (for its wound-healing quality) and Arcturus (for its Jovial-Mercurial quality of providing what is needed in any terrain — plantain grows everywhere, on any path, providing medicine wherever one travels). Its universal availability and its capacity to treat the most common travel injuries made it the traveler\'s herb in folk medicine across Europe. Its Arcturus attribution connected it to the journey-protection virtue.'},
  ]},
  image:{ label:'Talisman Image', icon:'⬡', items:[
    {name:'Man with Lance & Shield', explain:'Arcturus\'s talisman image — an armed man carrying both offensive (lance) and defensive (shield) weapons — captured the star\'s combination of active Jovial expansion and Mercurial adaptability in a single image. The lance represents the forward movement of the journey and the assertion of right; the shield represents the protection of one\'s person and interests. This image was engraved in green jasper at the Arcturus election.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Safe Travel', explain:'The primary Arcturus operation: ensuring protection and success in journeys. The green jasper talisman with the armed-man image was made at an Arcturus election and carried on the journey. The Jovial quality provided general good fortune; the Mercurial quality ensured quick response to unexpected challenges. This was among the most practically useful of the Behenian star operations for the mobile merchant class of the Renaissance.'},
    {name:'Obtaining Justice', explain:'Operations directed at legal proceedings, administrative hearings, or any formal process where one sought fair treatment. The talisman was worn into court; plantain preparations might accompany it as a supporting herb. The Jovial-Mercurial combination worked through the charm and intelligence of presentation (Mercury) backed by the authority of right and the goodwill of the presiding judge (Jupiter).'},
    {name:'Prosperity', explain:'General prosperity operations using Arcturus\'s combined Jovial-Mercurial virtue — drawing abundance in its socially recognized form. Where Spica\'s prosperity was more purely Venereal (beautiful, flowing, generous), Arcturus\'s was Jovial (respected, established, growing steadily). Both were sought, often together, in commercial and professional contexts where both material success and social recognition were needed.'},
  ]},
}},

alphecca: { name:'Alphecca', glyph:'★', accent:'cyan', group:'behenian', sub:'Crown of North · ♀☿ · 12° Scorpio', categories:{
  nature:{ label:'Nature', icon:'◈', items:[
    {name:'Venereal & Mercurial', explain:'Alphecca shares its Venus-Mercury nature with Spica and Vega — the most benefic planetary combination. In Alphecca\'s case the Venus-Mercury quality operates in the context of Scorpio (the sign of depth, transformation, and hidden matters), giving it a quality of Venereal beauty and Mercurial intelligence applied to what is concealed. This made Alphecca valuable for operations that required attractiveness and intelligence in contexts of secrecy or complex relationship.'},
    {name:'Moderately Fortunate', explain:'Unlike Spica (the most fortunate Behenian star), Alphecca was classified as moderately fortunate — its Scorpio context introduced a dimension of complexity and hidden difficulty into its otherwise benefic nature. Its fortune was available but required more careful working than Spica\'s. The crown image (the star\'s constellation is Corona Borealis — the Northern Crown) suggested honour achieved through navigating complexity rather than through straightforward excellence.'},
    {name:'12° Scorpio', explain:'Alphecca at 12° Scorpio placed it in Mars\'s sign — introducing a Martial dimension into its Venus-Mercury nature that its planetary attribution did not immediately suggest. Scorpio\'s depth, its connection to hidden matters and the transformation of desire, and its association with death and regeneration gave Alphecca an undertone that distinguished it from the other Venus-Mercury Behenian stars (Spica and Vega) located in more straightforwardly pleasant zodiacal regions.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Granting Favour & Honour', explain:'Alphecca\'s primary virtue: drawing esteem and good regard from others, particularly in contexts where one\'s merit might otherwise be overlooked or where complex social dynamics obscured one\'s worth. The crown imagery was central: Alphecca conferred the honour of recognition — the crown placed on the deserving head by those with the authority to recognise. This honour was intellectual and artistic as well as social.'},
    {name:'Curing Fevers', explain:'A specific medical virtue shared with Regulus: Alphecca\'s Venus-Mercury combination could moderate the excessive Martial heat that drove inflammatory fevers. The Venereal moisture cooled; the Mercurial quality provided the precision to direct that cooling where needed. Alphecca fever operations were distinguished from Regulus\'s by their gentler, more fluid action — appropriate for those whose constitutions could not bear the stronger Regulus treatment.'},
    {name:'Freedom', explain:'A virtue specific to Alphecca among the Behenian stars: the capacity to free what is bound — release from obligations, from physical confinement, from the bonds of ill-fortune or hostile magic. This connected to its Scorpionic placement (the sign of binding and release, of deep entanglement resolved) and to Mercury\'s capacity to loose as well as bind. Freedom operations sought release from specific constraints in any domain.'},
  ]},
  stone:{ label:'Stone', icon:'◇', items:[
    {name:'Topaz', explain:'Topaz is Alphecca\'s stone — its warm clarity connecting to the Venus-Mercury combination and its golden or golden-pink varieties linking it to both Venereal beauty and Mercurial intelligence. Topaz was believed to cool excessive heat (addressing Alphecca\'s fever-curing virtue) and to protect against enchantment (connecting to the freedom-from-bonds virtue). The stone was engraved with the crowned-man image at the Alphecca election.'},
  ]},
  herb:{ label:'Herb', icon:'⚘', items:[
    {name:'Rosemary', explain:'Rosemary is Alphecca\'s herb — its aromatic, memory-strengthening, and protective quality connecting to both the Mercurial intelligence and the Venereal beauty of the star. Rosemary was the herb of remembrance and of intellectual clarity; it was also burned to purify spaces and to drive away malefic influences (the freedom virtue). Its use in Alphecca suffumigations combined mental clarity with protective aromatic warmth.'},
  ]},
  image:{ label:'Talisman Image', icon:'⬡', items:[
    {name:'Crowned Man · Man in Rings', explain:'Alphecca\'s talisman image — a man wearing a crown, or a figure adorned with rings — expressed the star\'s honour virtue through the imagery of recognized achievement. The crown was earned rather than inherited (unlike Regulus\'s royal crown of sovereign authority); the rings suggested the bonds of friendship, favour, and social connection through which Alphecca\'s honour operated. The image was engraved in topaz at the election.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Honour & Favour', explain:'Operations for gaining recognition and esteem — particularly from those capable of conferring formal honours (teachers, patrons, judges of merit). Alphecca\'s favour was intellectual and artistic as well as social: scholars seeking recognition for their work, artists seeking patrons, and professionals seeking acknowledgment of excellence all used this operation. The topaz talisman was presented or worn in situations where such recognition was sought.'},
    {name:'Healing Fevers', explain:'Medical operations using Alphecca\'s cooling, moderating Venus-Mercury quality to treat inflammatory conditions. The rosemary suffumigation and topaz talisman were prepared at the Alphecca election and used in the treatment context. Alphecca\'s fever treatment was gentler and more suitable for those with complex or sensitive constitutions than the more forceful Regulus approach.'},
    {name:'Freedom from Bonds', explain:'Operations for release from constraint — physical, legal, magical, or relational. This was Alphecca\'s most distinctive operation among the Behenian stars. Using the star\'s Venus-Mercury virtue with its Scorpionic placement (the sign that governs both binding and release), these operations worked at the moment of the star\'s favorable position to loosen specific bonds: debts, vows, curses, or legal obligations that could no longer be honourably maintained.'},
  ]},
}},

antares: { name:'Antares', glyph:'★', accent:'red', group:'behenian', sub:'Heart of Scorpio · ♂♃ · 9° Sagittarius', categories:{
  nature:{ label:'Nature', icon:'◈', items:[
    {name:'Martial & Jovial', explain:'Antares is the Heart of the Scorpion — one of the four Royal Stars — and its Mars-Jupiter nature reflects the paradox of its mythological and astrological character. Mars provides its violent, dangerous quality (it opposes Aldebaran across the sky, and the two stars\' opposition was read as a cosmic conflict); Jupiter provides the expansive, royal dimension that made it one of the great stars of fortune and power despite its violent nature. The combination produced extreme outcomes — either great success or catastrophic failure.'},
    {name:'Violent · Infortune', explain:'Despite its Jovial component, Antares was classified as infortune — its Martial excess in the context of Scorpio (Mars\'s own sign) produced a star that governed violent, extreme, and irreversible situations. The scorpion\'s sting is the image: sudden, precise, and toxic. Antares was considered particularly dangerous when afflicted in a natal chart, associated with rash courage that led to destructive outcomes.'},
    {name:'9° Sagittarius', explain:'Antares at 9° Sagittarius (Renaissance epoch) placed it in Jupiter\'s sign — a zodiacal context that moderated its Scorpionic harshness and reinforced its Jovial component. Sagittarius\'s association with philosophical inquiry, with long journeys, and with the seeking of higher truth gave Antares an intellectual and expansive dimension that its purely Martial-Scorpionic nature would not have had. The 9th degree was considered a significant degree in some medieval astrological lists.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Sharpening the Intellect', explain:'Antares\'s primary cognitive virtue — the Mars-Jupiter combination producing not just courage but the quality of mind that could cut through confusion to reach truth rapidly. The Jovial dimension provided the breadth (seeing the whole picture) while the Martial dimension provided the decisiveness (cutting to what was essential). This made Antares valuable for those facing complex problems that required both comprehensive understanding and rapid decision.'},
    {name:'Memory Retention', explain:'A specific cognitive virtue: Antares enhanced the capacity to retain what was learned — the Jovial quality of storing and holding abundance applied to knowledge. This distinguished it from Mercury\'s quick recall (which accessed stored information rapidly) and from Saturnian deep memory (which connected to the ancestral past): Antares memory was the abundant, powerful retention of the scholar who learns much and loses little.'},
    {name:'Audacity', explain:'The courage to act boldly in the face of serious danger — more extreme than Aldebaran\'s courage and less controlled. Antares audacity was the Martial quality of the warrior who acts without hesitation at the point of maximum danger, backed by the Jovial sense that great action was both possible and worth the risk. This virtue was sought by those undertaking extreme endeavors where ordinary caution would have prevented success.'},
  ]},
  stone:{ label:'Stone', icon:'◇', items:[
    {name:'Sardonyx', explain:'Sardonyx (a banded stone with layers of sard/carnelian and onyx) is Antares\'s primary stone — its red-orange layers connecting to the Martial quality and its black-white layers connecting to the Saturn-adjacent intensity of Scorpio. The stone was used in ancient seals and in Roman military contexts (generals wore sardonyx rings). For Antares operations, it provided the combined qualities of Martial cutting force and the endurance of the combined mineral nature.'},
    {name:'Amethyst', explain:'Amethyst appears here in its purple-red or darker varieties — connecting to the Jovial quality of Antares through the stone\'s traditional association with royal dignity and with the prevention of intoxication (which, in the Antares context, meant the prevention of the mad courage that led to destruction without the quality mind that Antares at its best provided).'},
  ]},
  herb:{ label:'Herb', icon:'⚘', items:[
    {name:'Long Birthwort', explain:'Birthwort (Aristolochia) is a powerfully medicinal and toxic plant associated with birth, death, and the liminal passages of transformation. Its Scorpionic-Martial quality (it was used to aid difficult deliveries — forcing the passage from one state to another) connected it to Antares\'s extreme, transformation-forcing virtue. In magical preparations it appeared in operations requiring the extreme acceleration of a process — the Antares equivalent of cutting through delay.'},
    {name:'Saffron', explain:'Saffron appears under Antares as well as under the Sun — its Solar quality here modified by the Jovial dimension of Antares\'s nature. The warmth and elevation of spirit that saffron provided (used medicinally for depression and for strengthening the heart) connected to the Jovial-audacious quality of Antares\'s virtue. In Antares operations, saffron was used to build the confidence and breadth of vision needed for bold, comprehensive action.'},
  ]},
  herb:{ label:'Herb', icon:'⚘', items:[
    {name:'Long Birthwort', explain:'Birthwort (Aristolochia) is powerfully medicinal and toxic — used in difficult births to force passage, and in magical preparations for operations requiring extreme acceleration of process. Its Scorpionic-Martial quality connected directly to Antares\'s virtue of forcing through obstacles at the point of maximum resistance.'},
    {name:'Saffron', explain:'Saffron\'s warmth and elevation of spirit (used medicinally for melancholy, for strengthening the heart) connected to the Jovial-audacious dimension of Antares\'s nature — building the breadth of confidence needed for bold, comprehensive action under pressure.'},
  ]},
  image:{ label:'Talisman Image', icon:'⬡', items:[
    {name:'Armed Man · Man with Scorpion', explain:'Antares\'s talisman image — an armed man, or a figure holding a scorpion — captured the star\'s double nature precisely: the armed man represented the Jovial-Martial quality of the courageous actor; the scorpion represented the precise, toxic, irreversible quality of Antares\'s Martial force in its most concentrated expression. The image was engraved in sardonyx at the election, creating a talisman of extreme operative power.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Sharpening Mind', explain:'Operations using Antares\'s combined Martial-Jovial virtue for rapid, comprehensive intellectual improvement — particularly for those facing examinations, difficult judgments, or complex problems under time pressure. The sardonyx talisman and birthwort suffumigation were prepared at the Antares election. The operation worked by concentrating the star\'s virtue for quick, broad, decisive cognition at the moment of need.'},
    {name:'Courage & Audacity', explain:'Operations for extreme boldness in extreme situations — the virtue of the person who must act at the moment of maximum danger with full knowledge of the risk. Unlike Aldebaran\'s courage (which was the courage of the just warrior), Antares audacity was the courage of the person who has weighed the extreme risk and chosen to act anyway, backed by the Jovial sense that great action was both possible and worth attempting.'},
    {name:'Against Poison', explain:'A protective medical operation: Antares\'s scorpion-governance extended to protection against scorpion venom and other poisons. The principle was sympathetic — the star that governed the scorpion could moderate its effects. Sardonyx and the Antares talisman were used in anti-toxin preparations. This extended metaphorically to protection against malefic operations conceived as "poisons" of the spirit or fortune.'},
  ]},
}},

vega: { name:'Vega', glyph:'★', accent:'cyan', group:'behenian', sub:'Falling Vulture · Lyra · ♀☿ · 15° Capricorn', categories:{
  nature:{ label:'Nature', icon:'◈', items:[
    {name:'Venereal & Mercurial', explain:'Vega shares the Venus-Mercury nature of Spica and Alphecca — the most benefic of the Behenian combinations. In Vega\'s case this combination operates in the context of Lyra (the lyre) and Capricorn (Saturn\'s sign at the zodiacal level). The lyre connects Vega directly to music and artistic creation — the Venereal-Mercurial qualities of beauty expressed through intelligent craft. Capricorn\'s disciplined context gives Vega\'s artistry a quality of professional mastery rather than spontaneous gift.'},
    {name:'Fortunate', explain:'Vega was consistently classified as fortunate — its Venus-Mercury nature avoided the malefic planets entirely, and its brilliance (it is the fifth brightest star visible from Earth) made it one of the most visually prominent of the benefic fixed stars. In astrological tradition it conferred magical power, artistic ability, and practical success on those whose charts it touched favorably.'},
    {name:'15° Capricorn', explain:'Vega at 15° Capricorn (Renaissance epoch) placed it at the midpoint of Saturn\'s sign — a position of concentrated Capricornian quality. This Saturnian context gave Vega\'s benefic Venus-Mercury nature a quality of disciplined, patient, professionally executed excellence: the artist who has mastered the craft through long practice (Saturn\'s domain) and who applies Venereal beauty and Mercurial intelligence with mature skill.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Magically Powerful', explain:'Vega\'s most distinctive quality: it was considered the most operatively powerful of the Venus-Mercury Behenian stars for specifically magical work. Agrippa\'s note that Vega made operations "magically powerful" reflected the tradition\'s recognition that the lyre constellation\'s star was associated with Orpheus — whose music had operative magical power, charming all of creation. Vega\'s talisman enhanced the force of all magical operations conducted in its presence.'},
    {name:'Alleviating Poverty', explain:'The practical application of Vega\'s fortunate Venus-Mercury nature to conditions of material lack — similar to Spica\'s poverty-overcoming virtue but with a specifically artisan or professional quality. Vega\'s poverty relief came through the application of skilled craft and intelligent work to economic improvement, not through passive receipt of Venereal abundance. The Capricorn context emphasised earned improvement through disciplined effort.'},
    {name:'Winning Suits', explain:'Legal success — consistent with the Libra-adjacent (Spica) and justice-oriented Behenian stars that also list this virtue. Vega\'s approach to legal success was through the eloquence and beauty of argument (Mercury) combined with the warmth and apparent reasonableness of one\'s case (Venus), in the context of patient, thorough preparation (Capricorn). It was the star of the careful, well-prepared, eloquent advocate.'},
  ]},
  stone:{ label:'Stone', icon:'◇', items:[
    {name:'Chrysolite', explain:'Chrysolite (peridot/olivine) is Vega\'s stone — its warm yellow-green colour connecting to the Venereal quality and its traditional association with driving away nightmares and evil spirits connecting to Vega\'s operative-magical virtue. The stone\'s ancient association with music (some traditions connected it to the singing of spheres) reinforced its Lyra-Vega attribution. It was engraved with the vulture-musician image at the Vega election.'},
  ]},
  herb:{ label:'Herb', icon:'⚘', items:[
    {name:'Savory', explain:'Savory appears under both Sirius and Vega — its vivifying, health-promoting quality serving both stars\' beneficial virtues. For Vega specifically, savory\'s aromatic stimulation of mental clarity and creative energy connected to the star\'s association with musical and magical power. Summer savory was the variety most commonly used in Vega suffumigations for operations of artistic excellence and operative magic.'},
    {name:'Fumitory', explain:'Fumitory (Fumaria officinalis) is a Saturnian-Mercurial herb used in purification and in operations of seeing clearly through obscuration — consistent with Vega\'s position in Capricorn and its operative-magical virtue. Its smoke (the name means "smoke of the earth") was used to purify spaces for magical work. In Vega operations, fumitory cleared the space and the practitioner\'s perception before the more specifically Venereal-Mercurial aspects of the work were engaged.'},
  ]},
  image:{ label:'Talisman Image', icon:'⬡', items:[
    {name:'Vulture · Man playing Instrument', explain:'Vega\'s talisman image — a vulture (from the old name for the constellation Lyra, the Falling Vulture or Eagle) or a man playing a musical instrument — captured the star\'s dual nature perfectly. The vulture is Vega\'s astronomical identity; the musician is its operative identity — the Orphic figure whose art had power over all creation. The musician image engraved in chrysolite at the Vega election was the most directly magical of all the Behenian talisman images.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Magical Operations', explain:'Vega\'s most distinctive operation: the amplification of all magical operations performed in the star\'s presence. The Orphic connection made Vega the patron star of operative magic itself — using the lyre\'s music as the analogy for magical working (both involve the production of order from potential through skill and intention). Preparing talismans or conducting operations at a Vega election was believed to enhance their efficacy beyond what the planetary configurations alone would provide.'},
    {name:'Poverty Relief', explain:'Operations for the improvement of material circumstances through skilled effort and intelligent work — the Capricornian, disciplined pathway to Venereal abundance. The chrysolite talisman was prepared and worn by those seeking to improve their economic situation through their own craft and professional development, with Vega\'s star-force amplifying the efficacy of their applied skills.'},
    {name:'Legal Success', explain:'Operations for court cases and formal disputes — Vega\'s eloquent, warm approach to legal proceedings combining patient preparation (Capricorn) with Venereal persuasion and Mercurial clarity of argument. This was distinguished from Spica\'s legal virtue by its professional, craft-oriented quality: where Spica\'s legal success came from the natural beauty of a just cause, Vega\'s came from the skilled, careful preparation and eloquent presentation of that cause.'},
  ]},
}},

deneb: { name:'Deneb Algedi', glyph:'★', accent:'purple', group:'behenian', sub:'Tail of Goat · ♄☿ · 23° Aquarius', categories:{
  nature:{ label:'Nature', icon:'◈', items:[
    {name:'Saturnine & Mercurial', explain:'Deneb Algedi combines Saturn\'s authority, endurance, and governance of time with Mercury\'s intelligence and communicative precision — the combination of wise governance applied with careful analytical skill. Unlike Alkaid (which is also Saturn-Mercury but directed toward military strategic harm), Deneb Algedi\'s Saturn-Mercury nature operates in the context of Aquarius — the sign of Saturn\'s rulership in its rational, law-giving aspect. This produced a star of sober, intelligent, long-term governance rather than strategic destruction.'},
    {name:'Moderately Fortunate', explain:'Deneb Algedi\'s Saturnian component introduced a degree of difficulty and seriousness into its otherwise moderately benefic nature. It was not among the most fortunate stars (like Spica or Sirius), but neither was it malefic — its fortunate quality was earned through the patient, careful application of Saturnine wisdom and Mercurial intelligence. The fortune it conferred was stable and durable rather than sudden and spectacular.'},
    {name:'23° Aquarius', explain:'Deneb Algedi at 23° Aquarius (Renaissance epoch) placed it in Saturn\'s own sign — reinforcing the Saturnian quality of its Saturn-Mercury nature and connecting it to Aquarius\'s association with reason, law, and the governance of communities according to principle rather than passion. The 23rd degree of Aquarius was close to the midpoint of the sign, a position of concentrated Aquarian-Saturnian quality.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Augmenting Fortune', explain:'Deneb Algedi\'s primary positive virtue: increasing what is good in one\'s circumstances through the patient, Saturnine accumulation of Mercurial intelligence. Unlike Jupiter\'s sudden expansion of fortune or Venus\'s flowing abundance, Deneb Algedi\'s fortuneaugmentation was slow, steady, and durable — the increase of fortune through careful, consistent, intelligent work applied over time. This was the most Saturnian of the positive Behenian virtues.'},
    {name:'Protecting against Enemies', explain:'The protective aspect of Deneb Algedi\'s Saturn-Mercury combination: the intelligent anticipation and deflection of hostile action. Where Algol protected through terrifying power, Regulus through royal authority, and Sirius through guardian force, Deneb Algedi protected through the Mercurial quality of seeing the enemy\'s plans before they materialised and the Saturnian quality of building defenses that could not be breached. The protection of strategic intelligence rather than raw power.'},
    {name:'Expelling Sorrow', explain:'A specifically Saturnian virtue applied beneficently: Deneb Algedi\'s Saturn-Mercury combination could address the melancholic sorrow that excess Saturnian influence produced. This was the star\'s capacity for self-application — the Saturnian element understood its own pathology and the Mercurial element provided the precise intelligence to address it. Operations for expelling sorrow were among the most personally valuable applications of Deneb Algedi\'s virtue.'},
  ]},
  stone:{ label:'Stone', icon:'◇', items:[
    {name:'Chalcedony', explain:'Chalcedony is Deneb Algedi\'s stone — connecting through Mercury (chalcedony was Mercury\'s eloquence stone) and through its pale, cooling quality that addressed the star\'s Saturnian melancholic aspect. Chalcedony\'s traditional use in orators\' rings (preserving the voice and the clarity of speech) connected to the Mercurial dimension; its cooling, calming quality addressed the Saturnian excess of anxiety and heaviness. The stone was engraved with the fish-and-armour image at the Deneb Algedi election.'},
  ]},
  herb:{ label:'Herb', icon:'⚘', items:[
    {name:'Marjoram', explain:'Marjoram appears under both Mercury and Deneb Algedi — its mind-clearing, memory-improving quality connecting to the Mercurial dimension, and its traditional use in alleviating grief and melancholy connecting to the star\'s sorrow-expelling virtue. Marjoram was the herb of consolation in the ancient world; it was burned at funerals and used to calm those in grief. For Deneb Algedi operations directed at expelling sorrow, marjoram suffumigation was central to the working.'},
  ]},
  image:{ label:'Talisman Image', icon:'⬡', items:[
    {name:'Fish · Man with Armour', explain:'Deneb Algedi\'s talisman image — a fish (from the goat-fish nature of Capricorn, the sign adjacent to Aquarius) or an armoured man — expressed the star\'s dual quality of fluid intelligence (the fish navigating its medium with effortless efficiency) and protective endurance (the armoured man who weathers sustained assault through the strength of his preparation). Both images connected to the star\'s virtue of protecting against enemies through intelligent, patient defense. The image was engraved in chalcedony at the election.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Fortune & Success', explain:'The primary Deneb Algedi operation: building sustainable success through the patient, intelligent application of effort over time. This was not the dramatic reversal of fortune that more purely benefic stars could provide but the steady accumulation of good outcomes through consistent, well-timed action. The chalcedony talisman was made at the Deneb Algedi election and worn or kept as a continuous influence on the quality and persistence of one\'s efforts.'},
    {name:'Protection from Enemies', explain:'Operations for intelligent, anticipatory protection against hostile action. The armoured-man image expressed this operative quality: defense prepared before the attack, not reactive protection in the moment of crisis. The Mercurial quality of Deneb Algedi\'s protection meant that it worked through intelligence — seeing threats before they materialised, preparing appropriate responses, and maintaining the clarity of judgment needed to distinguish genuine threats from false ones.'},
    {name:'Joy & Favour', explain:'Operations directed at the sorrow-expelling virtue: using Deneb Algedi\'s Saturn-Mercury combination to dissolve the heaviness of excess melancholy and to replace it with the functional, sober joy of a Saturnian constitution in good balance. The marjoram suffumigation was central to these operations. Unlike the Jovial or Venereal approaches to joy (which added warmth and sweetness), Deneb Algedi\'s joy came through the clearing of what oppressed, leaving the natural contentment of a mind free from excess Saturnian weight.'},
