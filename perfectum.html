<html lang="en">
<head>
<meta charset="UTF-8">

<title>Agrippa · Celestial Correspondences</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+DW+Pica:ital@0;1&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–black:  #0d0c0a;
–ink:    #141210;
–paper:  #e4ddd0;
–white:  #f0ead8;
–g1: #1c1a17;
–g2: #2e2a24;
–g3: #48433b;
–g4: #6e6558;
–g5: #9c9080;
–blue:   #1b3f7a;
–cyan:   #1a6070;
–red:    #7a1e12;
–yellow: #9a6c08;
–purple: #3d1850;
–gold:   #b07c0a;
–rule: 1px solid var(–g2);
–col-w: 210px;
}

html, body { height: 100%; overflow: hidden; }

body {
background: var(–black);
color: var(–paper);
font-family: ‘IM Fell English’, Georgia, serif;
display: flex;
flex-direction: column;
}

header {
height: 68px; min-height: 68px;
border-bottom: var(–rule);
display: flex; align-items: stretch; flex-shrink: 0;
}

.hd-brand {
width: var(–col-w); min-width: var(–col-w);
border-right: var(–rule);
display: flex; flex-direction: column; justify-content: center;
padding: 0 1.1rem;
background: var(–g1); flex-shrink: 0;
}
.hd-brand-title { font-family:‘IM Fell DW Pica’,serif; font-size:.98rem; color:var(–white); line-height:1.2; }
.hd-brand-sub { font-family:‘Courier Prime’,monospace; font-size:.52rem; letter-spacing:.2em; text-transform:uppercase; color:var(–g4); margin-top:.25rem; }

.hd-path {
flex:1; display:flex; align-items:center; padding:0 1.4rem; gap:.45rem;
font-family:‘Courier Prime’,monospace; font-size:.68rem; letter-spacing:.08em; color:var(–g4); overflow:hidden;
}
.hd-path-seg { white-space:nowrap; }
.hd-path-sep { color:var(–g3); flex-shrink:0; }
.hd-path-seg.active { color:var(–gold); }

.color-bar { display:flex; height:100%; width:6px; flex-direction:column; flex-shrink:0; }
.color-bar span { flex:1; }

.workspace { flex:1; display:flex; overflow-x:auto; overflow-y:hidden; }

/* ── COLUMNS ── */
.col {
width: var(–col-w); min-width: var(–col-w);
height: 100%; border-right: var(–rule);
display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
transition: min-width .2s, width .2s;
}
.col.hidden { width:0; min-width:0; border-right:none; overflow:hidden; }
.col.detail { width:auto; flex:1; min-width:300px; border-right:none; }

.col-head {
border-bottom: var(–rule); padding: .5rem 1rem;
background: var(–g1);
display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
}
.col-head-label { font-family:‘Courier Prime’,monospace; font-size:.54rem; letter-spacing:.25em; text-transform:uppercase; color:var(–g4); }
.col-head-count { font-family:‘Courier Prime’,monospace; font-size:.54rem; color:var(–g3); }

.col-body {
flex:1; overflow-y:auto; overflow-x:hidden;
scrollbar-width:thin; scrollbar-color:var(–g2) transparent;
}
.col-body::-webkit-scrollbar { width:3px; }
.col-body::-webkit-scrollbar-thumb { background:var(–g2); }

.col-section {
padding:.45rem 1rem .3rem;
font-family:‘Courier Prime’,monospace; font-size:.49rem; letter-spacing:.3em; text-transform:uppercase;
color:var(–g3); background:var(–ink);
border-bottom:var(–rule); border-top:var(–rule);
position:sticky; top:0; z-index:2;
}
.col-section:first-child { border-top:none; }

/* ── ENTRIES ── */
.entry {
border-bottom: var(–rule); padding: .62rem .85rem .58rem;
cursor:pointer; position:relative;
display:flex; align-items:center; gap:.55rem;
transition:background .1s; user-select:none;
}
.entry:hover { background:var(–g1); }
.entry.selected { background:var(–g2); }
.entry.selected::after { content:’’; position:absolute; right:0; top:0; bottom:0; width:2px; }

.entry[data-accent=“gold”].selected   { background:color-mix(in srgb,var(–gold) 12%,var(–g2)); }
.entry[data-accent=“blue”].selected   { background:color-mix(in srgb,var(–blue) 12%,var(–g2)); }
.entry[data-accent=“cyan”].selected   { background:color-mix(in srgb,var(–cyan) 12%,var(–g2)); }
.entry[data-accent=“red”].selected    { background:color-mix(in srgb,var(–red) 12%,var(–g2)); }
.entry[data-accent=“yellow”].selected { background:color-mix(in srgb,var(–yellow) 12%,var(–g2)); }
.entry[data-accent=“purple”].selected { background:color-mix(in srgb,var(–purple) 12%,var(–g2)); }

.entry[data-accent=“gold”].selected::after   { background:var(–gold); }
.entry[data-accent=“blue”].selected::after   { background:var(–blue); }
.entry[data-accent=“cyan”].selected::after   { background:var(–cyan); }
.entry[data-accent=“red”].selected::after    { background:var(–red); }
.entry[data-accent=“yellow”].selected::after { background:var(–yellow); }
.entry[data-accent=“purple”].selected::after { background:var(–purple); }

.entry-glyph { font-size:1rem; width:20px; text-align:center; flex-shrink:0; color:var(–g5); line-height:1; }
.entry-inner { flex:1; min-width:0; }
.entry-name { font-family:‘IM Fell DW Pica’,serif; font-size:.93rem; color:var(–paper); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.entry.selected .entry-name { color:var(–white); }
.entry-sub { font-family:‘Courier Prime’,monospace; font-size:.5rem; letter-spacing:.1em; color:var(–g4); margin-top:.1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.entry-arrow { color:var(–g3); font-size:.68rem; flex-shrink:0; }

/* ── DETAIL PANEL (col 3) ── */
.detail-body { padding: 2rem 2.2rem; }

.detail-context {
font-family:‘Courier Prime’,monospace; font-size:.56rem; letter-spacing:.2em;
text-transform:uppercase; color:var(–g4); margin-bottom:.8rem;
display:flex; align-items:center; gap:.6rem;
}
.detail-context-sep { color:var(–g3); }

.detail-name {
font-family:‘IM Fell DW Pica’,serif; font-size:2rem; line-height:1.1;
color:var(–white); margin-bottom:.3rem;
}

.detail-accent-bar {
height:2px; width:40px; margin-bottom:1.6rem;
}

.detail-text {
font-family:‘IM Fell English’,serif; font-size:1rem; font-weight:400;
color:var(–g6); line-height:1.85; margin-bottom:1.2rem;
}

.detail-text + .detail-text { border-top:1px solid var(–g2); padding-top:1.2rem; }

.detail-source {
font-family:‘Courier Prime’,monospace; font-style:italic;
font-size:.66rem; color:var(–g3); letter-spacing:.06em;
border-top:1px solid var(–g2); padding-top:.9rem; margin-top:.4rem;
line-height:1.6;
}

.col-empty {
display:flex; flex-direction:column; align-items:center; justify-content:center;
height:100%; gap:.6rem; text-align:center; padding:2rem;
}
.col-empty-glyph { font-size:1.4rem; color:var(–g2); }
.col-empty-text { font-family:‘Courier Prime’,monospace; font-size:.56rem; letter-spacing:.12em; text-transform:uppercase; color:var(–g3); line-height:1.8; }
</style>

<script>
/* ═══════════════════════════════════════════════════
   DATA  — each item now carries an `explain` string
═══════════════════════════════════════════════════ */
const DATA = {

saturn: { name:'Saturn', glyph:'♄', accent:'purple', group:'planet', sub:'Cold · Dry · Melancholic', categories:{
  properties:{ label:'Properties', icon:'◈', items:[
    {name:'Cold & Dry', explain:'The elemental temperament that defines Saturn above all others. Cold and Dry is the most contracted of the four combinations — it resists change, hardens, preserves by desiccation, and tends toward death and stone. Aristotelian natural philosophy treats this pairing as the signature of Earth as an element, though Saturn operates above the elemental sphere, impressing this quality downward into things beneath it.'},
    {name:'Melancholic', explain:'Of the four humours, black bile (melancholy) is the Saturnian one. It is cold, dry, and earthy — the heaviest humour. In excess it produces depression, fear, suspicion, and withdrawal; in balance or refinement, it produces the depth, patience, and philosophical penetration associated with scholars and mystics. Ficino\'s De Vita treats the management of Saturnian melancholy as the central problem of the intellectual life.'},
    {name:'Masculine', explain:'Saturn is masculine in Agrippa\'s gender schema, meaning active rather than passive — it impresses its qualities rather than receiving them. The masculine/feminine distinction in Renaissance astrology tracks the active/passive axis of Aristotelian metaphysics, not biological sex in any direct sense.'},
    {name:'Diurnal', explain:'Saturn belongs to the diurnal sect — the daytime grouping of planets. In classical astrology, sect (hairesis) determined which planets were dignified by day and which by night. The Sun, Jupiter, and Saturn form the diurnal sect. A diurnal planet placed in a daytime chart was considered more temperate and functional.'},
    {name:'Black · Ashen', explain:'Saturn\'s colours — black and the ashen grey of lead and dead matter — are its visible signatures in the world. Objects of these hues fall under Saturnian sympathy. The darkness is not merely symbolic: Agrippa understood colour as a physical quality transmitted through the same channels as other virtues, so a black stone or dark root literally participates in Saturnian coldness.'},
    {name:'Saturday', explain:'The day of the week is named for Saturn (Latin: Saturni dies). Each day is governed by the planet whose hour begins it, following the Chaldean order. Working with Saturnian substances or intentions on Saturday aligns the practitioner with the planet\'s temporal governance — a basic principle of elected timing in celestial magic.'},
    {name:'3 & 9', explain:'Numbers associated with Saturn through numerological correspondence. Three relates to Saturn\'s position in certain Neoplatonic arrangements and to the trinity of its primary qualities; nine (3×3) amplifies this signature. Talismans, prayers, and ritual repetitions were calibrated to these numbers to resonate with Saturnian influence.'},
    {name:'Earth', explain:'Saturn\'s elemental correspondence is Earth — the heaviest, coldest, driest element, the one furthest from the fiery source of life. This links Saturn to minerals formed deep underground, to roots and tubers, to bones and teeth within the body, and to all that is slow, dense, and enduring. The Earth correspondence also connects Saturn to agriculture and burial.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Binding', explain:'To bind is Saturn\'s most characteristic operative virtue — restraining movement, limiting freedom, fixing a person or situation in place. Agrippa classes this as an occult virtue because the mechanism is not physical: it works through the Saturnian channel that connects the planet to lead, to the lodestone, to certain roots. A talisman made at a Saturnian election and worked with the appropriate substances carries this virtue into operation.'},
    {name:'Constraining & Limiting', explain:'Related to but distinct from binding: where binding fixes, constraining sets a boundary. This virtue is used to limit the scope of a harmful force — to contain disease within a person rather than spreading, to prevent an enemy\'s influence from extending further. It is the virtue of walls, borders, and defined limits.'},
    {name:'Casting Discord', explain:'One of Saturn\'s darker operative virtues. Discord here means the dissolution of harmony between parties — the severing of alliances, the souring of friendships, the introduction of suspicion. The Picatrix, which Agrippa drew on, gives more explicit ritual procedures for this operation than Agrippa himself does.'},
    {name:'Conferring Long Life', explain:'A paradox at first glance: Saturn is associated with death, yet also with longevity. The resolution is that Saturn\'s cold dryness is preservative — it slows consumption and decay. The very quality that makes Saturn melancholic also makes it durable. Ficino wrote extensively on how to use Saturnian sympathy to extend life, provided the excess cold was balanced with solar and Jovial warmth.'},
    {name:'Governing the Dead', explain:'Saturn rules the boundary between living and dead and the realm beyond it. In Agrippa\'s system this gives Saturnian magic a role in communication with the deceased, in burial and mourning rites, and in operations involving ancestral spirits. The planet\'s slowness and depth connect it to what has passed and what lies beneath.'},
    {name:'Agricultural Virtue', explain:'Before its darker associations dominated, Saturn was the god of agriculture and the harvest in Roman religion. This older stratum persists in Agrippa: Saturn governs seeds planted in the earth, the slow ripening of crops, and the patient work of cultivation. Timing agricultural operations to Saturnian elections was a standard practice in the astrological-agricultural tradition from Hesiod forward.'},
    {name:'Inducing Melancholy', explain:'The capacity to produce or deepen the melancholic state in a person — used both as a curse and, paradoxically, as a preparation for philosophical or magical work. Agrippa and Ficino both note that the finest intellects have a Saturnian constitution. To deliberately induce melancholy was to open the mind to deeper, colder, more penetrating perception — at the cost of joy and sociability.'},
  ]},
  stones:{ label:'Stones', icon:'◇', items:[
    {name:'Sapphire', explain:'Agrippa lists sapphire as primary for Saturn by its colour (deep blue verging on black in older specimens) and its cold, heavy nature. The stone was believed to absorb and transmit Saturnian virtue, cooling fevers, calming excess passion, and providing protection. Note the paradox: Jupiter also claims sapphire, but in a lighter, azure variety — the shade indicates which planetary virtue predominates.'},
    {name:'Lodestone', explain:'The magnet is a quintessentially Saturnian stone because its virtue is invisible, heavy, and binding — it attracts iron inexplicably, which was the paradigmatic example of an occult virtue in the tradition. Its drawing power made it useful for binding operations and for attracting what was distant. It also connected to Saturn through its dark colour and its association with iron, the Martial metal, which Saturn governs in some lists through opposition.'},
    {name:'Chalcedony', explain:'A cryptocrystalline form of quartz, pale to grey in colour, chalcedony was used in antiquity to protect against phantasms, sadness, and night terrors — all Saturnian afflictions. Its hardness and density give it a Saturnian quality. Agrippa also assigns it to Mercury and to Deneb Algedi, illustrating how a stone\'s attribution could shift depending on which of its qualities was emphasised.'},
    {name:'Brown Jasper', explain:'Jasper in its darker, earthy varieties — brown, black-veined, or ochre — belongs to Saturn by colour and temperament. It was used in talismans for protection and endurance. Green jasper, by contrast, tends toward Jupiter or Venus. The principle is consistent: it is the physical qualities of the stone — its colour, weight, texture, and how it was formed in the earth — that determine its planetary sympathy.'},
    {name:'Onyx', explain:'Black or banded onyx is solidly Saturnian. In ancient and Renaissance tradition, onyx was associated with sorrow, discord, and dreams of black shapes — qualities directly linked to excess Saturnian influence. Yet the same stone could be used protectively against Saturnian harms: like cures like. Agrippa also attributes onyx to Gienah (the Crow star), which shares a Saturnine-Martial nature.'},
  ]},
  herbs:{ label:'Herbs & Plants', icon:'⚘', items:[
    {name:'Black Hellebore', explain:'The paradigmatic Saturnian plant. Black hellebore (Helleborus niger) is violently purgative, associated with madness, and poisonous in excess — everything the cold, dry, extreme Saturnian quality produces. It was used medically to purge black bile (melancholy) by the paradox of like-curing-like. In magic it appears in binding and malefic operations. It is also the herb of Algol, the Behenian star of Saturn-Mars nature.'},
    {name:'Cypress', explain:'The cypress is Saturnian because of its shape (tall, dark, tapering — like a finger pointing to death), its association with graveyards across Mediterranean cultures, and its slow growth. Its wood was used for coffins. In Agrippa\'s sympathetic logic, any plant deeply embedded in funerary culture participates in Saturn\'s governance of death and what lies beyond it.'},
    {name:'Mandrake', explain:'Mandrake (Mandragora officinarum) is among the most symbolically loaded plants in the Western tradition. Its root resembles the human form, it screams when pulled, it induces narcotic stupor, and it was used in both medicine and malefic magic. Its cold, narcotic, death-adjacent nature places it firmly under Saturn. It also links to the Moon through its nocturnal harvest rites — a reminder that planetary attributions could overlap.'},
    {name:'Opium Poppy', explain:'The poppy\'s soporific, dream-inducing properties link it both to Saturn (coldness, withdrawal, the suspension of vital activity) and to the Moon (dreams, visions, fluid alteration of consciousness). In Agrippa\'s system the poppy sits at the boundary between these two planets, but its heavy, death-adjacent narcotic quality pushes it toward Saturn. It appears in sleep and binding operations.'},
    {name:'Henbane', explain:'Hyoscyamus niger — a violently toxic plant whose alkaloids produce hallucination, confusion, and death in overdose. Its dark, sticky, foul-smelling nature marks it as Saturnian. In the grimoire tradition henbane smoke was used to summon spirits, particularly dark or infernal ones. It also appears in witchcraft lore as an ingredient of flying ointments.'},
    {name:'Mullein', explain:'Mullein (Verbascum thapsus) presents a more benign Saturnian herb. Its tall, stiff, grey-furry stalk, its association with crossroads and liminal spaces, and its use in torches for the dead (hence one folk name, "hag\'s taper") give it Saturnian character. It was used medicinally for respiratory complaints — linking it to the lungs, which Saturn governs partially through its cold quality.'},
    {name:'Hemlock', explain:'Hemlock (Conium maculatum) is one of the most dangerous plants in the European flora — the poison that killed Socrates. Its lethality, its association with cold numbness spreading from the extremities, and its dark-spotted stems mark it as deeply Saturnian. It appears in Agrippa\'s list without operative instruction, which is typical: he catalogues the sympathy without always specifying what to do with it.'},
  ]},
  metals:{ label:'Metals', icon:'⊕', items:[
    {name:'Lead', explain:'Lead is Saturn\'s metal without question across all traditions — Babylonian, Greek, Arabic, and Renaissance. Its heaviness, its grey-black colour, its toxicity, its low melting point, and its association with slowness and age all mark it as Saturnian. Alchemically, lead was the base metal from which gold (the Sun\'s metal) was to be extracted — Saturn and Sun as the poles of the process. Saturnian talismans were cast in lead at the appropriate astrological election.'},
  ]},
  animals:{ label:'Animals', icon:'⁂', items:[
    {name:'Mole', explain:'Blind, subterranean, and solitary, the mole lives in the earth and avoids light — a nearly perfect physical emblem of Saturnian qualities. Its association with the underworld and its near-blindness (Saturn governs the dimming of sense) make it a strong sympathetic carrier. In some traditions mole parts were used in preparations for Saturnian operations, particularly those involving concealment or burial.'},
    {name:'Ass', explain:'The ass is Saturnian through its patience, stubbornness, and association with heavy labour — Saturn governs what endures through drudgery. In antiquity the ass was also connected to Set (the Egyptian parallel of Saturn) and to agricultural toil. Apuleius\'s Golden Ass, in which a man is transformed into a donkey, is saturated with Saturnian and lunar symbolism.'},
    {name:'Wolf', explain:'The wolf appears under both Saturn and Mars — a reminder that animals could carry mixed planetary natures. Its Saturnian quality lies in its solitary, nocturnal, and liminal character: wolves hunt at the edges of human settlement, as Saturn governs edges and limits. Its Martial quality comes from its predatory violence. Agrippa assigns it to Saturn by its relationship to cold, darkness, and isolation.'},
    {name:'Basilisk', explain:'The basilisk — a legendary serpent whose gaze or breath kills — is Saturnian through its death-dealing quality and its cold reptilian nature. Its association with poisonous stares links it to the evil eye tradition, which had Saturnian associations. As a creature of pure malefic force, it embodies what Saturnian influence can do when unmitigated by any benefic planet.'},
    {name:'Crocodile', explain:'Ancient, armoured, cold, and lurking in the depths of water, the crocodile is Saturnian by temperament. In Egyptian tradition it was associated with Sobek, a deity with Saturnian overtones; it was also connected to death and the devouring of the unworthy. Its hide and teeth were used in amulets. Agrippa places it here for its cold, heavy, primordial quality.'},
    {name:'Bat', explain:'Nocturnal, blind in sunlight, and associated with caves and tombs — the bat is Saturnian by habitat and behaviour. Bats appear frequently in grimoire instructions for Saturnian operations, both as ingredients and as presences that signal the correct timing or atmosphere. Their liminal status (mammal yet flying, active yet avoiding light) marks them as creatures of threshold.'},
    {name:'Scorpion', explain:'The scorpion is shared between Saturn and Mars: its venom is Martially acute, but its cold nature and its association with death and hidden danger are Saturnian. In medical astrology the scorpion governed the genitals and secret parts, which fall under Scorpio — a sign with both Martial and Saturnian qualities in some lists. The scorpion tail appears in several talismanic images.'},
  ]},
  body:{ label:'Body Parts', icon:'⊗', items:[
    {name:'Spleen', explain:'In humoral medicine the spleen was the organ that produced and stored black bile — the Saturnian humour. An enlarged or overactive spleen was the physiological cause of melancholic conditions. Saturnian talismans and herbs were used to treat splenic disorders, both physical and psychological. The spleen\'s dark, dense, blood-filtering function was itself a physical expression of Saturnian coldness and contraction.'},
    {name:'Bladder', explain:'The bladder and urinary system fall under Saturn in some medical-astrological lists because of their relationship to retention and slow release — Saturnian qualities. Disorders of retention (inability to urinate, kidney stones, obstruction) were considered Saturnian afflictions. The connection to lead is relevant here: lead poisoning classically causes urinary dysfunction.'},
    {name:'Right Ear', explain:'The right ear\'s attribution to Saturn appears in lists that assign sensory organs to planets: the right ear for hearing at night or from below, the left for more ordinary hearing. Saturn\'s governance of deep, slow, subterranean vibration connects it to the faculty of hearing in its most penetrating register. Tinnitus and deafness were sometimes classified as Saturnian afflictions.'},
    {name:'Bones & Teeth', explain:'The hardest, coldest, most durable parts of the human body — bones and teeth are Saturnian by their very physical nature. They are the body\'s lead, its heaviest and most enduring substance. Medical astrology treated bone diseases (arthritis, brittle bones, dental problems) as Saturnian in origin. Saturn\'s transit over the natal position was associated with skeletal weakness in predictive astrology.'},
    {name:'Black Bile', explain:'The humour itself — not the organ but the fluid. Black bile is cold, dry, earthy, and heavy; in excess it produces melancholy, despondency, fearfulness, and eventually madness. The concept has no exact modern equivalent but encompasses something between depression and a constitutional tendency toward seriousness and introversion. Managing Saturnian excess was the central project of Renaissance learned medicine as applied to scholars.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Binding Enemies', explain:'The signature Saturnian operation: using lead tablets, wax images, or knotted cords at a Saturnian election to restrict an enemy\'s freedom of action. The defixio tradition (curse tablets) of antiquity often invoked Saturnian and chthonic powers for exactly this purpose. Agrippa describes the sympathetic logic without detailing procedure — the Picatrix is more explicit.'},
    {name:'Causing Wasting Disease', explain:'By the principle that a star or planet can produce in a body the qualities it naturally has, Saturnian influence — cold, dry, contracting — can induce wasting illness when directed malefically. This was the astrological-magical theory behind some disease causation: an enemy used a Saturnian talisman at a bad election to bring the planet\'s consuming coldness onto a victim.'},
    {name:'Talismans for Long Life', explain:'The benevolent inversion of Saturn\'s death association: a well-made Saturnian talisman, created at a fortunate Saturnian election with lead and the appropriate herbs, preserves life by slowing the consumption of vital heat. Ficino\'s De Vita Coelitus Comparanda gives detailed practical instruction on this use of Saturnian influence, emphasising timing and the counterbalancing role of Jovial warmth.'},
    {name:'Agricultural Magic', explain:'Planting, harvesting, and tending crops in accordance with Saturnian timing — connecting to the oldest stratum of Saturn\'s mythology as a god of the harvest. This is less about malefic magic and more about practical agricultural astrology: certain crops planted under Saturnian hours were believed to root more deeply and resist drought by absorbing Saturn\'s earthy, retentive virtue.'},
    {name:'Works of Darkness', explain:'A category covering operations that require concealment, that operate in shadow, or that deal with hidden or underground forces. This includes not only harmful magic but also protective works intended to be invisible, divination through dark mirrors or underground spaces, and communication with chthonic powers. Saturn governs what is below and unseen.'},
    {name:'Burial Rites', explain:'Saturn presides over the boundary between the living and the dead, making it the appropriate planetary power to invoke in funerary rites. Timing burial ceremonies to Saturnian hours, using Saturnian herbs and incenses, and making Saturnian prayers to ease the passage of the soul were all elements of the magico-religious tradition Agrippa inherited. This is one of the most ancient layers of Saturn\'s association.'},
  ]},
}},

jupiter: { name:'Jupiter', glyph:'♃', accent:'blue', group:'planet', sub:'Hot · Moist · Sanguine', categories:{
  properties:{ label:'Properties', icon:'◈', items:[
    {name:'Hot & Moist', explain:'Jupiter\'s elemental temperament — warm and humid — is the most life-giving of the four combinations. Heat promotes activity and expansion; moisture softens and nourishes. Together they define the sanguine temperament, the one most associated with health, generosity, and good fortune. This is why Jupiter is the greater benefic in the astrological tradition: its physical qualities are those most conducive to flourishing.'},
    {name:'Sanguine', explain:'The sanguine humour (blood) is Jupiter\'s. It is warm, moist, and expansive — the humour of optimism, generosity, sociability, and vigorous health. In Galenic medicine a sanguine constitution was the healthiest baseline, requiring the least correction. Jovial operations directed at health work by augmenting the sanguine quality, increasing vital warmth and the abundance of good blood.'},
    {name:'Masculine', explain:'Like Saturn and Mars, Jupiter is masculine — active and outwardly projecting. It impresses its warm, expansive quality onto the things beneath it. Its masculinity is notably benevolent compared to the sharp Martial version: Jovial masculine force is regal and generous rather than aggressive and competitive.'},
    {name:'Diurnal', explain:'Jupiter is a diurnal planet, belonging to the Sun\'s sect. In daytime charts it functions most effectively. The diurnal planets — Sun, Jupiter, Saturn — form a grouping associated with authority, reason, and outward-directed activity. Jupiter\'s diurnal nature connects it to public favour, legal institutions, and kingly power, all of which operate in daylight and in the open.'},
    {name:'Blue · Purple', explain:'Jupiter\'s colours are the noble ones — the blue of the clear daytime sky and the purple of royal garments. These were literally the colours of power in antiquity: Tyrian purple was restricted to emperors. Objects of these colours fall under Jovial sympathy, and working with blue or purple materials at a Jovial election was believed to draw Jovial fortune into the operation.'},
    {name:'Thursday', explain:'Thursday is Jovis dies — Jupiter\'s day. The Norse equivalent is Thor\'s day, Thor being the Germanic parallel of Jupiter in his thundering, sky-ruling aspect. Working on Thursday, particularly in the hour of Jupiter, brings the practitioner into alignment with the planet\'s temporal governance. Most positive operations — seeking fortune, health, legal success, honour — were timed to Jupiter\'s day and hour.'},
    {name:'4', explain:'Four is Jupiter\'s number in the Agrippan scheme, linked to the four elements which Jupiter moderates and balances, and to the square (four-sided figure) which represents stability and completeness. Magic squares of four (the 4×4 square summing to 34) are associated with Jupiter in Book II of the Occult Philosophy, where Agrippa gives numerical squares for each planet.'},
    {name:'Air', explain:'Jupiter\'s element is Air — lighter and more expansive than Saturn\'s Earth. Air is warm and moist, matching Jupiter\'s temperament exactly. This connects Jupiter to breath, to the upper atmosphere, to winds that carry seeds and news, and to the social fabric (which is, metaphorically, what holds people together as air holds things aloft). Jupiter rules what circulates and what is shared.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Augmenting Fortune', explain:'Jupiter\'s primary positive virtue: the capacity to increase what is good in a situation — wealth, reputation, opportunities, health. This is not the creation of fortune from nothing but the amplification of existing potential. A Jovial talisman works by tuning its bearer into the channel of Jovial emanation, making them more receptive to the fortuitous influences Jupiter is constantly raining downward.'},
    {name:'Bestowing Health', explain:'Jupiter\'s hot-moist quality, being the most life-promoting of the elemental combinations, makes it the natural operative power for healing. Ficino\'s De Vita devotes substantial attention to drawing down Jovial influence for health, particularly as a counterweight to the coldness of Saturnian melancholy. The liver, Jupiter\'s organ, was the seat of blood production in Galenic medicine — health flowed from it.'},
    {name:'Conferring Dignity', explain:'Dignity here means social standing, honour, and the recognition of one\'s worth by those with power to confer it. Jupiter governs kings, nobles, judges, and bishops — all figures of legitimate authority. Its virtue, when operative, brings one to the favourable attention of such figures and inclines them to extend honour and preferment. This is distinct from Mercury\'s eloquence: Jupiter does not persuade, it elevates.'},
    {name:'Goodwill & Favour', explain:'A subtler form of the dignity virtue: not formal recognition but the spontaneous warmth and goodwill of people encountered. A person under strong Jovial influence is perceived as generous, reliable, and fortunate, and others extend them good faith accordingly. This virtue was particularly sought in commercial and diplomatic contexts where trust was the operative currency.'},
    {name:'Moderating Excess', explain:'Jupiter as tempering force — its warm moisture softens extremes. Saturnian cold can be moderated by Jovial warmth; Martial heat can be cooled by Jovial moisture. This moderating function made Jupiter central to both medical and political philosophy: the good ruler, like the balanced constitution, holds extremes in check. Jovial talismans were sometimes used to counteract the effects of harsh Saturn transits.'},
  ]},
  stones:{ label:'Stones', icon:'◇', items:[
    {name:'Sapphire (azure)', explain:'The sky-blue sapphire is primarily Jovial — its colour echoes Jupiter\'s celestial domain and its calming, expansive quality. It was believed to protect against envy and poverty, to improve judgment, and to bring its wearer into favour with powerful people. The darker, near-black sapphire was more Saturnian; the deep azure variety is unmistakably Jovial in its lightness and clarity.'},
    {name:'Emerald', explain:'The emerald\'s rich green was associated with Jupiter\'s life-giving, moisture-laden nature and with Venus\'s love and beauty. In Jovial operations specifically, emerald was used for talismans of health and fortune and for achieving reconciliation. It was also attributed to Spica, the most fortunate Behenian star, which shares a Venereal-Mercurial nature that overlaps with Jovial qualities.'},
    {name:'Green Jasper', explain:'The green variety of jasper falls under Jupiter rather than Saturn\'s brown jasper. Its colour places it in the fertile, life-promoting register. Medieval lapidaries attributed to it the power to promote rain, to strengthen the stomach, and to protect against poison — all consistent with Jovial warmth and moisture. It was carved with Jovial sigils for health operations.'},
    {name:'Beryl', explain:'Beryl (here the pale greenish-blue variety, not emerald which is technically beryl but treated separately) was attributed to Jupiter for its translucent warmth and its correspondence to the colour of clear water and sky. It was held to promote goodwill and reconciliation. Agrippa also gives beryl to Sirius, where its protective-solar quality is emphasised.'},
    {name:'Topaz', explain:'Golden or yellow-orange topaz falls under Jupiter and the Sun jointly, depending on which quality is emphasised — its warmth and lightness. Topaz was believed to cool anger, prevent madness, and protect against lunar influences (the Moon being opposed to Jupiter\'s solar warmth in temperament). Its clarity was read as a Jovial quality: transparent, undimmed, neither dark nor murky.'},
    {name:'Amethyst', explain:'The violet amethyst is Jovial through its purple colour — the colour of Jupiter\'s royal dignity. In antiquity amethyst was believed to prevent drunkenness (a-methystos, Greek for not-intoxicating), which connects to Jupiter\'s moderating virtue. It was used in signet rings by bishops and kings, reinforcing its association with legitimate authority and Jovial governance.'},
  ]},
  herbs:{ label:'Herbs & Plants', icon:'⚘', items:[
    {name:'Agrimony', explain:'Agrimony (Agrimonia eupatoria) is warm and moderately drying — a temperate herb whose action matches Jupiter\'s balanced expansiveness. Herbalists used it for liver complaints (the Jovial organ) and for general tonification. In the doctrine of signatures its yellow flowers and upright habit suggest solar-Jovial affinity. In magic it appears in protective and prosperity workings.'},
    {name:'Betony', explain:'Betony (Betonica officinalis) was one of the most praised medicinal herbs of the Middle Ages and Renaissance, credited with curing almost everything — a reputation fitting for a Jovial plant. Its warm, digestive, and brain-strengthening properties made it a staple. In magical use it protected against evil spirits and nightmares, again consistent with Jovial light overcoming Saturnian and lunar darkness.'},
    {name:'Borage', explain:'Borage (Borago officinalis) was proverbially associated with courage and the elevation of spirits: "I, borage, bring always courage" was a Renaissance commonplace. Its blue star-shaped flowers are directly Jovial in colour. It was used in wine to lift melancholy — counteracting Saturn with Jupiter — and appeared in talismanic workings for confidence and good fortune.'},
    {name:'Hyssop', explain:'Hyssop (Hyssopus officinalis) is an aromatic, warm, and slightly bitter herb associated with purification and the clearing of Saturnian obstructions. Its biblical associations with cleansing (Psalm 51) gave it spiritual weight. Medicinally it was used for respiratory complaints — Jupiter governing the lungs partially through its warming, opening action.'},
    {name:'Lungwort', explain:'The name itself signals the connection: lungwort\'s spotted leaves resembled diseased lung tissue under the doctrine of signatures, marking it as a plant that could treat what it resembled. Jupiter governs the lungs, and this plant\'s warm, expansive quality made it appropriate for clearing Saturnian cold from the respiratory system. It was used for coughs, bronchitis, and breathing difficulties.'},
    {name:'Oak', explain:'The oak is the supreme Jovial tree — sacred to Zeus/Jupiter across Indo-European cultures, the tree struck by lightning (Jupiter\'s weapon), the strongest and most enduring of European forest trees. Its acorns fed pigs and people; its wood built ships and halls. In magic, oak bark, leaves, and galls were used in Jovial workings for protection, strength, and the favour of authorities.'},
    {name:'Chestnut', explain:'Like the oak, the chestnut is a large, fruit-bearing, long-lived tree of noble bearing — fitting for Jupiter. Its nuts were a staple food in many regions, connecting it to Jupiter\'s provision and abundance. Its warm, sweet nature contrasts with Saturn\'s bitter herbs. It appears in lists of Jovial plants for prosperity and health workings.'},
  ]},
  metals:{ label:'Metals', icon:'⊕', items:[
    {name:'Tin', explain:'Tin is Jupiter\'s metal — lighter than lead (Saturn), heavier than gold (Sun). It is malleable, not toxic, with a faintly whitish lustre. In alchemy tin corresponded to Jupiter in the sequence: Lead=Saturn, Tin=Jupiter, Iron=Mars, Gold=Sun, Copper=Venus, Quicksilver=Mercury, Silver=Moon. Jovial talismans were cast or engraved in tin at the appropriate election. Its moderate quality mirrors Jupiter\'s temperate character.'},
    {name:'Electrum', explain:'Electrum is a naturally occurring alloy of gold and silver — it was treated in the ancient world as its own distinct metal before the components were understood. Its mixed solar-lunar character, combined with its rarity and beauty, gave it associations with divine power and moderation between extremes. Agrippa places it under Jupiter as a secondary metal, reflecting Jupiter\'s moderating role between the extremes of Sun and Moon.'},
  ]},
  animals:{ label:'Animals', icon:'⁂', items:[
    {name:'Eagle', explain:'The eagle is Jupiter\'s bird without dispute — the thunderbolt-bearer\'s companion in Roman iconography, the king of birds. Its high flight, its clear vision, its dominion over other birds, and its solar qualities (facing the sun without blinking) make it the perfect Jovial animal. Eagle parts were used in Jovial talismans, and the eagle image was engraved on Jovial stones for workings of authority and favour.'},
    {name:'Peacock', explain:'The peacock\'s magnificent tail, with its eye-like patterns, was read as an emblem of the starry sky — making it Jovial and celestial. Its pride and display match Jupiter\'s dignity. In antiquity the peacock was sacred to Juno, Jupiter\'s consort, reinforcing the association. Peacock feathers and imagery appear in Jovial operations for beauty, admiration, and social elevation.'},
    {name:'Stag', explain:'Noble, fast, forest-dwelling, and crowned with branching antlers, the stag is the Jovial animal of the land as the eagle is of the air. Its associations with kingly hunting, with renewal (antlers shed and regrown), and with the wild power of nature under civilised management all connect to Jupiter\'s governance of abundance and right order. Stag horn was used medicinally for fever — a Jovial remedy.'},
    {name:'Whale', explain:'The greatest creature of the sea — Jovial by sheer magnitude. Jupiter governs bigness, and the whale as the largest animal participated in Jovial virtue through this principle of correspondence by scale. Its role as a gentle giant (in the Renaissance imagination) also fits Jupiter\'s character: vast power exercised without undue violence.'},
    {name:'Dolphin', explain:'The dolphin was the most beloved sea creature in antiquity — associated with Apollo and with benevolent intervention in human affairs (rescuing sailors, guiding ships). Its intelligence, its playfulness, and its relationship with humans made it the Jovial creature of the waters: warm, sociable, helpful, and graceful. Dolphin imagery appears in Jovial amuletic traditions.'},
    {name:'Elephant', explain:'The elephant is Jovial by its combination of immense size, long memory, and seemingly rational behaviour. Ancient and Renaissance sources attributed to elephants the virtues of temperance, chastity, religious feeling, and memory — a quasi-human set of virtues that matched Jupiter\'s civilising, temperate character. Ivory was used in Jovial workings, and elephant imagery carried the planet\'s virtue.'},
  ]},
  body:{ label:'Body Parts', icon:'⊗', items:[
    {name:'Liver', explain:'The liver is Jupiter\'s primary organ — in Galenic medicine it was the seat of blood production and the source of natural spirits, the lowest of the three pneumatic spirits that governed the body. Because Jupiter is the great benefic and blood is the most life-giving humour, the liver\'s health was central to overall vitality. Jovial herbs and talismans were used to treat hepatic disorders and to strengthen the blood.'},
    {name:'Lungs', explain:'The lungs fall partly under Jupiter (for their warm, expansive, air-processing function) and partly under Mercury (for their role in breath and voice). Jupiter\'s attribution reflects the lung\'s need for warmth and moisture to function — cold, dry Saturnian influence was believed to cause respiratory contraction. Jovial plants like hyssop and lungwort were prescribed for pulmonary complaints.'},
    {name:'Ribs & Sides', explain:'The lateral and protective structures of the torso fall under Jupiter in some medical-astrological lists. This connects to Jupiter\'s protective and containing function — the ribs house the vital organs as Jupiter\'s governance provides the framework of law and order within which life flourishes. Pleurisy and rib injuries were sometimes attributed to afflicted Jupiter.'},
    {name:'Semen', explain:'In Galenic-Renaissance physiology, semen was understood as a refined form of blood — the most spirituous and vital fluid, containing the generative power. Jupiter\'s attribution follows from its governance of vital warmth and blood: semen was blood raised to its highest expression. Jovial influence on this faculty related to fertility, generative capacity, and the transmission of virtue to offspring.'},
    {name:'Blood', explain:'Blood is the Jovial humour — warm, moist, red, and life-giving. Jupiter governs blood in its healthy state: abundant, clear, and warm. Saturnian or Martial excess could darken or corrupt the blood (black bile and yellow bile being degraded forms). Working with Jovial influence was believed to purify and enrich the blood, which in turn improved mood, complexion, and physical vitality.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'Gaining Wealth & Fortune', explain:'The central positive Jovial operation: attracting material abundance through sympathetic alignment with Jupiter\'s expansive virtue. This involved timing commercial ventures, investments, or petitions for favour to Jovial elections; working with tin, topaz, or blue sapphire; and using Jovial suffumigations (incenses) to draw the planet\'s influence into the space. The target was not luck but the opening of channels through which fortune flows.'},
    {name:'Legal & Judicial Success', explain:'Jupiter governs judges, laws, and institutions of justice. Operations for success in legal proceedings were timed to Jupiter\'s day and hour, used Jovial materials, and sometimes involved engraving specific images on tin — a magistrate or figure of authority in the Jovial talisman tradition. The operative logic was that Jupiter\'s virtue, in the judge, inclined him toward just and favourable decisions.'},
    {name:'Health Talismans', explain:'Talismans made under Jovial elections were worn or placed to promote general health by maintaining the sanguine balance. Ficino recommended them specifically for scholars (who were constitutionally prone to Saturnian melancholy) as a counter-weight. They were engraved with Jovial images on tin or set with azure sapphire, and consecrated with Jovial prayers at the correct astrological moment.'},
    {name:'Reconciliation', explain:'Jupiter\'s moderating and expansive warmth made it the appropriate planetary power for reconciling disputes and restoring harmony between parties. Unlike Venus (which reconciles through love and desire) or Mercury (which negotiates), Jupiter reconciles through shared recognition of a higher order: the parties are brought to agreement by appeal to justice and mutual benefit, both of which Jupiter governs.'},
    {name:'Works of Honour', explain:'Operations intended to advance one\'s social standing, to gain recognition from superiors, to obtain titles or positions of dignity. These were among the most practical uses of celestial magic for Renaissance practitioners embedded in hierarchical institutions — courtiers, clergymen, scholars — who needed the goodwill of patrons and superiors to advance.'},
  ]},
}},

mars: { name:'Mars', glyph:'♂', accent:'red', group:'planet', sub:'Hot · Dry · Choleric', categories:{
  properties:{ label:'Properties', icon:'◈', items:[
    {name:'Hot & Dry', explain:'The most extreme of the four elemental combinations for producing active force. Heat drives activity upward and outward; dryness sharpens and separates. Together they produce the choleric temperament — quick to anger, decisive, physically energetic, and prone to inflammation. Mars\'s Hot-Dry quality makes it the most urgent planet: it does not wait, moderate, or accumulate as Saturn does, but strikes.'},
    {name:'Choleric', explain:'Yellow bile is the Martial humour — hot, dry, bitter, and sharp. In excess it produces irascibility, aggression, rashness, and fever. In balance it provides the energy, decisiveness, and physical courage that make a good soldier or athlete. Medical-astrological treatment of choleric excess involved cooling and moistening — opposing planetary influences, particularly those of the Moon and Venus.'},
    {name:'Masculine', explain:'Mars is masculine in the most aggressive sense in Agrippa\'s scheme — hot, projecting, competitive, externally oriented. Its masculine force is not the regal expansiveness of Jupiter or the cold authority of Saturn, but the sharp, directed force of a weapon. It impresses by cutting rather than by containing or illuminating.'},
    {name:'Nocturnal', explain:'Mars belongs to the nocturnal sect — the grouping of planets that function in night charts. Moon, Venus, and Mars are nocturnal. Mars\'s nocturnal nature is somewhat paradoxical given its fiery quality, but it reflects the tradition\'s sense that Martial force operates better in the aggressive, unrestrained context of night than in the structured daylight world governed by the Sun and Jupiter.'},
    {name:'Red · Fiery', explain:'Mars\'s colour is unmistakable — the red of blood, fire, and the planet\'s actual ruddy appearance. Red objects participate in Martial sympathy by this physical quality. The connection to blood here is different from Jupiter\'s governance of blood: where Jupiter rules healthy, circulating blood, Mars rules blood shed by violence, the blood of wounds and battle.'},
    {name:'Tuesday', explain:'Tuesday is Martis dies — Mars\'s day. In Romance languages this is clear (French mardi, Spanish martes); in English, Tuesday is Tyr\'s day — Tyr being the Norse war god parallel to Mars. Martial operations — for courage, victory, physical strength, competitive success — were timed to Tuesday and to the hour of Mars. Legal conflicts were also sometimes worked on Tuesday for aggressive rather than Jovial approaches.'},
    {name:'5', explain:'Five is Mars\'s number, connected to the pentagram (five-pointed star) which had amuletic uses and to Mars\'s position in the planetary order. In Agrippa\'s magic square system, the square of Mars is 5×5, summing to 65, with individual rows summing to 13. These numbers appear in Martial talismans and invocations.'},
    {name:'Fire', explain:'Mars\'s element is Fire — upward-moving, consuming, transformative. This connects Mars to forges (where iron is worked), to all burning and inflammatory processes, and to the rapid transformation of one state into another. Fire destroys to create; Mars wounds to conquer. The fire element also links to animal heat — the vital warmth that enables muscular exertion and aggressive action.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Conferring Courage', explain:'The primary Martial virtue — not reckless aggression but the operative capacity to override fear and act in the face of danger. A Martial talisman, properly made, was believed to transmit this virtue directly to its bearer, inclining the spirit toward boldness. Soldiers and combatants were the obvious intended recipients, but courage in the face of adversity in any domain fell under this virtue.'},
    {name:'Sharpening Strength', explain:'Mars sharpens what already exists — it does not create strength ex nihilo but makes existing physical capacity more effective, more precise, more cutting. The analogy is to tempering a blade: Martial virtue does not add metal but aligns and hardens what is there. This relates to Mars\'s hot-dry quality, which removes excess moisture and contracts to a finer, harder edge.'},
    {name:'Producing Discord & War', explain:'The malefic face of Martial virtue: the capacity to introduce violent conflict between parties. In the grimoire tradition, Martial operations for discord used iron, the herbs of Mars, and Martial timing to implant the combative quality into a situation. This is the magical parallel of Saturnian discord-casting, but where Saturn\'s discord is cold and bitter, Mars\'s is hot and explosive.'},
    {name:'Causing Fevers', explain:'Fever is Mars\'s medical signature — the excess of hot-dry quality producing inflammatory heat in the body. This virtue operated both as a malefic (inducing fever in an enemy) and as a medical analogy (understanding that feverish patients were under Martial influence and should be treated with cooling, moistening remedies). The doctrine was dual: the planet that caused could also clarify the treatment.'},
    {name:'Giving Victory in Battle', explain:'The highest Martial operative virtue: success in direct physical or competitive confrontation. Martial talismans for victory were among the most common items in the astrological-magical tradition across cultures. They were made at Martial elections, often in iron, engraved with images of armed men or predatory animals, and carried or worn in competition or combat.'},
  ]},
  stones:{ label:'Stones', icon:'◇', items:[
    {name:'Diamond', explain:'Diamond\'s attribution to Mars may seem counterintuitive given its association today with Venus and luxury, but in the Renaissance its hardness was the defining quality: nothing cuts diamond, and diamond cuts everything else. This extreme hardness was read as Martial — the quality of invincibility and cutting power. Diamond talismans were worn for protection in battle and to make the wearer feared.'},
    {name:'Bloodstone', explain:'Bloodstone (heliotrope — green jasper speckled with red) is Martial by its direct visual reference to blood. The red spots were read as drops of blood in a green field, making this the most literally Martial stone. It was used in ancient and Renaissance medicine to stop bleeding (a sympathetic cure: the stone that looks like blood governs blood), and in magic for strength and protection in violent situations.'},
    {name:'Ruby', explain:'Ruby\'s deep red colour places it under Mars (and also the Sun in its brighter, more vital red). The Martial ruby was associated with courage, with protection against wounds, and with governing the blood. Where bloodstone stops hemorrhage by sympathy, ruby was believed to warm the blood and maintain courage. It was set into weapons and armour as a protective talisman.'},
    {name:'Amethyst (red)', explain:'Red or reddish amethyst — the variety that tends toward purple-red rather than violet — carries a Martial quality through its colour. This illustrates Agrippa\'s principle that a stone\'s planetary affiliation could shift with its colour variety: the same mineral species (corundum, quartz) would be attributed differently depending on whether it read as fiery-red (Martial) or violet (Jovial) or blue (Saturnian or Jovial).'},
    {name:'Red Jasper', explain:'Red jasper is solidly Martial — its earthy red-brown colour, its density, and its historical use in seals and amulets for strength and protection place it in the Martial register. It was the stone most commonly used for Martial engraving: images of armed men, scorpions, or the head of a warrior were cut into red jasper for operations of courage and victory.'},
  ]},
  herbs:{ label:'Herbs & Plants', icon:'⚘', items:[
    {name:'Plantain', explain:'Plantain (Plantago major) is Martial by its action rather than its appearance: it arrests bleeding and inflammation — it counters the excess of Martial qualities with the same plant force. This is the homeopathic logic underlying many herbal attributions: a Martial plant can treat Martial conditions because it operates in the same domain. Plantain was also used for wounds and bruises.'},
    {name:'Garlic', explain:'Garlic is emphatically Martial — hot, sharp, penetrating, and driving away what is noxious. Its sulfurous compounds (modern chemistry confirms what Renaissance noses knew) give it an acrid, aggressive quality. It was used to protect against plague, vampires, evil spirits, and physical enemies — all conceived as Martial threats. It also appeared in Martial foods eaten before battle to increase aggression.'},
    {name:'Radish', explain:'Sharp, pungent, and hot, the radish participates in Mars\'s hot-dry quality through its taste and action. It was used medicinally as a digestive stimulant, cutting through heavy foods — again the Martial quality of sharpness and penetration. In the body of Martial herb doctrine, penetrating, warming, sharp-tasting plants consistently appear.'},
    {name:'Pepper', explain:'Black pepper — the most globally traded spice of the Renaissance — is Martial by its heat and its sharpness. Hot, dry, stimulating, and preservative, pepper exemplifies the beneficial uses of Martial virtue in food and medicine. It was used to prevent and treat cold, Saturnian conditions. Its role in long-distance trade also gave it Mercurial overtones, but the operative quality is Martial.'},
    {name:'Wormwood', explain:'Wormwood (Artemisia absinthium) is bitter, aromatic, and intensely hot — a Martial herb par excellence. It was used to expel parasites and stimulate the digestive system with force. In magic it appeared in operations of aggression and in preparations for confrontation. Its bitterness was read as Martial: the sharp, uncompromising quality that admits no softness.'},
    {name:'Nettles', explain:'The stinging nettle defends itself with a Martial mechanism — tiny needles that inject formic acid and cause burning inflammation. This is the doctrine of signatures in its most direct form: the plant that stings like a warrior belongs to the warrior planet. Medicinally, nettles were used for arthritis (another Martial inflammation condition) and to stimulate circulation.'},
  ]},
  metals:{ label:'Metals', icon:'⊕', items:[
    {name:'Iron', explain:'Iron is Mars\'s metal without question — it is the metal of weapons, of armour, of the forge. Its hardness and utility in violence define its Martial character. Iron also rusts red — the planet\'s own colour. In the alchemical sequence it occupies the Mars position. Martial talismans were engraved in iron or steel. The smell of iron (blood smell) connects it to the Martial humour.'},
    {name:'Steel', explain:'Steel is refined, tempered iron — iron that has been subjected to Martial process (fire, hammering) to become harder and sharper. It inherits all of iron\'s Martial qualities and amplifies them. The choice between iron and steel in talismanic work was partly practical (steel holds engraving better) and partly symbolic: steel represents Martial virtue at its most refined and effective.'},
    {name:'Sulphur', explain:'Sulphur is not a metal but is classified with Martial metals in Agrippa\'s scheme through its hot, dry, burning quality — it is fire made solid. In alchemy sulphur represented the active, fiery, Martial principle (paired with mercury, the passive-fluid principle). It appeared in incenses for Martial operations and in the theory of metallic formation within the earth, where sulphur\'s heat was believed to cook minerals into form.'},
  ]},
  animals:{ label:'Animals', icon:'⁂', items:[
    {name:'Horse', explain:'The war horse is the paradigmatic Martial animal — the instrument and companion of military force across history. Its power, speed, and training for violence make it Martial. In operations, horse imagery appeared on Martial talismans for speed, victory, and physical power. The connection to cavalry also linked horses to the aristocratic, Jovial dimension of warfare, creating an overlap in the tradition.'},
    {name:'Mule', explain:'The mule appears in Martial lists for its stubbornness and its role in military logistics — carrying supplies in campaigns, enduring harsh conditions. It is less a symbol of aggressive Martial virtue than of the grinding, enduring aspect of sustained conflict. Its sterility (mules cannot reproduce) also gave it associations with limitation and forced service.'},
    {name:'Goat', explain:'The goat is Martial by its aggressiveness, its hard hooves that it uses to fight, and its association in Renaissance and earlier tradition with lustful, combative energy. The ram and the goat share Martial qualities through Aries, the sign Mars rules. In some traditions the goat is also assigned to Saturn through its mythological connections to Pan and to chthonic wild spaces.'},
    {name:'Wolf', explain:'The wolf shares Martial and Saturnian qualities. Its Martial aspect is the predatory aggression — the pack hunter that tears flesh and dominates through speed and cooperative violence. Its howl at night, its blood-smell, and its role as the enemy of the settled pastoral world all mark it as Martial. Roman augury associated the wolf with Mars, and the she-wolf nursed Romulus and Remus, Mars\'s sons.'},
    {name:'Pike', explain:'The pike (the fish) is the Martial predator of freshwater — ferocious, fast, and equipped with sharp teeth, it attacks prey much larger than itself. Its sleek, weaponlike body and its aggressive behaviour made it the Martial fish. In the doctrine of signatures, its pointed head was read as weapon-shaped. It appeared in Martial imagery for operations requiring fierce aggression.'},
    {name:'Vulture', explain:'The vulture circles battlefields and feeds on the fallen — making it the Martial bird of death\'s aftermath. Where the eagle is Jupiter\'s regal bird, the vulture is Mars\'s scavenger, essential to the cycle of violence. It was also associated with purification through consumption of the dead (a paradoxical form of Martial cleansing). Vulture parts appeared in Martial preparations and protective amulets.'},
  ]},
  body:{ label:'Body Parts', icon:'⊗', items:[
    {name:'Gall Bladder', explain:'The gall bladder stores and concentrates bile — yellow bile in the Galenic scheme, the Martial humour. It is the organ of concentrated, stored aggression. When the gall bladder is overtaxed (as in choleric constitutions), excess bile spills into the system, causing irritability, inflammation, and the yellow complexion associated with choleric excess. Martial herbs were used to regulate biliary function.'},
    {name:'Left Ear', explain:'The left ear\'s attribution to Mars in some lists reflects the tradition\'s association of the left side with nocturnal, active, or aggressive qualities (Mars being nocturnal). The assignment of sensory organs to planets varied across authorities; the left ear\'s connection to Mars may also relate to the left side\'s association with the unconscious and sudden sensation.'},
    {name:'Muscles', explain:'The muscular system as a whole is Martial — the means of physical exertion, attack, and defense. Martial influence on a person increased muscular tone and physical capacity; Martial remedies were used for muscle weakness and atrophy. The connection is straightforward: Mars governs the body\'s capacity for forceful action, and muscles are the primary instrument of that capacity.'},
    {name:'Kidneys', explain:'The kidneys are shared between Mars and Venus — Mars by their filtering and expelling function (aggressive elimination of waste), Venus by their anatomical proximity to the generative organs. This double attribution illustrates Agrippa\'s awareness of overlap: the kidneys\' function can be read as either Martial (forceful expulsion) or Venereal (governing the region of generation and desire).'},
    {name:'Yellow Bile', explain:'Yellow bile — hot, dry, bitter, sharp — is the Martial humour directly. It is produced by the liver (Jovial) but stored and concentrated in the gall bladder (Martial). In excess it produces the choleric temperament: impatient, angry, quick to act, prone to fever and inflammation. In moderate amounts it provides the sharp, decisive quality of the Martial character at its best.'},
  ]},
  operations:{ label:'Operations', icon:'◉', items:[
    {name:'War & Victory', explain:'The primary Martial operation: timing military action, blessing weapons, and making talismans for victory in armed conflict. This was among the most practically urgent applications of celestial magic for Renaissance practitioners embedded in a world of constant warfare. Operations were timed to Martial elections, conducted with iron tools and instruments, and accompanied by Martial prayers to whatever Intelligence governed the planet.'},
    {name:'Causing Fear in Enemies', explain:'A subtler Martial operation than direct violence: projecting the aura of terrifying force without physical combat. This involved Martial talismans worn or displayed to intimidate, Martial incenses burned at the threshold to discourage entry, and operations that worked through the sympathetic channel to induce the psychological state of fear in a designated target.'},
    {name:'Works of Courage & Strength', explain:'Positive Martial operations for personal empowerment: strengthening the physical body, overcoming timidity, developing the decisive character of the Martial type. These were not malefic but self-directed, drawing down Martial virtue to improve one\'s own capacities. Athletes, soldiers, and anyone facing a demanding physical or confrontational challenge could seek Martial assistance.'},
    {name:'Binding Iron', explain:'A specific technical operation: the use of Martial talismans and timing to protect iron objects (weapons, armour, tools) from breaking or becoming ineffective. The logic was sympathetic — Mars governs iron, so Martial operations strengthen the metal\'s inherent virtue. This appears in battlefield magical practice and in the craft traditions associated with smithing.'},
    {name:'Fevers & Inflammation', explain:'Both as a cause and a cure: Martial operations could be used to induce fever in a target (malefic) or to understand and treat fever in a patient (medical). The treatment logic was not homeopathic in this case — one did not always treat Martial excess with more Mars — but involved identifying which Martial planet was afflicting the body and working to relieve or redirect the influence.'},
  ]},
}},

sun: { name:'Sun', glyph:'☉', accent:'yellow', group:'planet', sub:'Hot · Dry · Vital', categories:{
  properties:{ label:'Properties', icon:'◈', items:[
    {name:'Hot & Dry', explain:'The Sun\'s elemental quality is Hot and Dry — like Mars, but in the Sun\'s case this is not the aggressive dryness of conflict but the life-sustaining warmth of light. The Sun is the source of all warmth in the sublunary world; its dryness is the dryness of ripening and maturation rather than of withering. Ptolemy in the Tetrabiblos made the Sun\'s heat the paradigm of a manifest virtue — it needs no occult explanation.'},
    {name:'Vital (sanguine)', explain:'Though sometimes classified as sanguine (warm and moist) to distinguish it from the Martial hot-dry, the Sun\'s vitality is its most distinctive quality. It is not the humour itself but the vital spirit — the pneuma that animates the blood and drives the heart. This makes the Sun less a humoral planet and more the source of the vital principle that all the humours serve.'},
    {name:'Masculine', explain:'The Sun is masculine — the paradigmatic outward, active, light-projecting force. Its masculinity is regal rather than combative: it does not compete but illuminates. In the gender polarity of Renaissance cosmology, the Sun and Moon are the primary masculine-feminine pair, the celestial parents from whom all other planetary influences descend.'},
    {name:'Diurnal', explain:'The Sun is of course diurnal — the diurnal luminary. It is the center of the diurnal sect and the source of the day/night distinction itself. Its governance of daylight connects it to everything public, open, and visible: royal courts, formal institutions, open ceremonies. What operates in the Sun\'s light falls under its governance.'},
    {name:'Gold · Yellow', explain:'The Sun\'s colour is gold — the most precious of metals is also the Sun\'s colour in the world. Yellow, amber, and gold-toned objects participate in Solar sympathy. This is not merely symbolic: the physical quality of luminous, warm yellow-gold light was believed to transmit Solar virtue into objects of matching colour, just as other physical qualities transmitted other planetary qualities.'},
    {name:'Sunday', explain:'Sunday is Solis dies — the Sun\'s day, named across European languages. It was the day of rest in the Christian tradition precisely because it was the day of the greatest celestial power, inappropriate for ordinary labour and appropriate for worship and contemplation. Solar operations — for health, fame, royal favour, spiritual illumination — were timed to Sunday and the Solar hour.'},
    {name:'6', explain:'Six is the Solar number, related to the hexagram (six-pointed figure) and to the perfect number (1+2+3=6). The Solar magic square in Agrippa is 6×6, summing to 111 per row and 666 total — numbers that carried both positive Solar associations and, in the Christian context, ominous ones. This numerical table was used in Solar talisman work.'},
    {name:'Fire / Ether', explain:'The Sun is associated with Fire as element, but more precisely with Ether — the fifth element, the substance of the celestial spheres themselves, beyond the four terrestrial elements. The Sun occupies the middle position among the seven planets and was conceived in some Neoplatonic schemes as the heart of the celestial body, from which vital warmth radiated in both directions to the outer and inner planets.'},
  ]},
  virtues:{ label:'Virtues', icon:'✦', items:[
    {name:'Illuminating the Mind', explain:'The Sun\'s light, applied to the intellect, produces clarity of understanding — the ability to see clearly what was obscure. This is both a literal connection (sunlight enables sight) and a metaphorical one (intellectual light comes from the same source as physical light). In Neoplatonic and Hermetic thought, the Sun was the visible image of the Good — to align with it was to align the mind with truth.'},
    {name:'Conferring Royalty', explain:'The Sun governs kings by right — not because kings are necessarily just but because the Sun occupies the central, dominant position among the planets as the king occupies that position among humans. Solar operations for gaining royal favour were among the most sought-after in the tradition, particularly by courtiers and those seeking patronage. The logic was simple: approach the Sun\'s virtue to approach what the Sun governs.'},
    {name:'Bestowing Fame', explain:'Fame is visibility — being seen and known. The Sun makes things visible; Solar virtue, applied to a person, makes them visible to others in a positive sense. This virtue was distinguished from Jupiter\'s conferral of dignity: Jupiter makes one respected in the proper hierarchy, while the Sun makes one known and celebrated publicly. Both were sought, but fame operated across wider audiences.'},
    {name:'Granting Health', explain:'The Sun is the source of vital heat — the heat that sustains all life. Its virtue, drawn down through Solar talismans, herbs, and timing, replenished the vital spirit when it was depleted. This was the most fundamental of the Sun\'s beneficial virtues: not specific healing of a particular condition but the restoration of the underlying vitality from which all health flows.'},
    {name:'Repelling Poison', explain:'Solar light and warmth were considered antidotes to the cold, dark, occult operations of poisoning — both physical (toxic substances) and magical (malefic operations using Saturnian darkness). Solar talismans were worn as universal protections against poisoning, and Solar herbs (like celandine, which was bright yellow) were used as antidotes. The logic: poison operates in shadow; light dissolves shadow.'},
    {name:'Driving Away Evil Spirits', explain:'Spirits associated with darkness, coldness, and malevolence — whether conceived as demons, ghosts, or malefic astrological influences — were opposed by Solar virtue. This is the cosmological logic of light overcoming darkness made operative: a Solar talisman or suffumigation created a space or person in which darkness could not persist. This virtue made the Sun central to apotropaic and exorcistic practice.'},
  ]},
  stones:{ label:'Stones', icon:'◇', items:[
    {name:'Chrysolite', explain:'Chrysolite (the ancient name for what we now call peridot or olivine) — a warm, yellowish-green stone — was a primary Solar stone in the ancient and Renaissance traditions. Its golden-green colour suggests ripeness and solar warmth. It was believed to drive away nightmares and protect against folly. Agrippa also gives it to Vega, the Behenian star of Venereal-Mercurial nature, where a different quality is emphasised.'},
    {name:'Carbuncle', explain:'Carbuncle (the medieval name for what is usually red garnet or, in some sources, ruby) was held to be the most Solar of all stones — its deep red-orange glowing from within as if it contained its own light. It was believed to preserve health, protect against poison, and drive away plague. The quality of inner luminosity was its key Solar signature: it seemed to shine by its own virtue, not by reflecting.'},
    {name:'Ruby', explain:'Ruby appears under both the Sun and Mars — its red colour is Martial in its darker, blood-like hues and Solar in its brighter, fiery hues. Solar ruby was associated with the heart and with royal dignity; Martial ruby with courage and protection in battle. The distinction was made by shade and by context: the same stone could be directed toward either planet depending on the quality the practitioner wished to engage.'},
    {name:'Diamond', explain:'Diamond\'s Solar attribution (alongside its Martial one) rests on its property of greatest brilliance — it reflects and refracts light more than any other stone, giving it a connection to the Sun as the supreme source of light. A Solar diamond talisman was believed to make its wearer bold, invincible, and favoured by authority. Its hardness was Martial; its brilliance was Solar.'},
    {name:'Topaz (gold)', explain:'Golden topaz — the warm, honey-coloured variety — is primarily Solar. Its colour exactly echoes the colour of sunlight, making it the stone most directly correspondent to the Sun by the principle of chromatic sympathy. It was used in Solar talismans for vitality, fame, and the repulsion of envy and malice. It was also attributed to the Sun\'s governance of the heart.'},
    {name:'Heliotrope', explain:'Heliotrope (bloodstone — green jasper with red spots) takes its name from the Greek for sun-turning, because the plant of the same name turns toward the Sun. The stone was believed to make its bearer respected and powerful, to grant access to kings, and to preserve health. This is a stone whose Solar virtue is its orientation toward the light source rather than a colour correspondence.'},
  ]},
  herbs:{ label:'Herbs & Plants', icon:'⚘', items:[
    {name:'Celandine', explain:'Greater celandine (Chelidonium majus) produces a bright orange-yellow sap — its most visible Solar signature. The sap was used medicinally for eye complaints (Solar — the Sun governs the right eye), for liver conditions (Jovial in the system, but Solar treatments often overlapped), and for warts. In the doctrine of signatures its brilliant colour was the direct physical mark of Solar virtue.'},
    {name:"St. John's Wort", explain:'Hypericum perforatum is the Solar herb par excellence. It blooms at the summer solstice (the Sun\'s maximum); its yellow flowers are the Sun\'s colour; its oil turns red in sunlight, yielding a blood-like substance used to treat wounds. Its folk name connects it to St. John\'s day — the Christianised summer solstice feast. Medicinally it was used for melancholy (counteracting Saturn with the Sun) and for nerve pain.'},
    {name:'Eyebright', explain:'Eyebright (Euphrasia officinalis) is Solar through its governance of sight — the Sun governs the right eye and light itself is Solar. The plant was used for inflamed and failing eyes, and its name is exactly its therapeutic indication under the doctrine of signatures. In Agrippa\'s logic, a plant that treats the Solar organ must participate in Solar virtue and can be used in Solar operations involving illumination and clarity.'},
    {name:'Bay Laurel', explain:'The laurel is the Solar tree above all others — Apollo\'s tree, the crown of victors and poets, the plant of prophecy and fame. Its aromatic quality, its evergreen nature, and its deep mythological connection to the Sun god made it the primary Solar herb for incense, crowns, and magical operations. Bay laurel leaves burned as Solar incense drove away evil spirits and illness.'},
    {name:'Heliotrope (plant)', explain:'The heliotrope plant (Heliotropium) turns its flowers toward the Sun throughout the day — this behaviour is its Solar signature in the most literal sense possible. It enacts the principle of celestial sympathy in its own growth. Used in Solar magic for visibility, illumination, and favour of great persons. The stone heliotrope (bloodstone) takes its name from this plant\'s Solar orientation.'},
    {name:'Chamomile', explain:'Chamomile\'s daisy-like flowers are Solar in form (radiating petals around a yellow center — the paradigmatic sun-form) and in their warmth and cheering quality. It was used medicinally as an anti-inflammatory and digestive, and in magical practice for Solar operations of warmth and comfort. Its scent was considered uplifting — opposed to Saturnian depression and heaviness.'},
    {name:'Saffron', explain:'Saffron — the most expensive spice in medieval and Renaissance Europe — is Solar in colour (the intense gold-orange of its stigmas) and in quality (warming, vital, antidepressant). It was used medicinally to lift melancholy, to strengthen the heart, and to treat fevers. Its rarity and value gave it a Solar dignity: as gold is the rarest metal, saffron is the most precious herb.'},
  ]},
  metals:{ label:'Metals', icon:'⊕', items:[
    {name:'Gold', explain:'Gold is the Solar metal — this equivalence is among the most ancient and universal in the Western tradition. Gold is incorruptible (it does not rust or tarnish), maximally brilliant, and the most valuable of metals. It is the alchemical end-product — the perfection toward which all metals tend when subjected to the Sun\'s virtue over time. Solar talismans were made in gold; the Sun\'s image was engraved in gold for the highest operations.'},
  ]},
  animals:{ label:'Animals', icon:'⁂', items:[
    {name:'Lion', explain:'The lion is the Solar animal of the land — the king of beasts corresponding to the Sun as king of planets. Its mane suggests the Sun\'s rays; its roar commands silence; it hunts boldly in daylight. Regulus, the Behenian fixed star at the heart of Leo (the lion\'s constellation), is directly named "the little king" and shares Solar-Jovial-Martial qualities. Lion imagery on Solar talismans was used for authority and health.'},
    {name:'Cock', explain:'The rooster heralds the Sun — its crow signals the dawn, making it the Solar bird of awakening and light\'s return. In numerous traditions the cock was the enemy of night and of all things that depended on darkness (evil spirits, witches, certain demons). Its crow was believed to cause them to flee at the approach of light. Solar operations sometimes incorporated the cock\'s call or its image.'},
    {name:'Crocodile', explain:'The crocodile appears under both Saturn and the Sun — its Saturnian quality is its cold, ancient, death-dealing character; its Solar quality comes from ancient Egypt, where the crocodile god Sobek was associated with the Sun\'s power and with kingly authority. Agrippa includes it here through this Egyptian-Solar strand of the tradition, which reached him through Ficino and the Hermetic literature.'},
    {name:'Deer', explain:'The deer (and specifically the stag) is Solar through its association with the chase and with royal hunting, which was a Solar activity (done in daylight, aristocratic, involving the taming of wild nature). The stag\'s antlers were also compared to the Sun\'s rays. In Celtic tradition the stag was a solar symbol, and this strand reaches Agrippa through the syncretic gathering of correspondences from multiple traditions.'},
    {name:'Bull', explain:'The bull is Solar in its association with power, virility, and with the solar cults of the ancient Near East — the bull was the sacred animal of many solar deities. In Egyptian tradition the Apis bull was a Solar manifestation; in Mithraic cult the bull\'s sacrifice released the Sun\'s life-giving power. The bull\'s connection to agriculture also linked it to the Sun\'s annual cycle.'},
