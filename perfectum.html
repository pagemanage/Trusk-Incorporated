}},

}; /* end DATA */

const ORDER = [
  'saturn','jupiter','mars','sun','venus','mercury','moon',
  'algol','pleiades','aldebaran','capella','sirius','procyon',
  'regulus','alkaid','gienah','spica','arcturus','alphecca',
  'antares','vega','deneb'
];

let sel = { body:null, cat:null, item:null };

/* ── INIT ── */
(function init(){
  const b = document.getElementById('col0-body');
  let lastGroup = null;
  ORDER.forEach(key => {
    const d = DATA[key];
    if(d.group !== lastGroup){
      const sec = document.createElement('div');
      sec.className = 'col-section';
      sec.textContent = d.group === 'planet' ? 'Seven Planets' : 'Behenian Fixed Stars';
      b.appendChild(sec);
      lastGroup = d.group;
    }
    const el = document.createElement('div');
    el.className = 'entry';
    el.dataset.key = key;
    el.dataset.accent = d.accent;
    el.innerHTML = `<span class="entry-glyph">${d.glyph}</span>
      <div class="entry-inner">
        <div class="entry-name">${d.name}</div>
        <div class="entry-sub">${d.sub}</div>
      </div>
      <span class="entry-arrow">›</span>`;
    el.addEventListener('click', () => selectBody(key, el));
    b.appendChild(el);
  });
})();

/* ── SELECT BODY ── */
function selectBody(key, el){
  document.querySelectorAll('#col0-body .entry').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  sel.body = key; sel.cat = null; sel.item = null;

  const d = DATA[key];
  const cats = Object.entries(d.categories);
  document.getElementById('col1-label').textContent = d.name;
  document.getElementById('col1-count').textContent = cats.length;

  const body = document.getElementById('col1-body');
  body.innerHTML = '';
  cats.forEach(([catKey, cat]) => {
    const el2 = document.createElement('div');
    el2.className = 'entry';
    el2.dataset.accent = d.accent;
    el2.innerHTML = `<span class="entry-glyph">${cat.icon}</span>
      <div class="entry-inner">
        <div class="entry-name">${cat.label}</div>
        <div class="entry-sub">${cat.items.length} entr${cat.items.length===1?'y':'ies'}</div>
      </div>
      <span class="entry-arrow">›</span>`;
    el2.addEventListener('click', () => selectCat(catKey, el2));
    body.appendChild(el2);
  });

  document.getElementById('col-1').classList.remove('hidden');
  document.getElementById('col-2').classList.add('hidden');
  document.getElementById('col-3').classList.add('hidden');
  updateBreadcrumb();
  scrollTo('col-1');
}

/* ── SELECT CATEGORY ── */
function selectCat(catKey, el){
  document.querySelectorAll('#col1-body .entry').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  sel.cat = catKey; sel.item = null;

  const d = DATA[sel.body];
  const cat = d.categories[catKey];
  document.getElementById('col2-label').textContent = cat.label;
  document.getElementById('col2-count').textContent = cat.items.length;

  const body = document.getElementById('col2-body');
  body.innerHTML = '';
  cat.items.forEach((item, i) => {
    const el3 = document.createElement('div');
    el3.className = 'entry';
    el3.dataset.accent = d.accent;
    el3.dataset.idx = i;
    el3.innerHTML = `<div class="entry-inner">
        <div class="entry-name">${item.name}</div>
      </div>
      <span class="entry-arrow">›</span>`;
    el3.addEventListener('click', () => selectItem(i, el3));
    body.appendChild(el3);
  });

  document.getElementById('col-2').classList.remove('hidden');
  document.getElementById('col-3').classList.add('hidden');
  updateBreadcrumb();
  scrollTo('col-2');
}

/* ── SELECT ITEM ── */
function selectItem(idx, el){
  document.querySelectorAll('#col2-body .entry').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  sel.item = idx;

  const d    = DATA[sel.body];
  const cat  = d.categories[sel.cat];
  const item = cat.items[idx];

  document.getElementById('col3-label').textContent = item.name;

  const accentVar = `var(--${d.accent})`;

  document.getElementById('col3-body').innerHTML = `
    <div class="detail-body">
      <div class="detail-context">
        <span>${d.name}</span>
        <span class="detail-context-sep">›</span>
        <span>${cat.label}</span>
      </div>
      <div class="detail-name">${item.name}</div>
      <div class="detail-accent-bar" style="background:${accentVar}"></div>
      <p class="detail-text">${item.explain}</p>
      <div class="detail-source">De Occulta Philosophia, Liber II · H.C. Agrippa von Nettesheim · ed. 1531<br>
        <em>With reference to Ptolemy, Tetrabiblos · Picatrix (Ghayat al-Hakim) · Ficino, De Vita Coelitus Comparanda</em>
      </div>
    </div>`;

  document.getElementById('col-3').classList.remove('hidden');
  updateBreadcrumb();
  scrollTo('col-3');
}

/* ── BREADCRUMB ── */
function updateBreadcrumb(){
  const bc = document.getElementById('breadcrumb');
  let parts = [];
  if(sel.body){
    parts.push(`<span class="hd-path-seg">${DATA[sel.body].name}</span>`);
  }
  if(sel.cat){
    const cat = DATA[sel.body].categories[sel.cat];
    parts.push(`<span class="hd-path-sep">›</span><span class="hd-path-seg">${cat.label}</span>`);
  }
  if(sel.item !== null){
    const item = DATA[sel.body].categories[sel.cat].items[sel.item];
    parts.push(`<span class="hd-path-sep">›</span><span class="hd-path-seg active">${item.name}</span>`);
  }
  bc.innerHTML = parts.length
    ? parts.join('')
    : '<span class="hd-path-seg">Select a celestial body</span>';
}

function scrollTo(id){
  setTimeout(() => {
    document.getElementById(id)?.scrollIntoView({behavior:'smooth',inline:'start',block:'nearest'});
  }, 40);
}
</script>

</body>
</html>
