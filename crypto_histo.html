<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #f4f3ef;
  color: #1a1a1a;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  padding: 20px;
}
h1 {
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.sub { font-size: 10px; color: #888; margin-bottom: 14px; }

.controls {
display: flex;
flex-wrap: wrap;
gap: 5px;
margin-bottom: 14px;
align-items: center;
}
.controls label { font-size: 10px; color: #888; margin-right: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
button {
font-family: ‘Courier New’, monospace;
font-size: 10px;
font-weight: bold;
background: #1a1a1a;
color: #f4f3ef;
border: none;
padding: 3px 8px;
cursor: pointer;
letter-spacing: 0.06em;
}
button.inactive { background: #ccc; color: #666; }
button:hover { background: #444; }

.chart-scroll { overflow-x: auto; }
.chart {
display: flex;
align-items: flex-end;
gap: 4px;
min-height: 220px;
border-bottom: 1px solid #aaa;
padding-bottom: 0;
width: max-content;
min-width: 100%;
}
.col {
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-end;
min-width: 52px;
height: 220px;
}
.bar-wrap {
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-end;
width: 100%;
height: 100%;
}
.count { font-size: 9px; color: #555; font-weight: bold; margin-bottom: 2px; }
.bar {
width: 100%;
background: #1a1a1a;
padding: 2px 1px;
display: flex;
flex-direction: column;
gap: 1px;
overflow: hidden;
}
.chip {
font-size: 7.5px;
font-weight: bold;
padding: 1px 3px;
line-height: 1.15;
white-space: nowrap;
overflow: hidden;
text-overflow: clip;
cursor: default;
letter-spacing: 0.02em;
}
/* exchange count brightness */
.ex1 { background: #3a3a3a; color: #888; }
.ex2 { background: #555; color: #bbb; }
.ex3 { background: #888; color: #f0f0f0; }
.ex4 { background: #d0d0d0; color: #111; }

.year-row {
display: flex;
gap: 4px;
width: max-content;
min-width: 100%;
margin-bottom: 16px;
}
.year-label {
font-size: 9px;
color: #888;
text-align: center;
min-width: 52px;
padding-top: 3px;
}

/* legend */
.legend {
display: flex;
flex-wrap: wrap;
gap: 4px 16px;
margin-bottom: 16px;
align-items: center;
}
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #555; }
.swatch { width: 16px; height: 10px; display: inline-block; }

/* detail panel */
.legend-groups {
display: flex;
flex-wrap: wrap;
gap: 12px 24px;
margin-top: 16px;
border-top: 1px solid #ccc;
padding-top: 12px;
}
.lg { }
.lg-year { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
.lg-chips { display: flex; flex-wrap: wrap; gap: 2px; }
.lc {
font-size: 9px; font-weight: bold;
padding: 1px 5px;
cursor: default;
}

.tooltip {
position: fixed;
background: #1a1a1a;
color: #eee;
font-size: 10px;
padding: 7px 10px;
pointer-events: none;
z-index: 999;
display: none;
line-height: 1.7;
max-width: 200px;
}
.tooltip.on { display: block; }
.tooltip b { color: #aaa; font-size: 9px; display: block; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 3px; }
</style>

</head>

let currentFilter = 'all';

function exClass(ex) {
  const n = ex.length;
  if (n >= 3) return 'ex3';
  if (n === 2) return 'ex2';
  return 'ex1';
}

function visible(coin) {
  if (currentFilter === 'all') return true;
  if (currentFilter === 'R') return coin.ex.includes('R');
  if (currentFilter === 'B') return coin.ex.includes('B');
  if (currentFilter === 'K') return coin.ex.includes('K');
  if (currentFilter === 'multi') return coin.ex.length >= 2;
  if (currentFilter === 'all3') return coin.ex.length >= 3;
  return true;
}

function setFilter(f) {
  currentFilter = f;
  ['all','R','B','K','multi','all3'].forEach(x => {
    document.getElementById('btn-'+x).className = x === f ? '' : 'inactive';
  });
  render();
}

function render() {
  const filtered = coins.filter(visible);
  const years = [...new Set(filtered.map(c=>c.y))].sort((a,b)=>a-b);

  const maxCount = Math.max(...years.map(y => filtered.filter(c=>c.y===y).length));

  const chart = document.getElementById('chart');
  const yearsEl = document.getElementById('years');
  const groups = document.getElementById('groups');
  chart.innerHTML = '';
  yearsEl.innerHTML = '';
  groups.innerHTML = '';

  years.forEach(y => {
    const group = filtered.filter(c=>c.y===y);
    const pct = group.length / maxCount;
    const barH = Math.max(pct * 200, 6);

    const col = document.createElement('div');
    col.className = 'col';

    const bw = document.createElement('div');
    bw.className = 'bar-wrap';

    const cnt = document.createElement('div');
    cnt.className = 'count';
    cnt.textContent = group.length;

    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = barH + 'px';

    group.forEach(c => {
      const chip = document.createElement('div');
      chip.className = 'chip ' + exClass(c.ex);
      chip.textContent = c.s;
      chip.addEventListener('mousemove', e => {
        const tip = document.getElementById('tip');
        tip.className = 'tooltip on';
        tip.innerHTML = `<b>${c.s} · ${y}</b>${c.n}<br>${c.ex.join(' · ')}`;
        tip.style.left = (e.clientX+12)+'px';
        tip.style.top = (e.clientY+12)+'px';
      });
      chip.addEventListener('mouseleave', () => {
        document.getElementById('tip').className = 'tooltip';
      });
      bar.appendChild(chip);
    });

    bw.appendChild(cnt);
    bw.appendChild(bar);
    col.appendChild(bw);
    chart.appendChild(col);

    const yl = document.createElement('div');
    yl.className = 'year-label';
    yl.textContent = y;
    yearsEl.appendChild(yl);

    // legend group
    const lg = document.createElement('div');
    lg.className = 'lg';
    lg.innerHTML = `<div class="lg-year">${y}</div><div class="lg-chips">${
      group.map(c => `<span class="lc ${exClass(c.ex)}" title="${c.n} · ${c.ex.join(', ')}">${c.s}</span>`).join('')
    }</div>`;
    groups.appendChild(lg);
  });
}

render();
</script>

</body>
</html>
