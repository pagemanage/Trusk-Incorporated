body {

font-size: 11px;
padding: 18px;
line-height: 1.3;

font-size: 11px;

color: #888;
border-bottom: 1px solid #333;
padding-bottom: 6px;

#search {

text-transform: uppercase;

padding-left: 2px;
}

.coins {
display: flex;
flex-wrap: wrap;
gap: 4px;
}

.coin {
display: inline-block;
border: 1px solid #3a3a3a;
background: #222;
padding: 3px 6px;
font-size: 11px;
color: #c8c8c8;
text-decoration: none;
cursor: pointer;
white-space: nowrap;
transition: background 0.08s, border-color 0.08s, color 0.08s;
user-select: none;
}

.coin:hover {
background: #2e2e2e;
border-color: #888;
color: #fff;
}

.coin .sym {
color: #e8e8e8;
font-weight: bold;
}

.coin .nm {
color: #666;
margin-left: 4px;
font-size: 10px;
}

.hidden { display: none !important; }

footer {
margin-top: 20px;
border-top: 1px solid #2a2a2a;
padding-top: 8px;
color: #444;
font-size: 10px;
}

function render(q) {
  q = (q||'').toLowerCase();
  const main = document.getElementById('main');
  main.innerHTML = '';
  groups.forEach(g => {
    const filtered = g.coins.filter(c =>
      !q || c.s.toLowerCase().includes(q) || c.n.toLowerCase().includes(q)
    );
    if (!filtered.length) return;
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `<div class="section-label">${g.label}</div><div class="coins">${
      filtered.map(c => `<a class="coin" href="https://${c.u}" target="_blank" rel="noopener" title="${c.u}"><span class="sym">${c.s}</span><span class="nm">${c.n}</span></a>`).join('')
    }</div>`;
    main.appendChild(sec);
  });
}
